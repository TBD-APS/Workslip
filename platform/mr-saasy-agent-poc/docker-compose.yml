name: mr-saasy-agent-poc

services:
  temporal:
    image: temporalio/temporal:1.8.1
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

  sandbox-broker:
    build:
      context: .
      dockerfile: sandbox_broker/Dockerfile
    environment:
      SANDBOX_IMAGE: python:3.12-slim
      SANDBOX_BROKER_PORT: "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 1s

  worker:
    build:
      context: .
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: mr-saasy-agent-poc
      POC_STATE_FILE: /state/tool-effects.json
      SANDBOX_BROKER_URL: http://sandbox-broker:8080
    volumes:
      - poc-state:/state
    depends_on:
      temporal:
        condition: service_started
      sandbox-broker:
        condition: service_healthy

volumes:
  poc-state:
