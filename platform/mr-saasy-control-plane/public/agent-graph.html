<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MR SAAS'y · Agent Graph</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.11.3/dist/style.css" />
<style>
:root{color-scheme:dark;--bg:#091013;--panel:#10191d;--line:#29404a;--text:#ecf4f5;--muted:#8ea2a9;--orange:#f47a24;--teal:#35b8b1;--red:#ef6464;--green:#58c783;--yellow:#f0c35b}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at 30% 0,#183139 0,#091013 43%);color:var(--text)}button{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;justify-content:space-between;gap:20px;padding:18px 22px;border-bottom:1px solid #1f3037;background:rgba(9,16,19,.86);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.brand strong{display:block;font-size:1rem}.brand span,.meta{color:var(--muted);font-size:.78rem}.live{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #2e444d;border-radius:999px}.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px var(--yellow)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}.stage{position:relative;padding:28px;min-height:730px}.graph{height:650px;border:1px solid #20353e;border-radius:24px;overflow:hidden;background:#0b1418}.side{border-left:1px solid #20323a;background:rgba(12,20,24,.91);padding:18px;overflow:auto}.side h2{margin:0 0 4px;font-size:1rem}.side p{margin:0 0 18px;color:var(--muted);font-size:.78rem;line-height:1.45}.section{margin-top:22px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#b7c7cc}.task{padding:11px;border:1px solid #2a414a;border-radius:13px;background:#101b20;margin:8px 0;cursor:grab}.task:active{cursor:grabbing}.task strong{font-size:.82rem;display:block}.task small{display:block;color:var(--muted);margin-top:4px}.activity{border-left:1px solid #304650;padding-left:12px;margin:10px 0}.activity strong{display:block;font-size:.76rem}.activity span{font-size:.69rem;color:var(--muted)}.detail{padding:12px;border-radius:14px;background:#0d171b;border:1px solid #273b44;min-height:88px;font-size:.78rem;color:#c9d7db;line-height:1.45}.banner{margin:0 28px 14px;padding:10px 13px;border:1px solid rgba(240,195,91,.28);background:rgba(240,195,91,.08);border-radius:12px;color:#dfc987;font-size:.76rem}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;background:#18282f;border:1px solid #3d5862;border-radius:12px;padding:10px 14px;transition:.2s;z-index:20;font-size:.8rem}.toast.show{opacity:1;transform:translate(-50%,0)}.saasy-node{width:170px;min-height:94px;border:1px solid #35505a;border-radius:17px;background:#101b20;color:var(--text);padding:12px;box-shadow:0 12px 28px rgba(0,0,0,.24);cursor:pointer;text-align:left}.saasy-node:hover,.saasy-node.selected{border-color:var(--orange)}.saasy-node.agent-capable.dragover{outline:2px dashed var(--orange);outline-offset:4px}.node-kind{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.node-name{font-weight:850;font-size:1rem;margin-top:4px}.node-status{margin-top:8px;display:flex;gap:6px;align-items:center;font-size:.73rem;color:var(--muted)}.status-dot{width:7px;height:7px;border-radius:50%;background:#74868d}.running .status-dot{background:var(--green)}.waiting .status-dot{background:var(--yellow)}.blocked .status-dot{background:var(--red)}.react-flow__edge-text{font-size:11px;fill:#a8bbc1}.react-flow__edge-textbg{fill:#0b1418}.react-flow__controls button{background:#142127;color:#dce8eb;border-color:#29404a}.react-flow__minimap{background:#0d171b;border:1px solid #29404a;border-radius:10px}.react-flow__attribution{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #20323a}.stage{min-height:580px;padding:14px}.graph{height:570px}.banner{margin:0 14px 12px}}
</style>
</head>
<body><div id="root"></div>
<script type="module">
import React, { useCallback, useEffect, useMemo, useState } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import { ReactFlow, Background, Controls, MiniMap, MarkerType } from 'https://esm.sh/@xyflow/react@12.11.3?deps=react@18.3.1,react-dom@18.3.1';

const h=React.createElement;
const positions={pi:{x:360,y:65},kimi:{x:80,y:200},backend:{x:80,y:450},reviewer:{x:610,y:165},github:{x:360,y:490},linear:{x:650,y:430},ci:{x:650,y:300}};
const capable=new Set(['agent','orchestrator','reviewer']);

function AgentNode({data}){
  const [over,setOver]=useState(false);
  const canDrop=capable.has(data.kind);
  return h('button',{
    type:'button',
    className:`saasy-node ${data.status} ${canDrop?'agent-capable':''} ${over?'dragover':''} ${data.selected?'selected':''}`,
    onClick:()=>data.onSelect(data.id),
    onDragOver:e=>{if(!canDrop)return;e.preventDefault();setOver(true)},
    onDragLeave:()=>setOver(false),
    onDrop:e=>{if(!canDrop)return;e.preventDefault();setOver(false);data.onDropTask(e.dataTransfer.getData('text/task-id'),data.id)},
  },[
    h('span',{className:'node-kind',key:'kind'},data.kind),
    h('div',{className:'node-name',key:'name'},data.label),
    h('div',{className:'node-status',key:'status'},[h('span',{className:'status-dot',key:'dot'}),data.status]),
  ]);
}
const nodeTypes={agent:AgentNode};

function App(){
  const [snapshot,setSnapshot]=useState(null);
  const [mode,setMode]=useState('Loading graph…');
  const [execution,setExecution]=useState(false);
  const [selected,setSelected]=useState(null);
  const [toast,setToast]=useState('');

  const notify=useCallback(message=>{setToast(message);window.setTimeout(()=>setToast(''),2600)},[]);
  const load=useCallback(async()=>{
    const res=await fetch('/api/agent-graph',{headers:{Accept:'application/json'}});
    if(!res.ok)throw new Error('graph_unavailable');
    const data=await res.json();setSnapshot(data.snapshot);setMode(data.mode);setExecution(Boolean(data.executionEnabled));
  },[]);
  useEffect(()=>{load().catch(()=>{setMode('graph unavailable');notify('Could not load Agent Graph')})},[load,notify]);

  const previewDelegation=useCallback(async(taskId,to)=>{
    if(!taskId||!snapshot)return;
    const task=snapshot.tasks.find(t=>t.id===taskId);const from=task?.owner||'pi';
    const qs=new URLSearchParams({taskId,to,from});
    const res=await fetch('/api/agent-graph/preview-delegation?'+qs,{headers:{Accept:'application/json'}});
    const data=await res.json();
    if(!res.ok){notify(data.message||'Delegation blocked');return}
    setSnapshot(data.snapshot);notify(`${taskId} → ${to} previewed`);
  },[snapshot,notify]);

  const nodes=useMemo(()=>snapshot?.nodes.map((n,index)=>({
    id:n.id,type:'agent',position:positions[n.id]||{x:300+(index%3)*210,y:120+Math.floor(index/3)*170},
    data:{...n,selected:selected===n.id,onSelect:setSelected,onDropTask:previewDelegation},
    draggable:true,
  }))||[],[snapshot,selected,previewDelegation]);
  const edges=useMemo(()=>snapshot?.edges.map((e,index)=>({
    id:e.id||`${e.from}-${e.to}-${index}`,source:e.from,target:e.to,label:e.label,
    animated:e.status==='active',markerEnd:{type:MarkerType.ArrowClosed},
    style:{stroke:e.status==='active'?'#35b8b1':'#3e5b66',strokeWidth:2},
    labelStyle:{fill:'#a8bbc1',fontWeight:650},labelBgStyle:{fill:'#0b1418',fillOpacity:.88},
  }))||[],[snapshot]);
  const selectedNode=snapshot?.nodes.find(n=>n.id===selected);

  return h('div',{className:'shell'},[
    h('header',{className:'top',key:'top'},[
      h('div',{className:'brand',key:'brand'},[h('strong',{key:'s'},"MR SAAS'y · Agent Graph"),h('span',{key:'sp'},'Who talks to what, why, and what is blocking delivery')]),
      h('div',{className:'live',key:'live'},[h('span',{className:'dot',key:'d'}),h('span',{className:'meta',key:'m'},`${mode} · execution ${execution?'on':'off'}`)])
    ]),
    h('div',{key:'body'},[
      h('div',{className:'banner',key:'banner'},'Wiring prototype: projection and delegation preview are real control-plane behavior. Execution remains disabled until authenticated commands + event-store infrastructure are available.'),
      h('div',{className:'layout',key:'layout'},[
        h('main',{className:'stage',key:'stage'},h('div',{className:'graph'},snapshot?h(ReactFlow,{nodes,edges,nodeTypes,fitView:true,fitViewOptions:{padding:.18},minZoom:.35,maxZoom:1.8,nodesDraggable:true,nodesConnectable:false,elementsSelectable:true,proOptions:{hideAttribution:true}},[
          h(Background,{key:'bg',gap:28,size:1,color:'#20343c'}),h(Controls,{key:'controls'}),h(MiniMap,{key:'mini',nodeColor:n=>capable.has(n.data.kind)?'#147a7e':'#334a54',maskColor:'rgba(9,16,19,.72)'})
        ]):h('div',{className:'detail'},'Loading graph…'))),
        h('aside',{className:'side',key:'side'},[
          h('h2',{key:'h'},'Control room'),h('p',{key:'p'},'Pan, zoom and move nodes freely. Drag a task onto Pi, Kimi, Backend or Reviewer to preview a handoff.'),
          h('div',{className:'detail',key:'detail'},selectedNode?[h('strong',{key:'n'},selectedNode.label),h('br',{key:'b1'}),selectedNode.detail||'No detail',h('br',{key:'b2'}),h('br',{key:'b3'}),h('span',{className:'meta',key:'k'},`${selectedNode.kind} · ${selectedNode.status}`)]:'Select a node.'),
          h('div',{className:'section',key:'tasks'},[h('div',{className:'section-title',key:'title'},[h('span',{key:'a'},'Tasks'),h('span',{key:'b'},String(snapshot?.tasks.length||0))]),...(snapshot?.tasks||[]).map(t=>h('div',{className:'task',draggable:true,key:t.id,onDragStart:e=>e.dataTransfer.setData('text/task-id',t.id)},[h('strong',{key:'s'},t.title),h('small',{key:'m'},`${t.id} · ${t.status} · ${t.owner?'owner '+t.owner:'unassigned'}`)]))]),
          h('div',{className:'section',key:'activity'},[h('div',{className:'section-title',key:'title'},[h('span',{key:'a'},'Activity'),h('span',{key:'b'},'latest')]),...(snapshot?.activity||[]).slice(0,12).map((a,i)=>h('div',{className:'activity',key:`${a.type}-${i}`},[h('strong',{key:'s'},a.summary),h('span',{key:'m'},`${a.type} · ${a.at}`)]))])
        ])
      ])
    ]),
    h('div',{className:`toast ${toast?'show':''}`,key:'toast'},toast)
  ]);
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body></html>
