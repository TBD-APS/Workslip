deptrac:
  paths:
    - ./app
  layers:
    - name: PlatformContracts
      collectors:
        - type: directory
          value: app/Platform/Contracts/.*

    - name: TenantPolicy
      collectors:
        - type: directory
          value: app/Platform/(Tenant|Policy)/.*

    - name: Audit
      collectors:
        - type: directory
          value: app/Platform/Audit/.*

    - name: AiApplication
      collectors:
        - type: directory
          value: app/AI/(Application|Agents)/.*

    - name: AiContext
      collectors:
        - type: directory
          value: app/AI/Context/.*

    - name: ProviderContracts
      collectors:
        - type: directory
          value: app/AI/Providers/Contracts/.*

    - name: ProviderAdapters
      collectors:
        - type: directory
          value: app/AI/Providers/(?!Contracts/).*

    - name: ProductAdapterContracts
      collectors:
        - type: directory
          value: app/ProductAdapters/Contracts/.*

    - name: ProductAdapters
      collectors:
        - type: directory
          value: app/ProductAdapters/(?!Contracts/).*

    - name: InfrastructurePersistence
      collectors:
        - type: directory
          value: app/Infrastructure/Persistence/.*

    - name: InfrastructureHttp
      collectors:
        - type: directory
          value: app/Infrastructure/Http/.*

    - name: InfrastructureSecrets
      collectors:
        - type: directory
          value: app/Infrastructure/Secrets/.*

  ruleset:
    PlatformContracts: ~
    TenantPolicy:
      - PlatformContracts
    Audit: ~
    AiApplication:
      - PlatformContracts
      - TenantPolicy
      - Audit
      - AiContext
      - ProviderContracts
    AiContext:
      - PlatformContracts
      - TenantPolicy
      - Audit
      - ProductAdapterContracts
    ProviderContracts: ~
    ProviderAdapters:
      - ProviderContracts
      - InfrastructureHttp
    ProductAdapterContracts:
      - PlatformContracts
    ProductAdapters:
      - ProductAdapterContracts
      - InfrastructureHttp
    InfrastructurePersistence:
      - PlatformContracts
    InfrastructureHttp: ~
    InfrastructureSecrets: ~
