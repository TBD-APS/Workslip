deptrac:
  paths:
    - ./Fixtures/Legal
  layers:
    - name: ProviderContracts
      collectors:
        - type: directory
          value: Fixtures/Legal/ProviderContracts/.*
    - name: ProviderAdapters
      collectors:
        - type: directory
          value: Fixtures/Legal/Providers/.*
    - name: InfrastructureHttp
      collectors:
        - type: directory
          value: Fixtures/Legal/Http/.*
  ruleset:
    ProviderContracts: ~
    ProviderAdapters:
      - ProviderContracts
      - InfrastructureHttp
    InfrastructureHttp: ~
