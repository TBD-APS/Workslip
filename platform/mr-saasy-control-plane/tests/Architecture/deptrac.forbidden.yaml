deptrac:
  paths:
    - ./tests/Architecture/Fixtures/Forbidden
  layers:
    - name: AiApplication
      collectors:
        - type: directory
          value: tests/Architecture/Fixtures/Forbidden/Application/.*
    - name: ProviderAdapters
      collectors:
        - type: directory
          value: tests/Architecture/Fixtures/Forbidden/Providers/.*
    - name: InfrastructurePersistence
      collectors:
        - type: directory
          value: tests/Architecture/Fixtures/Forbidden/Persistence/.*
  ruleset:
    AiApplication: ~
    ProviderAdapters: ~
    InfrastructurePersistence: ~
