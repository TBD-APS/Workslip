name: WOR-107 Superadmin page validation

on:
  push:
    branches:
      - rbj--107-superadmin-organization-admin
  pull_request:
    branches:
      - main
    paths:
      - "src/BE/WorkslipApi/**"
      - "src/FE/**"
      - ".github/workflows/wor-107-superadmin-page-validation.yml"

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BE/WorkslipApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Workslip.slnx
      - name: Build
        run: dotnet build Workslip.slnx --configuration Release --no-restore
      - name: Organization tests
        run: >-
          dotnet test Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~Workslip.Tests.Organizations"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Install
        run: npm ci
      - name: Generate API client
        run: VITE_API_BASE_URL=https://api-mrsoftware-prod.azurewebsites.net npm run orval
      - name: Targeted lint
        run: >-
          npx eslint
          src/components/layouts/AppLayout.tsx
          src/providers/permissions/permissions.ts
          src/features/superadmin/api.ts
          src/features/superadmin/types.ts
          src/features/superadmin/components/OrganizationCreateForm.tsx
          src/features/superadmin/components/AdminInviteForm.tsx
          src/features/superadmin/routes/SuperAdmin.tsx
      - name: Build
        run: npm run build

  postman:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--107-superadmin-organization-admin
      - name: Update Superadmin organization requests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src/BE/WorkslipApi/Postman/postman_collection.json")
          collection = json.loads(path.read_text(encoding="utf-8"))
          organizations = next(item for item in collection["item"] if item.get("name") == "Organizations")
          items = organizations["item"]

          list_url = "{{baseUrl}}/api/organizations/"
          list_item = next(
              (
                  item for item in items
                  if item.get("request", {}).get("method") == "GET"
                  and item.get("request", {}).get("url", {}).get("raw") == list_url
              ),
              None,
          )
          if list_item is None:
              items.insert(
                  0,
                  {
                      "name": "/api/organizations",
                      "request": {
                          "method": "GET",
                          "header": [],
                          "url": {
                              "raw": list_url,
                              "host": ["{{baseUrl}}"],
                              "path": ["api", "organizations", ""],
                          },
                          "description": "Superadmin-only list used by the /superadmin page.",
                      },
                      "response": [],
                      "event": [
                          {
                              "listen": "test",
                              "script": {
                                  "type": "text/javascript",
                                  "exec": [
                                      "pm.test('200 OK', function () { pm.response.to.have.status(200); });",
                                      "const json = pm.response.json();",
                                      "pm.test('organization array returned', function () { pm.expect(json).to.be.an('array'); });",
                                      "pm.test('organization contract returned', function () { if (json.length > 0) { pm.expect(json[0]).to.include.all.keys('id', 'name', 'cvr'); } });",
                                  ],
                              },
                          }
                      ],
                  },
              )

          admin_url = "{{baseUrl}}/api/organizations/{{organizationId}}/admin"
          admin_item = next(
              item for item in items
              if item.get("request", {}).get("method") == "PUT"
              and item.get("request", {}).get("url", {}).get("raw") == admin_url
          )
          admin_item["request"]["description"] = (
              "Superadmin-only administrator assignment. Sends a Microsoft Entra B2B invitation for a new identity, "
              "assigns the Entra Admin app role, and creates or updates the local Admin row."
          )
          exec_lines = admin_item["event"][0]["script"]["exec"]
          invitation_assertion = (
              "pm.test('Entra invitation status returned', function () { "
              "pm.expect(json.entraInvitationSent).to.be.a('boolean'); });"
          )
          if invitation_assertion not in exec_lines:
              exec_lines.insert(-1, invitation_assertion)

          path.write_text(
              json.dumps(collection, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate Postman JSON
        run: python -m json.tool src/BE/WorkslipApi/Postman/postman_collection.json > /dev/null
      - name: Commit Postman update
        run: |
          if git diff --quiet -- src/BE/WorkslipApi/Postman/postman_collection.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BE/WorkslipApi/Postman/postman_collection.json
          git commit -m "WOR-107 update Superadmin Postman requests"
          git push origin HEAD:rbj--107-superadmin-organization-admin
