name: Infrastructure · Production reconcile

run-name: >-
  Infrastructure · ${{ inputs.operation }} · ${{ inputs.target }} ·
  ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview only, or reconcile the selected production boundary
        required: true
        default: plan
        type: choice
        options:
          - plan
          - reconcile
      target:
        description: Select the exact protected Azure boundary
        required: true
        default: new-tenant
        type: choice
        options:
          - new-tenant
          - current-production
      confirmation:
        description: Type the confirmation phrase shown in the runbook
        required: true
        type: string
      execution_mode:
        description: Standard keeps the canonical CI gate; emergency waives only that gate
        required: true
        default: standard
        type: choice
        options:
          - standard
          - emergency
      emergency_reason:
        description: Required for emergency only. Do not include secrets or customer data.
        required: false
        type: string
      emergency_acknowledge:
        description: I understand emergency mode waives only CI for this one run.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      operation:
        description: The selected infrastructure operation
        required: true
        type: string
      target:
        description: The immutable protected target
        required: true
        type: string
      confirmation:
        description: The action-specific confirmation phrase
        required: true
        type: string
      execution_mode:
        description: Standard or emergency CI-waiver execution
        required: false
        default: standard
        type: string
      emergency_reason:
        description: A non-secret operational reason for an emergency CI waiver
        required: false
        default: ''
        type: string
      emergency_acknowledge:
        description: Explicit acknowledgement required for emergency CI waiver
        required: false
        default: false
        type: boolean
    secrets:
      AZURE_TENANT_ID:
        description: Azure tenant for the selected protected deployment environment.
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: Azure subscription for the selected protected deployment environment.
        required: true

permissions:
  contents: read

concurrency:
  group: workslip-production
  cancel-in-progress: false

jobs:
  select-target:
    name: Infrastructure · Validate operator intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      github_environment: ${{ steps.target.outputs.github_environment }}
      environment: ${{ steps.target.outputs.environment }}
      company_name: ${{ steps.target.outputs.company_name }}
      location: ${{ steps.target.outputs.location }}
      resource_group: ${{ steps.target.outputs.resource_group }}
      webapp_name: ${{ steps.target.outputs.webapp_name }}
      api_identity_name: ${{ steps.target.outputs.api_identity_name }}
      log_analytics_workspace_name: ${{ steps.target.outputs.log_analytics_workspace_name }}
    steps:
      - name: Verify operator intent and emergency declaration
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          EMERGENCY_REASON: ${{ inputs.emergency_reason }}
          EMERGENCY_ACKNOWLEDGED: ${{ inputs.emergency_acknowledge }}
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo "::error::Production infrastructure may only be operated from main. Selected ref: ${GITHUB_REF}"
            exit 1
          fi

          case "${EXECUTION_MODE}:${OPERATION}:${TARGET}" in
            standard:plan:new-tenant)
              expected='PLAN NEW TENANT'
              ;;
            standard:plan:current-production)
              expected='PLAN CURRENT PRODUCTION'
              ;;
            standard:reconcile:new-tenant)
              expected='RECONCILE NEW TENANT'
              ;;
            standard:reconcile:current-production)
              expected='RECONCILE CURRENT PRODUCTION'
              ;;
            emergency:reconcile:new-tenant)
              expected='BREAK GLASS RECONCILE NEW TENANT'
              ;;
            emergency:reconcile:current-production)
              expected='BREAK GLASS RECONCILE CURRENT PRODUCTION'
              ;;
            *)
              echo "::error::Unsupported production execution mode, operation, or target: ${EXECUTION_MODE}:${OPERATION}:${TARGET}"
              exit 1
              ;;
          esac

          if [[ "${CONFIRMATION}" != "${expected}" ]]; then
            echo "::error::Confirmation must be exactly: ${expected}"
            exit 1
          fi

          if [[ "${EXECUTION_MODE}" == 'emergency' ]]; then
            if [[ "${EMERGENCY_ACKNOWLEDGED}" != 'true' ]]; then
              echo '::error::Select the emergency acknowledgement checkbox before waiving the CI gate.'
              exit 1
            fi
            normalized_reason=$(printf '%s' "${EMERGENCY_REASON}" | tr -d '\r\n')
            if [[ "${normalized_reason}" != "${EMERGENCY_REASON}" || ${#normalized_reason} -lt 20 || ${#normalized_reason} -gt 280 ]]; then
              echo '::error::Emergency mode requires one 20–280 character reason on a single line; do not include secrets or customer data.'
              exit 1
            fi
          fi

      - name: Checkout exact selected main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js for production gate
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Require exact green main CI Gate before Azure credentials
        if: ${{ inputs.execution_mode == 'standard' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release/verify-production-eligibility.mjs --sha "${GITHUB_SHA}"

      - name: Record emergency CI waiver
        if: ${{ inputs.execution_mode == 'emergency' }}
        shell: bash
        env:
          EMERGENCY_REASON: ${{ inputs.emergency_reason }}
        run: |
          set -Eeuo pipefail
          {
            echo '## Emergency infrastructure reconcile'
            echo
            echo '- CI gate: waived for this single run only'
            echo "- Triggering actor: \`${GITHUB_TRIGGERING_ACTOR}\`"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Target: \`${{ inputs.target }}\`"
            echo "- Reason: ${EMERGENCY_REASON}"
            echo '- Retained controls: `main` ref, immutable target mapping, protected GitHub environment approval, Azure OIDC, tenant/subscription check, and production concurrency.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve immutable target boundary
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail

          case "${TARGET}" in
            current-production)
              {
                echo 'github_environment=prod'
                echo 'environment=prod'
                echo 'company_name=mrsoftware'
                echo 'location=westeurope'
                echo 'resource_group=rg-mrsoftware-prod'
                echo 'webapp_name=api-mrsoftware-prod'
                echo 'api_identity_name=id-mrsoftware-prod'
                echo 'log_analytics_workspace_name=logAnal-mrsoftware-prod'
              } >> "${GITHUB_OUTPUT}"
              ;;
            new-tenant)
              {
                echo 'github_environment=live'
                echo 'environment=live'
                echo 'company_name=mrsoftwarev2'
                echo 'location=swedencentral'
                echo 'resource_group=rg-mrsoftwarev2-live'
                echo 'webapp_name=api-mrsoftwarev2-live'
                echo 'api_identity_name=id-mrsoftwarev2-live'
                echo 'log_analytics_workspace_name=logAnal-mrsoftwarev2-live'
              } >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unsupported production target: ${TARGET}"
              exit 1
              ;;
          esac

      - name: Verify selected GitHub deployment environment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT: ${{ steps.target.outputs.github_environment }}
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --environment "${GITHUB_ENVIRONMENT}"
            --branch main
          )
          if [[ "${TARGET}" == 'new-tenant' ]]; then
            args+=(
              --require-reviewers
              --required-reviewer-id 31623093
              --require-no-admin-bypass
            )
          fi
          node tools/release/verify-deployment-environment.mjs "${args[@]}"

  operate:
    name: Infrastructure · ${{ inputs.operation }} · ${{ inputs.target }}
    needs: select-target
    runs-on: windows-2022
    timeout-minutes: 75
    environment:
      name: ${{ needs.select-target.outputs.github_environment }}
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      TARGET_ENVIRONMENT: ${{ needs.select-target.outputs.environment }}
      TARGET_COMPANY_NAME: ${{ needs.select-target.outputs.company_name }}
      TARGET_LOCATION: ${{ needs.select-target.outputs.location }}
      AZURE_RESOURCE_GROUP: ${{ needs.select-target.outputs.resource_group }}
      AZURE_WEBAPP_NAME: ${{ needs.select-target.outputs.webapp_name }}
      API_IDENTITY_NAME: ${{ needs.select-target.outputs.api_identity_name }}
      LOG_ANALYTICS_WORKSPACE_NAME: ${{ needs.select-target.outputs.log_analytics_workspace_name }}
      INFRA_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
      CUSTOM_EMAIL_DOMAIN_ENABLED: ${{ vars.ACS_CUSTOM_DOMAIN_ENABLED || 'false' }}
    steps:
      - name: Checkout exact validated main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify protected Azure credentials are configured
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:INFRA_CLIENT_ID)) { $missing += 'AZURE_INFRA_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID)) { $missing += 'AZURE_TENANT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:SUBSCRIPTION_ID)) { $missing += 'AZURE_SUBSCRIPTION_ID' }
          if ($missing.Count -gt 0) {
            throw "GitHub environment '${{ needs.select-target.outputs.github_environment }}' is missing protected Azure configuration: $($missing -join ', ')."
          }

      - name: Azure login to selected protected boundary
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify immutable Azure target boundary
        shell: pwsh
        env:
          EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $account = & az account show --query '{tenantId:tenantId,subscriptionId:id}' --output json |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $account) {
            throw 'Azure CLI did not return the authenticated account boundary.'
          }
          if ([string]$account.tenantId -ne $env:EXPECTED_TENANT_ID) {
            throw 'Authenticated Azure tenant does not match the selected protected GitHub environment.'
          }
          if ([string]$account.subscriptionId -ne $env:EXPECTED_SUBSCRIPTION_ID) {
            throw 'Authenticated Azure subscription does not match the selected protected GitHub environment.'
          }

          $resourceGroupId = & az group show `
            --name $env:AZURE_RESOURCE_GROUP `
            --query id `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($resourceGroupId -join '').Trim())) {
            throw "Expected target resource group '$env:AZURE_RESOURCE_GROUP' was not found. Initial tenant bootstrap remains a local administrator operation."
          }

      - name: Preview all infrastructure phases without mutation
        if: ${{ inputs.operation == 'plan' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\src\BE\infrastructure\plan.ps1 `
            -Environment $env:TARGET_ENVIRONMENT `
            -Location $env:TARGET_LOCATION `
            -COMPANY_NAME $env:TARGET_COMPANY_NAME `
            -EnableCustomEmailDomain:($env:CUSTOM_EMAIL_DOMAIN_ENABLED -eq 'true')

      - name: Record plan evidence
        if: ${{ inputs.operation == 'plan' && success() }}
        shell: pwsh
        run: |
          @"
          ## Infrastructure production preview

          - SHA: ``$env:GITHUB_SHA``
          - Target: ``${{ inputs.target }}`` / ``$env:AZURE_RESOURCE_GROUP``
          - Mode: read-only ``plan.ps1``
          - Result: preview completed; no phase was allowed to mutate
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Ensure sqlcmd for approved reconcile
        if: ${{ inputs.operation == 'reconcile' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command sqlcmd -ErrorAction SilentlyContinue)) {
            choco install sqlcmd --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install sqlcmd with exit code $LASTEXITCODE."
            }
          }
          Get-Command sqlcmd -ErrorAction Stop | Out-Null

      - name: Re-verify current main immediately before reconcile
        if: ${{ inputs.operation == 'reconcile' }}
        shell: bash
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if [[ "${EXECUTION_MODE}" == 'standard' ]]; then
            node tools/release/verify-production-eligibility.mjs --sha "${GITHUB_SHA}"
            exit 0
          fi

          node <<'NODE'
          (async () => {
            const repository = process.env.GITHUB_REPOSITORY;
            const sha = process.env.GITHUB_SHA;
            const response = await fetch(`https://api.github.com/repos/${repository}/git/ref/heads/main`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) {
              throw new Error(`Unable to read main: GitHub API ${response.status}.`);
            }
            const main = await response.json();
            if (main?.object?.sha !== sha) {
              throw new Error(`Emergency candidate ${sha} is stale; current main is ${main?.object?.sha || 'unknown'}.`);
            }
            console.log(`[release] emergency candidate is current main @ ${sha}.`);
          })().catch((error) => {
            console.error(`[release] emergency main check blocked: ${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Reconcile approved Azure infrastructure
        if: ${{ inputs.operation == 'reconcile' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\src\BE\infrastructure\deploy-infrastructure.ps1 `
            -Environment $env:TARGET_ENVIRONMENT `
            -Location $env:TARGET_LOCATION `
            -COMPANY_NAME $env:TARGET_COMPANY_NAME `
            -EnableCustomEmailDomain:($env:CUSTOM_EMAIL_DOMAIN_ENABLED -eq 'true')

      - name: Reconcile approved database migration identity
        if: ${{ inputs.operation == 'reconcile' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\src\BE\infrastructure\reconcile-database-migration-identity.ps1 `
            -Environment $env:TARGET_ENVIRONMENT `
            -CompanyName $env:TARGET_COMPANY_NAME

      - name: Verify reconciled diagnostics boundary
        if: ${{ inputs.operation == 'reconcile' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-AzureTsv {
            param([Parameter(Mandatory = $true)][string[]]$Arguments)
            $output = @(& az @Arguments 2>&1 | ForEach-Object { $_.ToString() })
            if ($LASTEXITCODE -ne 0) {
              throw "Azure CLI verification failed with exit code $LASTEXITCODE.`n$($output -join [Environment]::NewLine)"
            }
            return ($output -join [Environment]::NewLine).Trim()
          }

          $workspaceId = Invoke-AzureTsv -Arguments @(
            'monitor', 'log-analytics', 'workspace', 'show',
            '--resource-group', $env:AZURE_RESOURCE_GROUP,
            '--workspace-name', $env:LOG_ANALYTICS_WORKSPACE_NAME,
            '--query', 'customerId', '--output', 'tsv'
          )
          $workspaceResourceId = Invoke-AzureTsv -Arguments @(
            'monitor', 'log-analytics', 'workspace', 'show',
            '--resource-group', $env:AZURE_RESOURCE_GROUP,
            '--workspace-name', $env:LOG_ANALYTICS_WORKSPACE_NAME,
            '--query', 'id', '--output', 'tsv'
          )
          $configuredWorkspaceId = Invoke-AzureTsv -Arguments @(
            'webapp', 'config', 'appsettings', 'list',
            '--resource-group', $env:AZURE_RESOURCE_GROUP,
            '--name', $env:AZURE_WEBAPP_NAME,
            '--query', "[?name=='Azure__ApplicationInsights__WorkspaceId'].value | [0]",
            '--output', 'tsv'
          )

          if ($configuredWorkspaceId -ne $workspaceId) {
            throw 'The API workspace setting does not match the selected Log Analytics workspace.'
          }

          $apiPrincipalId = Invoke-AzureTsv -Arguments @(
            'identity', 'show',
            '--resource-group', $env:AZURE_RESOURCE_GROUP,
            '--name', $env:API_IDENTITY_NAME,
            '--query', 'principalId', '--output', 'tsv'
          )
          $readerAssignment = Invoke-AzureTsv -Arguments @(
            'role', 'assignment', 'list',
            '--assignee-object-id', $apiPrincipalId,
            '--scope', $workspaceResourceId,
            '--role', 'Log Analytics Data Reader',
            '--query', '[0].id', '--output', 'tsv'
          )

          if ([string]::IsNullOrWhiteSpace($readerAssignment)) {
            throw 'The API managed identity is missing Log Analytics Data Reader on the selected workspace.'
          }

      - name: Require current production API health after reconcile
        if: ${{ inputs.operation == 'reconcile' && inputs.target == 'current-production' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & az webapp restart --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_WEBAPP_NAME --output none
          if ($LASTEXITCODE -ne 0) { throw "API restart failed with exit code $LASTEXITCODE." }

          $hostName = (& az webapp show `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --query defaultHostName `
            --output tsv).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($hostName)) {
            throw 'Azure did not return the current production API hostname.'
          }

          $healthUrl = "https://$hostName/health"
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            try {
              Invoke-WebRequest -Uri $healthUrl -Method Get -TimeoutSec 10 -UseBasicParsing | Out-Null
              exit 0
            }
            catch {
              if ($attempt -eq 15) {
                throw "Infrastructure reconciled, but API health did not recover at $healthUrl."
              }
              Start-Sleep -Seconds 10
            }
          }

      - name: Record reconcile evidence
        if: ${{ inputs.operation == 'reconcile' && success() }}
        shell: pwsh
        env:
          EMERGENCY_REASON: ${{ inputs.emergency_reason }}
        run: |
          $runtimeState = if ('${{ inputs.target }}' -eq 'current-production') {
            'existing API health passed'
          } else {
            'foundation verified; API package and data readiness are separate gates'
          }
          @"
          ## Infrastructure production reconcile

          - SHA: ``$env:GITHUB_SHA``
          - Target: ``${{ inputs.target }}`` / ``$env:AZURE_RESOURCE_GROUP``
          - Result: infrastructure and migration identity reconciled
          - Runtime: $runtimeState
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ('${{ inputs.execution_mode }}' -eq 'emergency') {
            @"

          ### Emergency run completed

          - CI gate: waived for this run only
          - Triggering actor: ``${{ github.triggering_actor }}``
          - Reason: $env:EMERGENCY_REASON
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
