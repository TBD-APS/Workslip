name: TEMP — Documentation Validation — WOR-246

on:
  pull_request:
    branches: [main]
    paths:
      - 'Docs/architecture/domain-and-dataflows.md'
      - '.github/workflows/wor-246-docs-validation.yml'

permissions:
  contents: read

jobs:
  docs:
    name: Maintained documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate changed maintained document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.docs.check_docs import validate_markdown

          path = Path('Docs/architecture/domain-and-dataflows.md').resolve()
          failures = validate_markdown(path)
          if failures:
              raise SystemExit(f'{failures} documentation error(s) in the changed file')
          print('Changed maintained document passed targeted validation.')
          PY

      - name: Compare repository documentation baseline
        run: |
          set -Eeuo pipefail
          git worktree add --detach /tmp/workslip-main origin/main

          set +e
          python3 tools/docs/check_docs.py > /tmp/wor-246-pr-docs.log 2>&1
          pr_status=$?
          (
            cd /tmp/workslip-main
            python3 tools/docs/check_docs.py > /tmp/wor-246-main-docs.log 2>&1
          )
          main_status=$?
          set -e

          cat /tmp/wor-246-pr-docs.log

          if [[ "${pr_status}" -ne "${main_status}" ]]; then
            echo "::error::Documentation status differs from main: PR=${pr_status}, main=${main_status}."
            exit 1
          fi

          if ! diff -u /tmp/wor-246-main-docs.log /tmp/wor-246-pr-docs.log; then
            echo "::error::Documentation failures differ from main."
            exit 1
          fi

          if [[ "${pr_status}" -ne 0 ]]; then
            echo "Repository-wide documentation check matches main's existing failure baseline."
          else
            echo "Repository-wide documentation check passed."
          fi
