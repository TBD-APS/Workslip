name: TEMP WOR-221 implement login history recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-wor221-implement.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rbj--221-recover-cancelled-microsoft-login
          fetch-depth: 0

      - name: Apply scoped WOR-221 changes
        run: |
          python <<'PY'
          from pathlib import Path

          login_path = Path('src/FE/src/features/auth/routes/Login.tsx')
          login = login_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { lazy, Suspense, useEffect, useRef, useState } from 'react';",
                  "import { lazy, Suspense, useCallback, useEffect, useRef, useState } from 'react';",
              ),
              (
                  "  hasEntraLoginCallback,\n  InteractiveLoginRequiredError,",
                  "  hasEntraLoginCallback,\n  hasEntraLoginSession,\n  InteractiveLoginRequiredError,",
              ),
              (
                  "const OneTimeCodeLogin = lazy(() =>\n  import('../components/OneTimeCodeLogin').then((module) => ({ default: module.OneTimeCodeLogin })),\n);\n\nexport const Login = () => {",
                  "const OneTimeCodeLogin = lazy(() =>\n  import('../components/OneTimeCodeLogin').then((module) => ({ default: module.OneTimeCodeLogin })),\n);\n\nconst LOGIN_INTERRUPTED_MESSAGE = 'Login afbrudt. Klik på knappen for at prøve igen.';\n\nconst isBackForwardNavigation = () =>\n  typeof performance !== 'undefined' &&\n  typeof performance.getEntriesByType === 'function' &&\n  (performance.getEntriesByType('navigation')[0] as PerformanceNavigationTiming | undefined)?.type === 'back_forward';\n\nexport const Login = () => {",
              ),
              (
                  "  const [isSubmitting, setIsSubmitting] = useState(() => {\n    const params = new URLSearchParams(window.location.search);\n    return hasEntraLoginCallback() || params.get('reauth') === '1';\n  });\n  const [errorMsg, setErrorMsg] = useState<string | null>(null);",
                  "  const [historyInterruptedLogin] = useState(() =>\n    !hasEntraLoginCallback() && hasEntraLoginSession() && isBackForwardNavigation(),\n  );\n  const [isSubmitting, setIsSubmitting] = useState(() => {\n    const params = new URLSearchParams(window.location.search);\n    return !historyInterruptedLogin && (hasEntraLoginCallback() || params.get('reauth') === '1');\n  });\n  const [errorMsg, setErrorMsg] = useState<string | null>(\n    historyInterruptedLogin ? LOGIN_INTERRUPTED_MESSAGE : null,\n  );",
              ),
              (
                  "  const [isReauth, setIsReauth] = useState(\n    () => new URLSearchParams(window.location.search).get('reauth') === '1',\n  );",
                  "  const [isReauth, setIsReauth] = useState(\n    () => !historyInterruptedLogin && new URLSearchParams(window.location.search).get('reauth') === '1',\n  );",
              ),
              (
                  "  const reauthStartedRef = useRef(false);\n\n  // Combined callback + reauth effect.",
                  "  const reauthStartedRef = useRef(false);\n\n  const recoverToLogin = useCallback((message: string) => {\n    clearReauthInFlight();\n    clearEntraLoginSession();\n    reauthStartedRef.current = false;\n    window.history.replaceState(null, '', '/login');\n    setErrorMsg(message);\n    setIsSubmitting(false);\n    setIsReauth(false);\n  }, []);\n\n  useEffect(() => {\n    const handlePageShow = (event: PageTransitionEvent) => {\n      if (!event.persisted || hasEntraLoginCallback() || !hasEntraLoginSession()) return;\n      recoverToLogin(LOGIN_INTERRUPTED_MESSAGE);\n    };\n\n    window.addEventListener('pageshow', handlePageShow);\n    return () => window.removeEventListener('pageshow', handlePageShow);\n  }, [recoverToLogin]);\n\n  // Combined callback + reauth effect.",
              ),
              (
                  "    const isCallback = hasEntraLoginCallback();\n    const isReauthRequest = params.get('reauth') === '1';\n    if (!isCallback && !isReauthRequest) return;\n    reauthStartedRef.current = true;\n\n    const returnTo = sanitizeReturnTo(params.get('returnTo'));\n    const recoverToLogin = (message: string) => {\n      clearReauthInFlight();\n      clearEntraLoginSession();\n      window.history.replaceState(null, '', '/login');\n      setErrorMsg(message);\n      setIsSubmitting(false);\n      setIsReauth(false);\n    };",
                  "    const isCallback = hasEntraLoginCallback();\n    const isReauthRequest = params.get('reauth') === '1';\n    if (historyInterruptedLogin) {\n      clearReauthInFlight();\n      clearEntraLoginSession();\n      window.history.replaceState(null, '', '/login');\n      return;\n    }\n    if (!isCallback && !isReauthRequest) return;\n    reauthStartedRef.current = true;\n\n    const returnTo = sanitizeReturnTo(params.get('returnTo'));",
              ),
              (
                  "  }, []);\n\n  const handleMicrosoftLogin = async () => {",
                  "  }, [historyInterruptedLogin, recoverToLogin]);\n\n  const handleMicrosoftLogin = async () => {",
              ),
              (
                  "    } catch (err: unknown) {\n      const message = (err as Error)?.message || 'Kunne ikke starte Microsoft login.';",
                  "    } catch (err: unknown) {\n      clearEntraLoginSession();\n      const message = (err as Error)?.message || 'Kunne ikke starte Microsoft login.';",
              ),
          ]

          for old, new in replacements:
              count = login.count(old)
              if count != 1:
                  raise SystemExit(f'Login.tsx replacement expected once, found {count}: {old[:80]!r}')
              login = login.replace(old, new, 1)
          login_path.write_text(login, encoding='utf-8')

          entra_path = Path('src/FE/src/features/auth/api/entraLogin.ts')
          entra = entra_path.read_text(encoding='utf-8')
          old = "export const hasEntraLoginCallback = () => {\n  const params = new URLSearchParams(window.location.search);\n  return params.has('code') || params.has('error');\n};\n\nexport const startEntraLogin"
          new = "export const hasEntraLoginCallback = () => {\n  const params = new URLSearchParams(window.location.search);\n  return params.has('code') || params.has('error');\n};\n\nexport const hasEntraLoginSession = () => loadPkceState() !== null;\n\nexport const startEntraLogin"
          if entra.count(old) != 1:
              raise SystemExit('entraLogin.ts insertion point did not match exactly once')
          entra_path.write_text(entra.replace(old, new, 1), encoding='utf-8')

          readme_path = Path('src/FE/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = "The login route clears the PKCE state after success, cancellation or callback failure. Never persist the verifier in `localStorage`, logs, telemetry or URL parameters."
          new = "The login route clears the PKCE state after success, cancellation or callback failure. It also treats a browser-history return from Microsoft with pending PKCE state as a cancellation: cached pages recover on `pageshow`, non-cached `back_forward` loads do not restart reauthentication, and the login form becomes interactive again. Never persist the verifier in `localStorage`, logs, telemetry or URL parameters."
          if readme.count(old) != 1:
              raise SystemExit('README authentication paragraph did not match exactly once')
          readme_path.write_text(readme.replace(old, new, 1), encoding='utf-8')
          PY

          cat > src/FE/src/features/auth/routes/Login.history.test.tsx <<'EOF'
          import { act, cleanup, fireEvent, render, screen, waitFor } from '@testing-library/react';
          import { createMemoryRouter, RouterProvider } from 'react-router-dom';
          import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';
          import { Login } from './Login';

          const { authState, entraMocks } = vi.hoisted(() => ({
            authState: { isAuthenticated: true },
            entraMocks: {
              clearEntraLoginSession: vi.fn(),
              completeEntraLogin: vi.fn(),
              hasEntraLoginCallback: vi.fn(() => false),
              hasEntraLoginSession: vi.fn(() => false),
              sanitizeReturnTo: vi.fn((value: string | null) => value ?? '/app'),
              startEntraLogin: vi.fn(),
            },
          }));

          vi.mock('../../../providers/useAuth', () => ({
            useAuth: () => ({
              isAuthenticated: authState.isAuthenticated,
              devLogin: vi.fn(),
            }),
          }));

          vi.mock('../api/entraLogin', () => ({
            ...entraMocks,
            InteractiveLoginRequiredError: class InteractiveLoginRequiredError extends Error {},
            LoginCancelledError: class LoginCancelledError extends Error {},
          }));

          function renderLogin(initialEntries: string[] = ['/login'], initialIndex = initialEntries.length - 1) {
            const router = createMemoryRouter(
              [
                { path: '/before', element: <div>Før login</div> },
                { path: '/login', element: <Login /> },
                { path: '/app', element: <div>App</div> },
              ],
              { initialEntries, initialIndex },
            );

            render(<RouterProvider router={router} />);
            return router;
          }

          beforeEach(() => {
            authState.isAuthenticated = true;
            window.history.replaceState(null, '', '/login');
            entraMocks.clearEntraLoginSession.mockReset();
            entraMocks.completeEntraLogin.mockReset();
            entraMocks.hasEntraLoginCallback.mockReset().mockReturnValue(false);
            entraMocks.hasEntraLoginSession.mockReset().mockReturnValue(false);
            entraMocks.sanitizeReturnTo.mockReset().mockImplementation((value: string | null) => value ?? '/app');
            entraMocks.startEntraLogin.mockReset().mockResolvedValue(undefined);
          });

          afterEach(() => {
            cleanup();
            vi.restoreAllMocks();
          });

          describe('Login browser history handling', () => {
            it('replaces the login entry when an authenticated user is redirected', async () => {
              const router = renderLogin(['/before', '/login'], 1);
              expect(await screen.findByText('App')).toBeInTheDocument();

              await act(async () => {
                await router.navigate(-1);
              });

              expect(await screen.findByText('Før login')).toBeInTheDocument();
              expect(router.state.location.pathname).toBe('/before');
            });

            it('recovers an interactive login restored from the back-forward cache', async () => {
              authState.isAuthenticated = false;
              entraMocks.startEntraLogin.mockImplementation(() => new Promise<void>(() => {}));
              renderLogin();

              fireEvent.click(screen.getByRole('button', { name: 'Log ind med Microsoft passkey' }));
              expect(await screen.findByText('Sender til Microsoft...')).toBeInTheDocument();

              entraMocks.hasEntraLoginSession.mockReturnValue(true);
              const pageShow = new Event('pageshow') as PageTransitionEvent;
              Object.defineProperty(pageShow, 'persisted', { value: true });
              act(() => window.dispatchEvent(pageShow));

              expect(await screen.findByText('Login afbrudt. Klik på knappen for at prøve igen.')).toBeInTheDocument();
              expect(screen.getByRole('button', { name: 'Log ind med Microsoft passkey' })).toBeEnabled();
              expect(entraMocks.clearEntraLoginSession).toHaveBeenCalled();
            });

            it('does not restart reauthentication on a non-cached history restore', async () => {
              authState.isAuthenticated = false;
              entraMocks.hasEntraLoginSession.mockReturnValue(true);
              vi.spyOn(performance, 'getEntriesByType').mockReturnValue([
                { type: 'back_forward' } as PerformanceNavigationTiming,
              ]);
              window.history.replaceState(null, '', '/login?reauth=1&returnTo=%2Fapp%2Fcustomers');

              renderLogin(['/login?reauth=1&returnTo=%2Fapp%2Fcustomers']);

              expect(await screen.findByText('Login afbrudt. Klik på knappen for at prøve igen.')).toBeInTheDocument();
              await waitFor(() => expect(entraMocks.clearEntraLoginSession).toHaveBeenCalled());
              expect(entraMocks.startEntraLogin).not.toHaveBeenCalled();
              expect(window.location.pathname).toBe('/login');
              expect(window.location.search).toBe('');
              expect(screen.getByRole('button', { name: 'Log ind med Microsoft passkey' })).toBeEnabled();
            });
          });
          EOF
          sed -i 's/^          //' src/FE/src/features/auth/routes/Login.history.test.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Generate frontend API client
        working-directory: src/FE
        run: |
          set -Eeuo pipefail
          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --output /dev/null "${OPENAPI_BASE_URL}/openapi/v1.json"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "${ready}" != "true" ]]; then
            echo "::error::Production OpenAPI endpoint did not become ready."
            exit 1
          fi
          npx orval --config orval.config.ts
        env:
          OPENAPI_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net
          VITE_API_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net

      - name: Lint affected frontend files
        working-directory: src/FE
        run: >-
          npx eslint
          src/features/auth/api/entraLogin.ts
          src/features/auth/routes/Login.tsx
          src/features/auth/routes/Login.history.test.tsx

      - name: Run focused login history tests
        working-directory: src/FE
        run: npm test -- --run src/features/auth/routes/Login.history.test.tsx

      - name: Build production frontend
        working-directory: src/FE
        run: npm run build
        env:
          VITE_AZURE_AD_TENANT_ID: validation-tenant
          VITE_AZURE_AD_CLIENT_ID: validation-client
          VITE_AZURE_AD_SCOPE: api://validation/access
          VITE_AZURE_AD_LOGIN_REDIRECT_URI: http://127.0.0.1:4173/login

      - name: Commit scoped changes and remove temporary workflow
        run: |
          git config user.name 'Workslip Validation Bot'
          git config user.email 'workslip-validation@users.noreply.github.com'
          git add src/FE/src/features/auth/api/entraLogin.ts \
                  src/FE/src/features/auth/routes/Login.tsx \
                  src/FE/src/features/auth/routes/Login.history.test.tsx \
                  src/FE/README.md
          git rm .github/workflows/temp-wor221-implement.yml
          git commit -m 'RBJ-221: recover cancelled Microsoft login'
          git push origin HEAD:rbj--221-recover-cancelled-microsoft-login
