name: RBJ-167 patch main Bicep

on:
  push:
    branches:
      - rbj--167-fix-oidc-subject-defaults-v2
    paths:
      - '.github/workflows/rbj-167-patch-main-bicep.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--167-fix-oidc-subject-defaults-v2

      - name: Patch immutable GitHub OIDC subject
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/BE/infrastructure/main.bicep')
          text = path.read_text(encoding='utf-8')

          old_param = "param githubRepository string         = 'rasm105k/Workslip-v2.0'"
          new_params = "\n".join([
              "param githubOwner string            = 'rasm105k'",
              "param githubOwnerId string          = '31623093'",
              "param githubRepository string       = 'Workslip-v2.0'",
              "param githubRepositoryId string     = '1245555609'",
          ])
          old_subject = "subject: 'repo:${githubRepository}:environment:${githubEnvironment}'"
          new_subject = "subject: 'repo:${githubOwner}@${githubOwnerId}/${githubRepository}@${githubRepositoryId}:environment:${githubEnvironment}'"

          if old_param not in text:
              raise SystemExit('Expected githubRepository parameter was not found.')
          if old_subject not in text:
              raise SystemExit('Expected legacy OIDC subject was not found.')

          text = text.replace(old_param, new_params, 1)
          text = text.replace(old_subject, new_subject, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit direct Bicep fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BE/infrastructure/main.bicep
          git diff --cached --check
          git commit -m "RBJ-167: Use immutable GitHub OIDC subject in main Bicep"
          git push origin HEAD:rbj--167-fix-oidc-subject-defaults-v2
