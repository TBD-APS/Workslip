name: Generate accounting API client once

on:
  push:
    branches:
      - agent/economic-operational-integration

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: commit generated accounting client') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/economic-operational-integration
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate branch-matched API client
        working-directory: src/FE
        run: npm run generate:api:local
      - name: Commit generated client and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FE/src/api/generated
          git rm .github/workflows/tmp-generate-accounting-client.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: commit generated accounting client"
          git push origin HEAD:agent/economic-operational-integration
