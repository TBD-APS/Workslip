name: CI/CD to Azure

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Azure Web App name'
        required: false
        default: 'api-npteknik-prod'
      environment:
        description: 'GitHub environment name'
        required: false
        default: 'prod'
  push:
    branches: [main]
    paths:
      - 'src/BE/WorkslipApi/**'
      - '.github/workflows/main_api-npteknik-prod.yml'

env:
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: src/BE/WorkslipApi/Workslip.Api.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish/api
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  WEB_APP_NAME: ${{ inputs.app_name || 'api-npteknik-prod' }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-api-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
        
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }} --nologo

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore --nologo

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}" --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workslip-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: workslip-api
          path: ${{ env.PUBLISH_DIR }}
          
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Install sqlcmd 18
        shell: bash
        run: |
          source /etc/os-release
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Validate Azure SQL identity and network controls
        shell: pwsh
        run: >-
          ./src/BE/infrastructure/Test-AzureSqlSecurity.ps1
          -Environment '${{ env.DEPLOY_ENVIRONMENT }}'
          -CompanyName 'npteknik'
          -ApiUrl 'https://${{ env.WEB_APP_NAME }}.azurewebsites.net'
