name: CI/CD to Azure

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Azure Web App name'
        required: false
        default: 'api-npteknik-prod'
      environment:
        description: 'GitHub environment name'
        required: false
        default: 'prod'
  push:
    branches: [main]
    paths:
      - 'src/BE/WorkslipApi/**'
      - '.github/workflows/main_api-npteknik-prod.yml'

env:
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: src/BE/WorkslipApi/Workslip.Api.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish/api
  AZURE_WEBAPP_NAME: ${{ inputs.app_name || 'api-npteknik-prod' }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-api-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }} --nologo

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore --nologo

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}" --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: workslip-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: workslip-api
          path: ${{ env.PUBLISH_DIR }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

  clear-caches:
    name: Clear caches after deployment
    needs: deploy
    uses: ./.github/workflows/post-deploy-cache.yml
    secrets: inherit
