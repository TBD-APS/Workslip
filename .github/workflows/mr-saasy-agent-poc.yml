name: MR SAAS'y Durable Agent + Sandbox POC

on:
  pull_request:
    paths:
      - 'platform/mr-saasy-agent-poc/**'
      - '.github/workflows/mr-saasy-agent-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-runtime-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce runtime-agnostic sandbox boundary
        working-directory: platform/mr-saasy-agent-poc
        run: bash ./scripts/boundary-check.sh

  destructive-worker-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Compile-check worker and sandbox broker
        working-directory: platform/mr-saasy-agent-poc
        run: |
          docker build -t mr-saasy-agent-poc:check .
          docker run --rm mr-saasy-agent-poc:check python -m compileall -q app
          docker build -t mr-saasy-sandbox-broker:check -f sandbox_broker/Dockerfile .
          docker run --rm mr-saasy-sandbox-broker:check python -m py_compile /broker/server.py

      - name: Run destructive durable-loop POC
        working-directory: platform/mr-saasy-agent-poc
        run: bash ./scripts/destructive-test.sh

  disposable-sandbox-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Compile-check worker and sandbox broker
        working-directory: platform/mr-saasy-agent-poc
        run: |
          docker build -t mr-saasy-agent-poc:check .
          docker run --rm mr-saasy-agent-poc:check python -m compileall -q app
          docker build -t mr-saasy-sandbox-broker:check -f sandbox_broker/Dockerfile .
          docker run --rm mr-saasy-sandbox-broker:check python -m py_compile /broker/server.py

      - name: Run disposable sandbox isolation POC
        working-directory: platform/mr-saasy-agent-poc
        run: bash ./scripts/sandbox-test.sh
