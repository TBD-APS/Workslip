name: WOR-551 temporary action test bootstrap

on:
  push:
    branches:
      - rbj--551-action-completion

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--551-action-completion
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Update focused conversation tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/BE/WorkslipApi/Workslip.Tests/Conversations/JobConversationServiceTests.cs')
          text = p.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
          '''        INotificationService notifications,\n        IApplicationTransactionFactory? transactionFactory = null,\n        IAssignmentRepository? assignmentRepository = null) =>\n        new(\n            repository,\n            jobs,\n            assignmentRepository ?? new RecordingAssignmentRepository(),\n            currentUser,\n            notifications,\n            transactionFactory ?? new RecordingTransactionFactory());''',
          '''        INotificationService notifications,\n        IApplicationTransactionFactory? transactionFactory = null,\n        IAssignmentRepository? assignmentRepository = null,\n        IJobAssignmentService? jobAssignmentService = null) =>\n        new(\n            repository,\n            jobs,\n            assignmentRepository ?? new RecordingAssignmentRepository(),\n            jobAssignmentService ?? new RecordingJobAssignmentService(),\n            currentUser,\n            notifications,\n            transactionFactory ?? new RecordingTransactionFactory());''')

          replace_once(
          '''        ConversationActionType type) =>\n        new(''',
          '''        ConversationActionType type,\n        DateTimeOffset? dueUtc = null) =>\n        new(''')

          replace_once(
          '''                ConversationActionStatus.Pending,\n                null,\n                null,\n                null),''',
          '''                ConversationActionStatus.Pending,\n                dueUtc,\n                null,\n                null,\n                null),''')

          replace_once(
          '''            ConversationActionType? actionType,\n            Guid? actionTargetUserId,\n            CancellationToken cancellationToken)''',
          '''            ConversationActionType? actionType,\n            Guid? actionTargetUserId,\n            DateTimeOffset? actionDueUtc,\n            CancellationToken cancellationToken)''')

          replace_once(
          '''                        TargetDisplayName,\n                        ConversationActionStatus.Pending,\n                        null,\n                        null,\n                        null),''',
          '''                        TargetDisplayName,\n                        ConversationActionStatus.Pending,\n                        actionDueUtc,\n                        null,\n                        null,\n                        null),''')

          replace_once(
          '''        public IReadOnlyList<AssignedUserResponse> Admins { get; init; } = [];\n\n        public Task<IReadOnlyList<AssignedUserResponse>> GetOrganizationAdminsAsync''',
          '''        public IReadOnlyList<AssignedUserResponse> Admins { get; init; } = [];\n        public IReadOnlyList<AssignedUserResponse> AssignableUsers { get; init; } = [];\n\n        public Task<IReadOnlyList<AssignedUserResponse>> GetOrganizationAdminsAsync''')

          replace_once(
          '''        public Task<IReadOnlyList<AssignedUserResponse>> GetOrganizationAdminsAsync(Guid organizationId, CancellationToken cancellationToken) =>\n            Task.FromResult(Admins);\n\n        public Task AssignAsync''',
          '''        public Task<IReadOnlyList<AssignedUserResponse>> GetOrganizationAdminsAsync(Guid organizationId, CancellationToken cancellationToken) =>\n            Task.FromResult(Admins);\n\n        public Task<IReadOnlyList<AssignedUserResponse>> GetAssignableUsersForJobAsync(Guid organizationId, Guid jobId, CancellationToken cancellationToken) =>\n            Task.FromResult(AssignableUsers);\n\n        public Task AssignAsync''')

          replace_once(
          '''        public List<ActionCall> Actions { get; } = [];\n        public bool ThrowOnAction { get; init; }''',
          '''        public List<ActionCall> Actions { get; } = [];\n        public List<ReminderCall> Reminders { get; } = [];\n        public bool ThrowOnAction { get; init; }''')

          replace_once(
          '''        public Task QueueJobAssignedAsync(Guid userId, string recipientName, Guid jobId, string jobNumber, string customerAddress, CancellationToken cancellationToken) => Task.CompletedTask;''',
          '''        public Task QueueConversationReminderAsync(Guid userId, string recipientName, Guid jobId, string jobNumber, string customerAddress, string reminderText, Guid messageId, DateTimeOffset dueUtc, CancellationToken cancellationToken)\n        {\n            Reminders.Add(new ReminderCall(userId, jobId, messageId, dueUtc, reminderText));\n            return Task.CompletedTask;\n        }\n\n        public Task QueueJobAssignedAsync(Guid userId, string recipientName, Guid jobId, string jobNumber, string customerAddress, CancellationToken cancellationToken) => Task.CompletedTask;''')

          replace_once(
          '''    private sealed record MentionCall(Guid UserId, string RecipientName, Guid JobId, Guid MessageId);\n    private sealed record ActionCall(Guid UserId, string RecipientName, Guid JobId, string ActionLabel, Guid MessageId);''',
          '''    private sealed class RecordingJobAssignmentService : IJobAssignmentService\n    {\n        public int ValidateTargetCalls { get; private set; }\n        public int AssignSelfCalls { get; private set; }\n        public Result ValidateTargetResult { get; init; } = Result.Success();\n        public Result AssignSelfResult { get; init; } = Result.NoContent();\n\n        public Task<Result<JobReportSummaryResponse>> AssignAsync(Guid jobId, IReadOnlyList<Guid> userIds, CancellationToken cancellationToken) =>\n            throw new NotSupportedException();\n\n        public Task<Result> ValidateSelfAssignmentTargetAsync(Guid jobId, Guid targetUserId, CancellationToken cancellationToken)\n        {\n            ValidateTargetCalls++;\n            return Task.FromResult(ValidateTargetResult);\n        }\n\n        public Task<Result> AssignSelfAsync(Guid jobId, CancellationToken cancellationToken)\n        {\n            AssignSelfCalls++;\n            return Task.FromResult(AssignSelfResult);\n        }\n    }\n\n    private sealed record MentionCall(Guid UserId, string RecipientName, Guid JobId, Guid MessageId);\n    private sealed record ActionCall(Guid UserId, string RecipientName, Guid JobId, string ActionLabel, Guid MessageId);\n    private sealed record ReminderCall(Guid UserId, Guid JobId, Guid MessageId, DateTimeOffset DueUtc, string ReminderText);''')

          marker = '''    private static JobConversationService CreateService('''
          tests = r'''
    [Fact]
    public async Task SendAsync_create_task_requires_description()
    {
        var organizationId = Guid.NewGuid();
        var jobId = Guid.NewGuid();
        var targetId = Guid.NewGuid();
        var repository = new RecordingRepository();
        var service = CreateService(
            repository,
            new RecordingJobService(CreateSummary(jobId, organizationId, [new(targetId, "Mikkel")])),
            new TestCurrentUserContext(Guid.NewGuid(), organizationId, Roles.Admin),
            new RecordingNotificationService());

        var result = await service.SendAsync(
            jobId,
            new CreateConversationMessageRequest(
                null,
                [],
                ConversationActionType.CreateTask,
                targetId),
            CancellationToken.None);

        Assert.Equal(ResultStatus.Invalid, result.Status);
        Assert.Equal(0, repository.CreateCalls);
    }

    [Fact]
    public async Task SendAsync_remind_me_persists_due_time_and_schedules_notification()
    {
        var organizationId = Guid.NewGuid();
        var jobId = Guid.NewGuid();
        var userId = Guid.NewGuid();
        var dueUtc = DateTimeOffset.UtcNow.AddHours(2);
        var repository = new RecordingRepository { TargetDisplayName = "Rasmus" };
        var notifications = new RecordingNotificationService();
        var service = CreateService(
            repository,
            new RecordingJobService(CreateSummary(jobId, organizationId, [new(userId, "Rasmus")])),
            new TestCurrentUserContext(userId, organizationId, Roles.User),
            notifications);

        var result = await service.SendAsync(
            jobId,
            new CreateConversationMessageRequest(
                "Husk at ringe kunden",
                [],
                ConversationActionType.RemindMe,
                userId,
                dueUtc),
            CancellationToken.None);

        Assert.True(result.IsSuccess);
        Assert.Equal(dueUtc, result.Value.Action?.DueUtc);
        var reminder = Assert.Single(notifications.Reminders);
        Assert.Equal(userId, reminder.UserId);
        Assert.Equal(dueUtc, reminder.DueUtc);
        Assert.Equal("Husk at ringe kunden", reminder.ReminderText);
    }

    [Fact]
    public async Task SendAsync_remind_me_rejects_other_recipient_and_past_due_time()
    {
        var organizationId = Guid.NewGuid();
        var jobId = Guid.NewGuid();
        var userId = Guid.NewGuid();
        var otherId = Guid.NewGuid();
        var repository = new RecordingRepository();
        var service = CreateService(
            repository,
            new RecordingJobService(CreateSummary(jobId, organizationId, [new(userId, "Rasmus"), new(otherId, "Mikkel")])),
            new TestCurrentUserContext(userId, organizationId, Roles.User),
            new RecordingNotificationService());

        var otherRecipient = await service.SendAsync(
            jobId,
            new CreateConversationMessageRequest("Husk det", [], ConversationActionType.RemindMe, otherId, DateTimeOffset.UtcNow.AddHours(1)),
            CancellationToken.None);
        var pastDue = await service.SendAsync(
            jobId,
            new CreateConversationMessageRequest("Husk det", [], ConversationActionType.RemindMe, userId, DateTimeOffset.UtcNow.AddMinutes(-1)),
            CancellationToken.None);

        Assert.Equal(ResultStatus.Invalid, otherRecipient.Status);
        Assert.Equal(ResultStatus.Invalid, pastDue.Status);
        Assert.Equal(0, repository.CreateCalls);
    }

    [Fact]
    public async Task SendAsync_assign_self_allows_eligible_unassigned_target_without_mention_access()
    {
        var organizationId = Guid.NewGuid();
        var jobId = Guid.NewGuid();
        var adminId = Guid.NewGuid();
        var targetId = Guid.NewGuid();
        var assignments = new RecordingAssignmentRepository
        {
            Admins = [new AssignedUserResponse(adminId, "Admin")],
            AssignableUsers = [new AssignedUserResponse(targetId, "Mikkel")]
        };
        var jobAssignment = new RecordingJobAssignmentService();
        var notifications = new RecordingNotificationService();
        var repository = new RecordingRepository { TargetDisplayName = "Mikkel" };
        var service = CreateService(
            repository,
            new RecordingJobService(CreateSummary(jobId, organizationId, [])),
            new TestCurrentUserContext(adminId, organizationId, Roles.Admin),
            notifications,
            assignmentRepository: assignments,
            jobAssignmentService: jobAssignment);

        var result = await service.SendAsync(
            jobId,
            new CreateConversationMessageRequest("Kan du tage den?", [], ConversationActionType.AssignSelf, targetId),
            CancellationToken.None);

        Assert.True(result.IsSuccess);
        Assert.Equal(targetId, result.Value.Action?.TargetUserId);
        Assert.Equal(1, jobAssignment.ValidateTargetCalls);
        Assert.Single(notifications.Actions);
    }

    [Fact]
    public async Task ResolveAction_assign_self_allows_target_to_accept_before_normal_job_access()
    {
        var organizationId = Guid.NewGuid();
        var jobId = Guid.NewGuid();
        var targetId = Guid.NewGuid();
        var messageId = Guid.NewGuid();
        var jobs = new RecordingJobService(null) { GetResult = Result<JobReportSummaryResponse>.NotFound() };
        var repository = new RecordingRepository
        {
            ExistingMessage = PendingActionMessage(messageId, jobId, targetId, ConversationActionType.AssignSelf)
        };
        var jobAssignment = new RecordingJobAssignmentService();
        var service = CreateService(
            repository,
            jobs,
            new TestCurrentUserContext(targetId, organizationId, Roles.User),
            new RecordingNotificationService(),
            jobAssignmentService: jobAssignment);

        var result = await service.ResolveActionAsync(jobId, messageId, CancellationToken.None);

        Assert.True(result.IsSuccess);
        Assert.Equal(1, jobAssignment.AssignSelfCalls);
        Assert.Equal(1, repository.ResolveCalls);
        Assert.Equal(ConversationActionStatus.Completed, result.Value.Action?.Status);
    }

    [Fact]
    public async Task ResolveAction_assign_self_hides_request_from_non_target()
    {
        var organizationId = Guid.NewGuid();
        var jobId = Guid.NewGuid();
        var targetId = Guid.NewGuid();
        var messageId = Guid.NewGuid();
        var repository = new RecordingRepository
        {
            ExistingMessage = PendingActionMessage(messageId, jobId, targetId, ConversationActionType.AssignSelf)
        };
        var jobAssignment = new RecordingJobAssignmentService();
        var service = CreateService(
            repository,
            new RecordingJobService(null),
            new TestCurrentUserContext(Guid.NewGuid(), organizationId, Roles.User),
            new RecordingNotificationService(),
            jobAssignmentService: jobAssignment);

        var result = await service.ResolveActionAsync(jobId, messageId, CancellationToken.None);

        Assert.Equal(ResultStatus.NotFound, result.Status);
        Assert.Equal(0, jobAssignment.AssignSelfCalls);
        Assert.Equal(0, repository.ResolveCalls);
    }

    [Fact]
    public async Task ResolveAction_reminder_cannot_complete_before_due_time()
    {
        var organizationId = Guid.NewGuid();
        var jobId = Guid.NewGuid();
        var userId = Guid.NewGuid();
        var messageId = Guid.NewGuid();
        var repository = new RecordingRepository
        {
            ExistingMessage = PendingActionMessage(
                messageId,
                jobId,
                userId,
                ConversationActionType.RemindMe,
                DateTimeOffset.UtcNow.AddHours(1))
        };
        var service = CreateService(
            repository,
            new RecordingJobService(CreateSummary(jobId, organizationId, [new(userId, "Rasmus")])),
            new TestCurrentUserContext(userId, organizationId, Roles.User),
            new RecordingNotificationService());

        var result = await service.ResolveActionAsync(jobId, messageId, CancellationToken.None);

        Assert.Equal(ResultStatus.Conflict, result.Status);
        Assert.Equal(0, repository.ResolveCalls);
    }

'''
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          text = text.replace(marker, tests + marker, 1)
          p.write_text(text)
      - name: Run focused backend tests
        working-directory: src/BE/WorkslipApi
        run: dotnet test Workslip.Tests/Workslip.Tests.csproj --filter FullyQualifiedName~JobConversationServiceTests --no-restore
      - name: Commit tests and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wor551-action-tests-bootstrap.yml
          git add src/BE/WorkslipApi/Workslip.Tests/Conversations/JobConversationServiceTests.cs
          git commit -m "RBJ-551: protect conversation action completion"
          git push origin HEAD:rbj--551-action-completion
