name: WOR-199 Microsoft logout validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wor-199-microsoft-logout.yml
      - src/FE/.wor-199-apply.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: rbj--199-microsoft-full-logout
          fetch-depth: 0

      - name: Apply focused logout changes
        run: python3 src/FE/.wor-199-apply.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Validate changed lint-clean frontend files
        working-directory: src/FE
        run: >-
          npx eslint
          src/features/auth/api/entraLogin.ts
          src/providers/authContextValue.ts
          src/providers/AuthContext.tsx
          src/components/ErrorState.tsx
          src/providers/ErrorFallback.tsx
          src/components/layouts/AppLayout.tsx
          src/routes/index.tsx

      - name: Build frontend
        working-directory: src/FE
        run: npm run build

      - name: Validate diff
        run: |
          git diff --check
          test "$(git status --short | grep -vE '^( D|D ) (\.github/workflows/wor-199-microsoft-logout.yml|src/FE/\.wor-199-apply.py)$' | wc -l)" -gt 0

      - name: Commit validated implementation and remove temporary files
        run: |
          rm .github/workflows/wor-199-microsoft-logout.yml
          rm src/FE/.wor-199-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WOR-199: end Microsoft session on logout"
          git push origin HEAD:rbj--199-microsoft-full-logout
