name: TEMP — Assistant Validation — WOR-237

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wor-237-validation.yml'
      - 'src/FE/scripts/wor-237-transform.py'
      - 'src/FE/scripts/wor-237-post-transform.py'
      - 'src/FE/wor-237.validation.spec.ts'
      - 'src/FE/src/**'
      - 'Docs/api/contract.md'
      - 'Docs/superpowers/specs/spec-desktop-only-superadmin-sessions.md'

permissions:
  contents: write

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  validate:
    name: Validate all-platform Superadmin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: rbj--237-superadmin-all-platforms
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Apply scoped implementation
        run: |
          python3 src/FE/scripts/wor-237-transform.py
          python3 src/FE/scripts/wor-237-post-transform.py

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Generate frontend API client
        working-directory: src/FE
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Lint affected frontend files
        working-directory: src/FE
        run: |
          npx eslint \
            src/main.tsx \
            src/components/layouts/AppLayout.tsx \
            src/features/superadmin/api.ts \
            src/features/superadmin/api.test.ts \
            src/features/superadmin/organizationSession.ts \
            src/features/superadmin/organizationSession.test.ts \
            src/features/superadmin/routes/SuperAdmin.tsx
          npx eslint src/routes/index.tsx \
            --rule 'react-refresh/only-export-components: off'

      - name: Run focused Superadmin tests
        working-directory: src/FE
        run: npm test -- --run src/features/superadmin

      - name: Build production frontend
        working-directory: src/FE
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: src/FE
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate mobile Superadmin workflow
        working-directory: src/FE
        run: |
          set -Eeuo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wor-237-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "${preview_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              cat /tmp/wor-237-preview.log
              exit 1
            fi
            sleep 1
          done

          npx playwright test wor-237.validation.spec.ts --reporter=line --workers=1

      - name: Verify final diff hygiene
        run: |
          git diff --check
          if git grep -n -E 'DesktopOnlySuperadmin|isDesktopPlatform|assertDesktopSuperadminAvailable|normalizeSuperadminSessionForCurrentPlatform|Superadmin er kun tilgængelig på computer' -- src/FE/src Docs/api Docs/architecture; then
            echo '::error::Obsolete desktop-only Superadmin code remains.'
            exit 1
          fi

      - name: Commit validated implementation
        run: |
          git config user.name 'Workslip Validation Bot'
          git config user.email 'workslip-validation@users.noreply.github.com'
          git add -A \
            src/FE/src \
            Docs/api/contract.md \
            Docs/superpowers/specs/spec-desktop-only-superadmin-sessions.md
          git commit -m 'RBJ-237: enable Superadmin on all platforms'
          git push origin HEAD:rbj--237-superadmin-all-platforms
