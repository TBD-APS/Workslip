name: TEMP — Final WOR-223 push validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore test graph
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --nologo

      - name: Build test graph in Release
        run: >-
          dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-restore
          --nologo

      - name: Run focused Web Push regression tests
        run: >-
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --filter FullyQualifiedName~Workslip.Tests.Notifications.WebPushSenderTests
          --logger "console;verbosity=normal"
          --nologo

      - name: Run relevant notification regression suite
        run: >-
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~Workslip.Tests.Notifications&FullyQualifiedName!~Workslip.Tests.Notifications.EfNotificationRepositoryTests.QueueNotificationAsync_DetachesRowAfterPersistenceFailure"
          --logger "console;verbosity=normal"
          --nologo
