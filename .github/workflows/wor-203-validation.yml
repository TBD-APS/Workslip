name: WOR-203 validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FE/src/features/auth/routes/Login.tsx'
      - '.github/workflows/wor-203-validation.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, build and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production with dev flag enabled
        env:
          VITE_ENABLE_DEV_LOGIN: 'true'
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate production and development login controls
        env:
          VITE_ENABLE_DEV_LOGIN: 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp-wor-203

          npm run preview -- --host 127.0.0.1 --port 4173 > .tmp-wor-203/preview.log 2>&1 &
          preview_pid=$!
          npm run dev -- --host 127.0.0.1 --port 4174 > .tmp-wor-203/dev.log 2>&1 &
          dev_pid=$!

          cleanup() {
            kill "${preview_pid}" "${dev_pid}" 2>/dev/null || true
            rm -rf .tmp-wor-203
          }
          trap cleanup EXIT

          for url in http://127.0.0.1:4173/login http://127.0.0.1:4174/login; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --output /dev/null "${url}"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "${ready}" != "true" ]]; then
              cat .tmp-wor-203/preview.log || true
              cat .tmp-wor-203/dev.log || true
              echo "::error::${url} did not become ready."
              exit 1
            fi
          done

          cat > .tmp-wor-203/wor-203.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';

          test.use({ viewport: { width: 390, height: 844 } });

          const assertCleanPage = async (page: import('@playwright/test').Page, url: string) => {
            const consoleErrors: string[] = [];
            const failedRequests: string[] = [];
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', (request) => {
              failedRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`);
            });

            await page.goto(url, { waitUntil: 'networkidle' });
            await expect(page.getByRole('heading', { name: 'Log ind på Workslip' })).toBeVisible();
            expect(consoleErrors).toEqual([]);
            expect(failedRequests).toEqual([]);
          };

          test('production build hides dev login controls even when the flag is true', async ({ page }) => {
            await assertCleanPage(page, 'http://127.0.0.1:4173/login');
            await expect(page.getByRole('button', { name: /Dev Login/ })).toHaveCount(0);
          });

          test('development server retains explicitly enabled dev login controls', async ({ page }) => {
            await assertCleanPage(page, 'http://127.0.0.1:4174/login');
            await expect(page.getByRole('button', { name: /Dev Login/ })).toHaveCount(4);
          });
          EOF

          npx playwright test .tmp-wor-203/wor-203.spec.ts --reporter=line --workers=1
