name: Entra · Reconcile Workslip live B2B guests

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Report differences or reconcile guests, app roles, and Entra object IDs
        required: true
        default: report
        type: choice
        options:
          - report
          - apply
      confirmation:
        description: Type RECONCILE_GUESTS when mode is apply
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/aca-live-entra-guests.yml
      - src/BE/infrastructure/aca/configure-live-app-database-access.ps1
      - src/BE/infrastructure/aca/reconcile-live-entra-guests.ps1

permissions:
  contents: read
  id-token: write

concurrency:
  group: workslip-live-entra-guests
  cancel-in-progress: false

jobs:
  reconcile:
    name: Live B2B guests · ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: live
    env:
      AZURE_RESOURCE_GROUP: rg-mrsoftwarev2-live
      AZURE_LOCATION: swedencentral
      RUNTIME_IDENTITY: id-workslip-live-app
      MIGRATION_IDENTITY: id-mrsoftwarev2-live-migration
      INFRA_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'report' }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
    steps:
      - name: Require main and explicit apply intent
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo "::error::Live B2B reconciliation may only run from main."
            exit 1
          }
          for pair in \
            "INFRA_CLIENT_ID=$INFRA_CLIENT_ID" \
            "AZURE_TENANT_ID=$AZURE_TENANT_ID" \
            "AZURE_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID"; do
            key="${pair%%=*}"
            value="${pair#*=}"
            [[ -n "$value" ]] || { echo "::error::Missing $key on live."; exit 1; }
          done
          if [[ "$MODE" == apply && "$CONFIRMATION" != RECONCILE_GUESTS ]]; then
            echo '::error::Apply mode requires confirmation RECONCILE_GUESTS.'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$MODE" != report ]]; then
            echo '::error::Push-triggered runs are permanently report-only.'
            exit 1
          fi

      - name: Checkout exact selected main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Azure login as infrastructure identity
        uses: azure/login@v3
        with:
          client-id: ${{ env.INFRA_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile runtime Graph permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          loganal_id="$(az monitor log-analytics workspace show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name logAnal-mrsoftwarev2-live \
            --query id --output tsv)"
          loganal_customer="$(az monitor log-analytics workspace show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name logAnal-mrsoftwarev2-live \
            --query customerId --output tsv)"
          keyvault_id="$(az keyvault show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name kv-mrsoftwarev2-live \
            --query id --output tsv)"

          az bicep build --file src/BE/infrastructure/aca/foundation.bicep --stdout >/dev/null
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name workslip-live-app-foundation \
            --template-file src/BE/infrastructure/aca/foundation.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              logAnalyticsWorkspaceId="$loganal_id" \
              logAnalyticsWorkspaceCustomerId="$loganal_customer" \
              keyVaultId="$keyvault_id" \
              keyVaultName='kv-mrsoftwarev2-live' \
              appConfigurationName='appcs-mrsoftwarev2-live' \
              storageAccountName='stmrsoftwarev2live' \
              githubEnvironment='live' \
            --only-show-errors \
            --output none

      - name: Resolve ACA runtime and migration identities
        id: identities
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_client_id="$(az identity show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$RUNTIME_IDENTITY" \
            --query clientId --output tsv)"
          runtime_principal_id="$(az identity show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$RUNTIME_IDENTITY" \
            --query principalId --output tsv)"
          migration_client_id="$(az identity show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$MIGRATION_IDENTITY" \
            --query clientId --output tsv)"
          [[ "$runtime_client_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo '::error::Runtime client id is unavailable.'; exit 1; }
          [[ "$runtime_principal_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo '::error::Runtime principal id is unavailable.'; exit 1; }
          [[ "$migration_client_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo '::error::Migration client id is unavailable.'; exit 1; }
          echo "runtime_client_id=$runtime_client_id" >> "$GITHUB_OUTPUT"
          echo "runtime_principal_id=$runtime_principal_id" >> "$GITHUB_OUTPUT"
          echo "migration_client_id=$migration_client_id" >> "$GITHUB_OUTPUT"

      - name: Allow Graph assignment propagation
        run: sleep 20

      - name: Logout infrastructure identity
        run: az logout

      - name: Azure login as live migration identity
        uses: azure/login@v3
        with:
          client-id: ${{ steps.identities.outputs.migration_client_id }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install SQL bootstrap tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Install-Module SqlServer -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          Import-Module SqlServer -ErrorAction Stop
          Get-Command Invoke-Sqlcmd -ErrorAction Stop | Out-Null

      - name: Ensure Workslip runtime SQL access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./src/BE/infrastructure/aca/configure-live-app-database-access.ps1 `
            -CompanyName mrsoftwarev2 `
            -Environment live `
            -RuntimeIdentityName $env:RUNTIME_IDENTITY `
            -RuntimeClientId '${{ steps.identities.outputs.runtime_client_id }}' `
            -RuntimePrincipalId '${{ steps.identities.outputs.runtime_principal_id }}'

      - name: Logout live migration identity
        run: az logout

      - name: Azure login as Workslip runtime identity
        uses: azure/login@v3
        with:
          client-id: ${{ steps.identities.outputs.runtime_client_id }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install App Configuration CLI support
        shell: bash
        run: |
          set -Eeuo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt
          az appconfig --help >/dev/null

      - name: Install SQL tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Install-Module SqlServer -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          Import-Module SqlServer -ErrorAction Stop
          Get-Command Invoke-Sqlcmd -ErrorAction Stop | Out-Null

      - name: Reconcile external Workslip users
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MODE -eq 'apply') {
            & ./src/BE/infrastructure/aca/reconcile-live-entra-guests.ps1 -Apply
          }
          else {
            & ./src/BE/infrastructure/aca/reconcile-live-entra-guests.ps1
          }

      - name: Publish reconciliation evidence
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Workslip live B2B guest reconciliation

          - Mode: \`$MODE\`
          - Tenant: MR Software live tenant
          - Runtime identity: \`$RUNTIME_IDENTITY\`
          - User model: single-tenant Workslip + external Entra B2B guests
          - Invitation mail during reconciliation: disabled
          - App roles: Superadmin / Admin / User / Auditor reconciled from Workslip DB
          - Database mapping: \`Users.EntraId\` reconciled only in apply mode
          - Runtime SQL access is reconciled from the managed identity client ID with the dedicated live migration identity before the runtime identity reads or writes user mappings
          - Azure tenant/subscription/client IDs are configuration values, not credentials; GitHub variables are preferred with existing secret names retained only as a compatibility fallback
          EOF
