name: WOR-89 completed route patch

on:
  pull_request:
    types: [opened]
    branches:
      - rbj--89-completed-route-base

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused route patch
        run: python tools/temp/wor89_fix_completed_route.py

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'navigate(`/app/completed/${job.id}`' src/FE/src/features/jobs/routes/CompletedJobReport.tsx
          ! grep -F 'navigate(`/app/job/${job.id}`' src/FE/src/features/jobs/routes/CompletedJobReport.tsx

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FE/src/features/jobs/routes/CompletedJobReport.tsx
          git commit -m "RBJ-89: open completed report from undo modal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
