name: WOR-545 assignment boundary refactor

on:
  push:
    branches:
      - rbj--545-extract-job-transition-effects

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply refactor
        run: python .github/scripts/wor545_assignment_boundary.py
      - name: Regenerate dependency map
        run: node tools/depmap/depmap.mjs
      - name: Validate backend
        run: dotnet test src/BE/WorkslipApi/Workslip.slnx -c Release --no-restore
      - name: Remove temporary bootstrap files
        if: success()
        run: rm .github/workflows/wor545-assignment-boundary.yml .github/scripts/wor545_assignment_boundary.py
      - name: Commit refactor
        if: success()
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RBJ-545: consolidate job assignment orchestration'
          git push origin HEAD:rbj--545-extract-job-transition-effects
