name: WOR-195 PR validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'rbj--195-infrastructure-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rbj--195-infrastructure-cleanup
          fetch-depth: 0
          persist-credentials: false

      - name: Apply focused cleanup
        shell: pwsh
        run: ./src/BE/infrastructure/.wor-195-apply.ps1

      - name: Validate Bicep and diff
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file src/BE/infrastructure/main.bicep --outfile /tmp/main.json
          git diff --check
          test -s /tmp/main.json

      - name: Commit validated changes and remove temporary files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm .github/workflows/wor-195-infrastructure-cleanup.yml
          rm .github/workflows/wor-195-pr-validation.yml
          rm src/BE/infrastructure/.wor-195-apply.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RBJ-195: clean infrastructure declarations and ACS environment handling"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:rbj--195-infrastructure-cleanup
