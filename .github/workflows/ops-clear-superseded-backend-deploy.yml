name: Ops · Clear superseded backend deploy queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-clear-superseded-backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cancel-superseded:
    name: Cancel superseded backend deployment runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel known superseded runs safely
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cancel_if_expected() {
            local run_id="$1"
            local expected_sha="$2"
            local run actual_sha status

            run="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
            actual_sha="$(jq -r '.head_sha' <<<"${run}")"
            status="$(jq -r '.status' <<<"${run}")"

            if [[ "${actual_sha}" != "${expected_sha}" ]]; then
              echo "::error::Run ${run_id} SHA mismatch: expected ${expected_sha}, got ${actual_sha}."
              exit 1
            fi

            if [[ "${status}" == 'completed' ]]; then
              echo "Run ${run_id} already completed; no cancellation needed."
              return 0
            fi

            gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
            echo "Cancellation requested for run ${run_id} (${expected_sha})."
          }

          # Cancel the currently queued release first so freeing the older lock cannot start it.
          cancel_if_expected 33687480929 c61f31e221481eb4688bbbdf81d13779012820f8
          cancel_if_expected 33667790827 7ef63fcf4ea34916943a4e89771e883c85a8612b

          for run_id in 33687480929 33667790827; do
            for attempt in $(seq 1 20); do
              run="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
              status="$(jq -r '.status' <<<"${run}")"
              conclusion="$(jq -r '.conclusion // ""' <<<"${run}")"
              if [[ "${status}" == 'completed' ]]; then
                echo "Run ${run_id}: ${status}/${conclusion}."
                break
              fi
              sleep 3
            done

            if [[ "${status}" != 'completed' ]]; then
              echo "::error::Run ${run_id} did not reach completed state after cancellation."
              exit 1
            fi
          done
