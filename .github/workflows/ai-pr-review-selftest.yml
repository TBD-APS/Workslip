name: AI Review Self-test

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    paths:
      - '.github/ai-review/**'
      - '.github/workflows/ai-pr-review.yml'
      - '.github/workflows/ai-pr-review-selftest.yml'
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - '.github/ai-review/**'
      - '.github/workflows/ai-pr-review.yml'
      - '.github/workflows/ai-pr-review-selftest.yml'

permissions:
  contents: read

jobs:
  static-validation:
    name: AI review static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate review sources
        run: |
          set -euo pipefail
          python3 -m json.tool .github/ai-review/schema.json >/dev/null
          python3 -m py_compile .github/ai-review/build-context.py
          node --check .github/ai-review/github-models-review.mjs
          node --check .github/ai-review/ollama-review.mjs
          node --check .github/ai-review/normalize-review.mjs
          node --check .github/ai-review/aggregate.mjs
          node --check .github/ai-review/post-review.mjs
          node --test .github/ai-review/ollama-review.test.mjs
          node --test .github/ai-review/aggregate.test.mjs

      - name: Verify secret-boundary invariants
        run: |
          set -euo pipefail
          workflow=.github/workflows/ai-pr-review.yml

          grep -Fq 'TRUSTED_BRANCH: main' "$workflow"
          grep -Fq 'persist-credentials: false' "$workflow"
          grep -Fq 'github_models_review:' "$workflow"
          grep -Fq 'models: read' "$workflow"
          grep -Fq 'GITHUB_MODELS_REVIEW_B64:' "$workflow"
          grep -Fq 'node .github/ai-review/github-models-review.mjs' "$workflow"
          grep -Fq 'openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56' "$workflow"
          grep -Fq 'anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126' "$workflow"
          grep -Fq 'ollama_review:' "$workflow"
          grep -Fq 'OLLAMA_API_KEY:' "$workflow"
          grep -Fq 'OLLAMA_BASE_URL:' "$workflow"
          grep -Fq 'https://ollama.com' "$workflow"
          grep -Fq 'OLLAMA_REVIEW_B64:' "$workflow"
          grep -Fq 'node .github/ai-review/ollama-review.mjs' "$workflow"
          grep -Fq 'if: env.OLLAMA_API_KEY !=' "$workflow"
          grep -Fq 'github_token:' "$workflow"
          grep -Fq -- '--allowedTools Read,Grep,Glob' "$workflow"
          grep -Fq 'OWNER|MEMBER|COLLABORATOR' "$workflow"
          grep -Fq 'statuses: write' "$workflow"
          grep -Fq 'pull-requests: write' "$workflow"
          grep -Fq 'REVIEW_TOKEN:' "$workflow"
          grep -Fq 'EXPECTED_REVIEW_USER:' "$workflow"

          if grep -Fq 'self-hosted' "$workflow"; then
            echo 'Public Workslip repository AI review must not attach a persistent self-hosted runner.' >&2
            exit 1
          fi

          if grep -Fq 'Require personal review token configuration' "$workflow" || grep -Fq 'WORKSLIP_REVIEW_PAT is missing' "$workflow"; then
            echo 'WORKSLIP_REVIEW_PAT must remain optional; github-actions[bot] is the fallback publisher.' >&2
            exit 1
          fi

          if [ "$(grep -Fc 'pull-requests: write' "$workflow")" -ne 1 ]; then
            echo 'Only the trusted aggregate job may receive pull-request write permission.' >&2
            exit 1
          fi

          if [ "$(grep -Fc 'models: read' "$workflow")" -ne 1 ]; then
            echo 'Only the GitHub Models provider job may receive models:read.' >&2
            exit 1
          fi

          if grep -Fq 'contents: write' "$workflow" || grep -Fq 'id-token: write' "$workflow"; then
            echo 'AI review workflow must not receive contents write or OIDC write permissions.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*ref:.*needs\.prepare\.outputs\.head_sha' "$workflow"; then
            echo 'Review jobs must not checkout the PR head.' >&2
            exit 1
          fi
