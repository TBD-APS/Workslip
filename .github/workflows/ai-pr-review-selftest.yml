name: AI Review Self-test

on:
  pull_request:
    branches:
      - main
      - 'release-*'
    paths:
      - '.github/ai-review/**'
      - '.github/workflows/ai-pr-review.yml'
      - '.github/workflows/ai-pr-review-selftest.yml'
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - '.github/ai-review/**'
      - '.github/workflows/ai-pr-review.yml'
      - '.github/workflows/ai-pr-review-selftest.yml'

permissions:
  contents: read

jobs:
  static-validation:
    name: AI review static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate review sources
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ai-pr-review.yml')"
          python3 -m json.tool .github/ai-review/schema.json >/dev/null
          python3 -m py_compile .github/ai-review/build-context.py
          node --check .github/ai-review/openai-model-selection.mjs
          node --check .github/ai-review/resolve-openai-model.mjs
          node --check .github/ai-review/ollama-review.mjs
          node --check .github/ai-review/normalize-review.mjs
          node --check .github/ai-review/aggregate.mjs
          node --check .github/ai-review/post-review.mjs
          node --test .github/ai-review/openai-model-selection.test.mjs
          node --test .github/ai-review/ollama-review.test.mjs
          node --test .github/ai-review/aggregate.test.mjs

      - name: Verify provider and trust-boundary invariants
        run: |
          set -euo pipefail
          workflow=.github/workflows/ai-pr-review.yml
          publisher=.github/ai-review/post-review.mjs

          grep -Fq 'TRUSTED_BRANCH: main' "$workflow"
          grep -Fq 'persist-credentials: false' "$workflow"
          grep -Fq 'openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56' "$workflow"
          grep -Fq 'node .github/ai-review/resolve-openai-model.mjs' "$workflow"
          grep -Fq 'steps.model.outputs.model' "$workflow"
          grep -Fq 'steps.model.outputs.reason' "$workflow"
          grep -Fq 'anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50' "$workflow"
          grep -Fq 'ollama_review:' "$workflow"
          grep -Fq 'OLLAMA_API_KEY:' "$workflow"
          grep -Fq 'OLLAMA_BASE_URL:' "$workflow"
          grep -Fq 'https://ollama.com' "$workflow"
          grep -Fq 'OLLAMA_REVIEW_B64:' "$workflow"
          grep -Fq 'node .github/ai-review/ollama-review.mjs' "$workflow"
          grep -Fq 'if: env.OLLAMA_API_KEY !=' "$workflow"
          grep -Fq 'github_token:' "$workflow"
          grep -Fq -- '--allowedTools Read,Grep,Glob' "$workflow"
          grep -Fq 'OWNER|MEMBER|COLLABORATOR' "$workflow"
          grep -Fq 'statuses: write' "$workflow"
          grep -Fq 'pull-requests: write' "$workflow"
          grep -Fq 'REVIEW_TOKEN:' "$workflow"
          grep -Fq 'github.token' "$workflow"

          if grep -Fq 'github_models_review:' "$workflow" || grep -Fq 'models: read' "$workflow" || grep -Fq 'GITHUB_MODELS_REVIEW_B64:' "$workflow"; then
            echo 'Retired GitHub Models must not remain in the active AI review workflow.' >&2
            exit 1
          fi

          if grep -Fq 'WORKSLIP_REVIEW_PAT' "$workflow" || grep -Fq 'PERSONAL_REVIEW_TOKEN' "$workflow"; then
            echo 'Trusted AI review publishing must use the scoped workflow token, not a personal PAT.' >&2
            exit 1
          fi

          if ! grep -Fq 'steps.model.outputs.available ==' "$workflow"; then
            echo 'OpenAI review must gate Codex execution on an explicitly resolved accessible model.' >&2
            exit 1
          fi

          if grep -Fq 'self-hosted' "$workflow"; then
            echo 'Public Workslip repository AI review must not attach a persistent self-hosted runner.' >&2
            exit 1
          fi

          if [ "$(grep -Fc 'pull-requests: write' "$workflow")" -ne 1 ]; then
            echo 'Only the trusted aggregate job may receive pull-request write permission.' >&2
            exit 1
          fi

          if grep -Fq 'contents: write' "$workflow" || grep -Fq 'id-token: write' "$workflow"; then
            echo 'AI review workflow must not receive contents write or OIDC write permissions.' >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*ref:.*needs\.prepare\.outputs\.head_sha' "$workflow"; then
            echo 'Review jobs must not checkout the PR head.' >&2
            exit 1
          fi

          # github.token is an installation token. GET /user is a user-token endpoint
          # and caused the live WOR-595 publisher regression with HTTP 403.
          if grep -Fq "api('/user')" "$publisher" || grep -Fq 'api("/user")' "$publisher"; then
            echo 'AI review publisher must not resolve identity through GET /user with GITHUB_TOKEN.' >&2
            exit 1
          fi

          grep -Fq "github-actions[bot]" "$publisher"
          grep -Fq "comment.user?.login" "$publisher"
          grep -Fq "comment.body.includes(marker)" "$publisher"
