name: Patch WOR-190 local runtime cleanup

on:
  push:
    branches:
      - rbj--190-infrastructure-deployment-hardening
    paths:
      - .github/workflows/patch-wor-190-local-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--190-infrastructure-deployment-hardening
          fetch-depth: 0

      - name: Apply focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          invitation_path = Path('src/BE/WorkslipApi/Workslip.Application/Invitations/InvitationService.cs')
          invitation = invitation_path.read_text(encoding='utf-8')
          invitation = invitation.replace('using Workslip.Application.Organizations;\n', '', 1)
          invitation = invitation.replace('    IOrganizationRepository organizationRepository,\n', '', 1)
          invitation_path.write_text(invitation, encoding='utf-8', newline='\n')

          entra_path = Path('src/BE/infrastructure/deploy-entra.ps1')
          entra = entra_path.read_text(encoding='utf-8')
          entra = entra.replace(
              '    $isWindows = [Environment]::OSVersion.Platform -eq [PlatformID]::Win32NT\n    if (-not $isWindows) {',
              '    $runningOnWindows = [Environment]::OSVersion.Platform -eq [PlatformID]::Win32NT\n    if (-not $runningOnWindows) {',
              1,
          )
          entra_path.write_text(entra, encoding='utf-8', newline='\n')

          if 'organizationRepository' in invitation:
              raise SystemExit('Unused organizationRepository dependency remains')
          if '$isWindows' in entra:
              raise SystemExit('PowerShell automatic-variable collision remains')
          PY

          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-wor-190-local-runtime.yml
          git add \
            src/BE/WorkslipApi/Workslip.Application/Invitations/InvitationService.cs \
            src/BE/infrastructure/deploy-entra.ps1
          git commit -m "RBJ-190 clean local startup warnings"
          git push origin HEAD:rbj--190-infrastructure-deployment-hardening
