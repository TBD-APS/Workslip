name: TEMP — Assistant Validation — WOR-219

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FE/src/components/forms/NavigationGuard.tsx'
      - 'src/FE/src/components/forms/NavigationGuard.test.tsx'
      - 'src/FE/src/features/jobs/components/AddressAutocomplete.tsx'
      - 'src/FE/src/features/jobs/components/AddressAutocomplete.test.tsx'
      - 'src/FE/src/features/jobs/components/JobDetailBlocks.tsx'
      - 'src/FE/src/features/jobs/components/JobDetails.tsx'
      - 'src/FE/src/features/jobs/components/steps/JobOverviewStep.tsx'
      - 'src/FE/src/features/jobs/components/steps/JobOverviewStep.destination.test.tsx'
      - '.github/workflows/wor-219-validation.yml'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  validate:
    name: Frontend and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate frontend API client
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Lint affected frontend files
        run: >-
          npx eslint
          src/components/forms/NavigationGuard.tsx
          src/components/forms/NavigationGuard.test.tsx
          src/features/jobs/components/AddressAutocomplete.tsx
          src/features/jobs/components/AddressAutocomplete.test.tsx
          src/features/jobs/components/JobDetailBlocks.tsx
          src/features/jobs/components/JobDetails.tsx
          src/features/jobs/components/steps/JobOverviewStep.tsx
          src/features/jobs/components/steps/JobOverviewStep.destination.test.tsx

      - name: Run focused regression tests
        run: >-
          npm test -- --run
          src/components/forms/NavigationGuard.test.tsx
          src/features/jobs/components/AddressAutocomplete.test.tsx
          src/features/jobs/components/steps/JobOverviewStep.destination.test.tsx
          src/features/jobs/components/steps/CustomerCreationVisibility.test.tsx

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Create browser validation harness
        run: |
          mkdir -p .tmp-wor-219
          cat > wor-219.validation.html <<'HTML'
          <!doctype html>
          <html lang="da">
            <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>WOR-219 validation</title></head>
            <body><div id="root"></div><div id="portal-root"></div><script type="module" src="/wor-219.validation.tsx"></script></body>
          </html>
          HTML

          cat > wor-219.validation.tsx <<'TSX'
          import { StrictMode, useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import { createMemoryRouter, RouterProvider, useNavigate } from 'react-router-dom';
          import './src/base.css';
          import { NavigationGuard } from './src/components/forms/NavigationGuard';
          import { DestinationAddressBlock } from './src/features/jobs/components/JobDetailBlocks';

          declare global {
            interface Window {
              __wor219AutosaveCalls: number;
            }
          }

          window.__wor219AutosaveCalls = 0;

          function DestinationExample({ readOnly, testId }: { readOnly: boolean; testId: string }) {
            const [address, setAddress] = useState('Testvej 1');
            const [zipCode, setZipCode] = useState('8000');
            const [city, setCity] = useState('Aarhus C');
            return (
              <div data-testid={testId}>
                <DestinationAddressBlock
                  value={address}
                  zipCode={zipCode}
                  city={city}
                  readOnly={readOnly}
                  onChange={setAddress}
                  onZipCodeChange={setZipCode}
                  onCityChange={setCity}
                />
              </div>
            );
          }

          function EditPage() {
            const navigate = useNavigate();
            const [dirty, setDirty] = useState(false);
            const [pending, setPending] = useState(false);

            const startChange = () => {
              setDirty(true);
              setPending(true);
              window.setTimeout(() => setPending(false), 500);
            };

            const saveAndLeave = async () => {
              window.__wor219AutosaveCalls += 1;
              await new Promise((resolve) => window.setTimeout(resolve, 250));
              setDirty(false);
              return true;
            };

            return (
              <main className="page-container">
                <h1>Rediger sag</h1>
                <DestinationExample readOnly testId="user-destination" />
                <DestinationExample readOnly={false} testId="admin-destination" />
                <button type="button" onClick={startChange}>Start ændring</button>
                <button type="button" onClick={() => navigate('/other')}>Forlad editor</button>
                <NavigationGuard
                  when={dirty}
                  autoSavePending={pending}
                  autoSaveOnLeave={saveAndLeave}
                />
              </main>
            );
          }

          function ManualPage() {
            const navigate = useNavigate();
            return (
              <main className="page-container">
                <h1>Manuel redigering</h1>
                <button type="button" onClick={() => navigate('/other')}>Forlad manuel editor</button>
                <NavigationGuard when onSave={async () => undefined} />
              </main>
            );
          }

          const mode = new URLSearchParams(window.location.search).get('mode');
          const router = createMemoryRouter([
            { path: '/edit', element: <EditPage /> },
            { path: '/manual', element: <ManualPage /> },
            { path: '/other', element: <h1>Anden side</h1> },
          ], { initialEntries: [mode === 'manual' ? '/manual' : '/edit'] });

          createRoot(document.getElementById('root')!).render(
            <StrictMode><RouterProvider router={router} /></StrictMode>,
          );
          TSX

          cat > .tmp-wor-219/playwright.config.ts <<'TS'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: '.',
            timeout: 15_000,
            reporter: 'line',
            use: {
              baseURL: 'http://127.0.0.1:5270',
              browserName: 'chromium',
            },
          });
          TS

          cat > .tmp-wor-219/wor-219.spec.ts <<'TS'
          import { expect, test } from '@playwright/test';

          test('autosaves before leaving and enforces destination edit permissions', async ({ page }) => {
            const browserErrors: string[] = [];
            page.on('console', (message) => {
              if (message.type() === 'error') browserErrors.push(message.text());
            });
            page.on('pageerror', (error) => browserErrors.push(error.message));

            await page.goto('/wor-219.validation.html');

            const userDestination = page.getByTestId('user-destination').getByRole('textbox');
            const adminDestination = page.getByTestId('admin-destination').getByRole('textbox');
            await expect(userDestination).toHaveAttribute('readonly', '');
            await expect(page.getByTestId('user-destination').getByTitle('Fjern adresse')).toHaveCount(0);
            await expect(adminDestination).not.toHaveAttribute('readonly', '');

            await page.getByRole('button', { name: 'Start ændring' }).click();
            await page.getByRole('button', { name: 'Forlad editor' }).click();

            await expect(page.getByRole('dialog', { name: 'Gemmer ændringer' })).toBeVisible();
            await expect(page.getByRole('button', { name: 'Forlad uden at gemme' })).toHaveCount(0);
            expect(await page.evaluate(() => window.__wor219AutosaveCalls)).toBe(0);

            await expect(page.getByRole('heading', { name: 'Anden side' })).toBeVisible();
            expect(await page.evaluate(() => window.__wor219AutosaveCalls)).toBe(1);
            expect(browserErrors).toEqual([]);
          });

          test('preserves manual save and discard choices on desktop', async ({ page }) => {
            await page.goto('/wor-219.validation.html?mode=manual');
            await page.getByRole('button', { name: 'Forlad manuel editor' }).click();

            await expect(page.getByRole('dialog', { name: 'Ugemte ændringer' })).toBeVisible();
            await expect(page.getByRole('button', { name: 'Forlad uden at gemme' })).toBeVisible();
            await expect(page.getByRole('button', { name: 'Gem og forlad' })).toBeVisible();
          });

          test('keeps the readonly destination and autosave flow usable on mobile', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('/wor-219.validation.html');

            await expect(page.getByTestId('user-destination').getByRole('textbox')).toHaveAttribute('readonly', '');
            await page.getByRole('button', { name: 'Start ændring' }).click();
            await page.getByRole('button', { name: 'Forlad editor' }).click();
            await expect(page.getByRole('dialog', { name: 'Gemmer ændringer' })).toBeVisible();
            await expect(page.getByRole('heading', { name: 'Anden side' })).toBeVisible();
          });
          TS

      - name: Run browser validation
        run: |
          set -Eeuo pipefail
          npx vite --host 127.0.0.1 --port 5270 > .tmp-wor-219/vite.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            rm -f wor-219.validation.html wor-219.validation.tsx
            rm -rf .tmp-wor-219
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5270/wor-219.validation.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            cat .tmp-wor-219/vite.log || true
            exit 1
          fi

          npx playwright test --config .tmp-wor-219/playwright.config.ts
