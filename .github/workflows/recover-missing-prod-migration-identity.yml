name: Recover missing production migration identity

on:
  workflow_run:
    workflows: [Backend API deploy]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: azure-api-prod-bootstrap-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover missing migration identity
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: windows-2022
    timeout-minutes: 30
    environment: prod
    env:
      AZURE_RESOURCE_GROUP: rg-mrsoftware-prod
      MIGRATION_IDENTITY_NAME: id-mrsoftware-prod-migration
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify recovery target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Production recovery may only run from main. Selected ref: $env:GITHUB_REF"
          }

          if ($env:FAILED_RUN_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Backend deployment did not provide a valid main commit SHA: $env:FAILED_RUN_SHA"
          }

          if ([string]::IsNullOrWhiteSpace('${{ vars.AZURE_INFRA_CLIENT_ID }}')) {
            throw 'GitHub environment prod is missing AZURE_INFRA_CLIENT_ID.'
          }

      - name: Checkout failed production revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FAILED_RUN_SHA }}

      - name: Azure login as infrastructure identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check migration identity
        id: migration-identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $identityId = @(& az identity list `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --query "[?name=='$env:MIGRATION_IDENTITY_NAME'].id | [0]" `
            --output tsv 2>&1 | ForEach-Object { $_.ToString() })
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect migration identity.`n$($identityId -join [Environment]::NewLine)"
          }

          $identityId = ($identityId -join [Environment]::NewLine).Trim()
          if ([string]::IsNullOrWhiteSpace($identityId)) {
            'missing=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Migration identity is missing; starting one-time recovery."
          }
          else {
            'missing=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Migration identity already exists. This failed deployment has a different cause; recovery will not mutate infrastructure or rerun it."
          }

      - name: Ensure sqlcmd
        if: ${{ steps.migration-identity.outputs.missing == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command sqlcmd -ErrorAction SilentlyContinue)) {
            choco install sqlcmd --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install sqlcmd with exit code $LASTEXITCODE."
            }
          }

          Get-Command sqlcmd -ErrorAction Stop | Out-Null

      - name: Reconcile database migration identity
        if: ${{ steps.migration-identity.outputs.missing == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\src\BE\infrastructure\reconcile-database-migration-identity.ps1 `
            -Environment prod `
            -CompanyName mrsoftware

      - name: Verify migration identity recovery
        if: ${{ steps.migration-identity.outputs.missing == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $clientId = @(& az identity show `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:MIGRATION_IDENTITY_NAME `
            --query clientId `
            --output tsv 2>&1 | ForEach-Object { $_.ToString() })
          if ($LASTEXITCODE -ne 0) {
            throw "Migration identity was not available after recovery.`n$($clientId -join [Environment]::NewLine)"
          }

          $clientId = ($clientId -join [Environment]::NewLine).Trim()
          if ($clientId -notmatch '^[0-9a-fA-F-]{36}$') {
            throw "Migration identity returned an invalid client ID after recovery."
          }

      - name: Rerun failed backend deployment jobs
        if: ${{ steps.migration-identity.outputs.missing == 'true' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:FAILED_RUN_ID/rerun-failed-jobs"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers | Out-Null

          "Recovered missing production migration identity and requested rerun of Backend API deploy run $env:FAILED_RUN_ID for $env:FAILED_RUN_SHA." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
