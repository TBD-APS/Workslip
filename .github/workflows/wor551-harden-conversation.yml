name: WOR-551 temporary conversation hardening v2

on:
  push:
    branches:
      - rbj--551-conversations-actions-v1

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rbj--551-conversations-actions-v1
          fetch-depth: 0
      - name: Harden action recovery and read acknowledgement
        shell: python
        run: |
          from pathlib import Path

          service = Path('src/BE/WorkslipApi/Workslip.Application/Conversations/JobConversationService.cs')
          text = service.read_text()
          old = '''        var (organizationId, userId, _) = access.Value;
        var message = await repository.GetByIdAsync(
            organizationId,
            jobId,
            messageId,
            cancellationToken);'''
          new = '''        var (organizationId, userId, job) = access.Value;
        var message = await repository.GetByIdAsync(
            organizationId,
            jobId,
            messageId,
            cancellationToken);'''
          if old not in text:
              raise SystemExit('Resolve access anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (message.Action.Type == ConversationActionType.SubmitForReview)
        {
            var transition = await jobs.ChangeStatusAsync(
                jobId,
                new ChangeJobStatusRequest(JobStatus.InReview),
                cancellationToken);
            if (!transition.IsSuccess)
                return MapFailure<ConversationMessageResponse>(transition);
        }'''
          new = '''        if (message.Action.Type == ConversationActionType.SubmitForReview)
        {
            if (job.Status is JobStatus.Draft or JobStatus.Rejected)
            {
                var transition = await jobs.ChangeStatusAsync(
                    jobId,
                    new ChangeJobStatusRequest(JobStatus.InReview),
                    cancellationToken);
                if (!transition.IsSuccess)
                    return MapFailure<ConversationMessageResponse>(transition);
            }
            else if (job.Status != JobStatus.InReview)
            {
                return Result<ConversationMessageResponse>.Conflict(
                    "Sagen kan ikke længere sendes til gennemgang fra den aktuelle status.");
            }
        }'''
          if old not in text:
              raise SystemExit('SubmitForReview transition anchor not found')
          service.write_text(text.replace(old, new, 1))

          drawer = Path('src/FE/src/features/jobs/components/JobConversationDrawer.tsx')
          text = drawer.read_text()
          text = text.replace(
              "import { useEffect, useMemo, useState } from 'react';",
              "import { useEffect, useMemo, useRef, useState } from 'react';",
              1,
          )
          state_anchor = '''  const [mentionsOpen, setMentionsOpen] = useState(false);
  const [actionsOpen, setActionsOpen] = useState(false);'''
          state_replacement = state_anchor + '''
  const readAttemptedRef = useRef(false);'''
          if state_anchor not in text:
              raise SystemExit('Drawer state anchor not found')
          text = text.replace(state_anchor, state_replacement, 1)

          old = '''  useEffect(() => {
    if (!isOpen || !conversation.data || unreadCount <= 0 || markRead.isPending) return;

    markRead.mutate(
      { jobId },
      {
        onSuccess: () => {
          queryClient.setQueryData(
            getGetApiJobsJobIdConversationQueryKey(jobId),
            { ...conversation.data, unreadCount: 0 },
          );
        },
      },
    );
  }, [conversation.data, isOpen, jobId, markRead, queryClient, unreadCount]);'''
          new = '''  useEffect(() => {
    if (!isOpen) {
      readAttemptedRef.current = false;
      return;
    }
    if (unreadCount <= 0) {
      readAttemptedRef.current = false;
      return;
    }
    if (!conversation.data || markRead.isPending || readAttemptedRef.current) return;

    readAttemptedRef.current = true;
    markRead.mutate(
      { jobId },
      {
        onSuccess: () => {
          queryClient.setQueryData(
            getGetApiJobsJobIdConversationQueryKey(jobId),
            { ...conversation.data, unreadCount: 0 },
          );
        },
      },
    );
  }, [conversation.data, isOpen, jobId, markRead, queryClient, unreadCount]);'''
          if old not in text:
              raise SystemExit('Mark-read effect anchor not found')
          drawer.write_text(text.replace(old, new, 1))
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/wor551-harden-conversation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RBJ-551: harden conversation action recovery"
          git push origin HEAD:rbj--551-conversations-actions-v1
