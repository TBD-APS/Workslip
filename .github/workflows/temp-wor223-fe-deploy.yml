name: TEMP WOR-223 frontend deploy validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FE/src/components/layouts/AppLayout.desktopOnly.test.tsx'
      - 'src/FE/src/features/superadmin/components/DesktopOnlySuperadmin.test.tsx'
      - '.github/workflows/temp-wor223-fe-deploy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FE

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run exact Vercel build command
        run: npm run generate:api:dev && npx tsc -b && npx vite build

      - name: Lint affected fixtures
        run: >-
          npx eslint
          src/components/layouts/AppLayout.desktopOnly.test.tsx
          src/features/superadmin/components/DesktopOnlySuperadmin.test.tsx

      - name: Run focused tests
        run: >-
          npm test -- --run
          src/components/layouts/AppLayout.desktopOnly.test.tsx
          src/features/superadmin/components/DesktopOnlySuperadmin.test.tsx
