name: Deploy backend · Azure API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  API_PROJECT: src/BE/WorkslipApi/Workslip.Api.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish/api
  DEPLOY_PACKAGE: ${{ github.workspace }}/publish/workslip-api.zip
  AZURE_WEBAPP_NAME: api-mrsoftwarev2-live
  AZURE_RESOURCE_GROUP: rg-mrsoftwarev2-live
  AZURE_MIGRATION_IDENTITY_NAME: id-mrsoftwarev2-live-migration
  TARGET_ENVIRONMENT: live
  TARGET_COMPANY_NAME: mrsoftwarev2
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
  CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
  DEPLOYMENT_SLOT: staging

permissions:
  contents: read

# v1 has a stale deployment waiting for the old manual-review policy. Isolate
# current releases from that historical queue while keeping deployments serialized.
concurrency:
  group: workslip-live-backend-v2
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Backend · Verify production eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify manual deployment branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo "::error::Manual backend deploy may only run from main."; exit 1; }

      - name: Checkout trusted release policy
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact green main CI Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(--sha "${RELEASE_SHA}")
          [[ -n "${CI_RUN_ID}" ]] && args+=(--ci-run-id "${CI_RUN_ID}")
          node tools/release/verify-production-eligibility.mjs "${args[@]}"

  build:
    name: Backend · Build release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-ci
    outputs:
      artifact_sha256: ${{ steps.package.outputs.sha256 }}
      release_phase: ${{ steps.release-target.outputs.phase }}
      release_testing_enabled: ${{ steps.release-target.outputs.enable_development_endpoints }}
    steps:
      - name: Checkout exact validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checked out SHA
        run: test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve production release policy
        id: release-target
        run: >-
          node tools/release/resolve-release-environment.mjs
          --environment production
          --require-runnable
          --github-output

      - name: Enforce expand-contract migration policy
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(git rev-parse HEAD^)"
          node tools/release/verify-migration-compatibility.mjs "${base}" "${RELEASE_SHA}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore, build and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore "${API_PROJECT}" --nologo
          dotnet build "${API_PROJECT}" --configuration Release --no-restore --nologo
          dotnet publish "${API_PROJECT}" --configuration Release --no-build --output "${PUBLISH_DIR}" --nologo

      - name: Create deployment package and provenance
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${DEPLOY_PACKAGE}"
          (cd "${PUBLISH_DIR}" && zip -q -r "${DEPLOY_PACKAGE}" .)
          unzip -Z1 "${DEPLOY_PACKAGE}" | grep -qx 'Workslip.Api.dll'
          sha256="$(sha256sum "${DEPLOY_PACKAGE}" | awk '{print $1}')"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          {
            echo "release_sha=${RELEASE_SHA}"
            echo "artifact_sha256=${sha256}"
            echo "built_at=$(date -u +%FT%TZ)"
          } > "${DEPLOY_PACKAGE}.provenance"

      - name: Upload exact-SHA artifact
        uses: actions/upload-artifact@v7
        with:
          name: workslip-api-${{ env.RELEASE_SHA }}
          path: |
            ${{ env.DEPLOY_PACKAGE }}
            ${{ env.DEPLOY_PACKAGE }}.provenance
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Backend · Live migration and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    # Keep the environment boundary because the Azure OIDC values are scoped here.
    # Review policy is configured in GitHub, not re-enforced by repository code.
    environment:
      name: live
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout exact validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Re-verify green current main before mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(--sha "${RELEASE_SHA}")
          [[ -n "${CI_RUN_ID}" ]] && args+=(--ci-run-id "${CI_RUN_ID}")
          node tools/release/verify-production-eligibility.mjs "${args[@]}"

      - name: Download exact-SHA artifact
        uses: actions/download-artifact@v8
        with:
          name: workslip-api-${{ env.RELEASE_SHA }}
          path: ${{ github.workspace }}/publish

      - name: Verify artifact hash
        shell: bash
        env:
          EXPECTED: ${{ needs.build.outputs.artifact_sha256 }}
        run: |
          set -Eeuo pipefail
          actual="$(sha256sum "${DEPLOY_PACKAGE}" | awk '{print $1}')"
          [[ "${actual}" == "${EXPECTED}" ]] || { echo "::error::Artifact hash mismatch."; exit 1; }

      - name: Azure login as application deployment identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve migration identity and deployment target
        id: azure
        shell: bash
        run: |
          set -Eeuo pipefail
          client_id="$(az identity show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_MIGRATION_IDENTITY_NAME}" --query clientId -o tsv)"
          [[ "${client_id}" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Migration identity unavailable."; exit 1; }
          host="$(az webapp show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_WEBAPP_NAME}" --query defaultHostName -o tsv)"
          [[ -n "${host}" && "${host}" != null ]] || { echo "::error::Production hostname unavailable."; exit 1; }
          slot_host="$(az webapp deployment slot list --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_WEBAPP_NAME}" --query "[?name=='${AZURE_WEBAPP_NAME}/${DEPLOYMENT_SLOT}'].defaultHostName | [0]" -o tsv)"
          echo "migration_client_id=${client_id}" >> "${GITHUB_OUTPUT}"
          echo "production_url=https://${host}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${slot_host}" && "${slot_host}" != null ]]; then
            echo 'slot_enabled=true' >> "${GITHUB_OUTPUT}"
            echo "staging_slot_host=${slot_host}" >> "${GITHUB_OUTPUT}"
          else
            echo 'slot_enabled=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Logout application deployment identity
        run: az logout

      - name: Azure login as database migration identity
        uses: azure/login@v3
        with:
          client-id: ${{ steps.azure.outputs.migration_client_id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure SQL migration runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Install-Module SqlServer -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          Import-Module SqlServer -ErrorAction Stop

      - name: Apply reviewed database migrations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./src/BE/infrastructure/run-database-migrations.ps1 `
            -Environment $env:TARGET_ENVIRONMENT `
            -CompanyName $env:TARGET_COMPANY_NAME

      - name: Logout database migration identity
        run: az logout

      - name: Azure login for application deployment
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment prerequisites
        id: mode
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace_id="$(az webapp config appsettings list --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_WEBAPP_NAME}" --query "[?name=='Azure__ApplicationInsights__WorkspaceId'].value | [0]" -o tsv)"
          [[ "${workspace_id}" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Diagnostics workspace is not configured."; exit 1; }
          slot_enabled="${{ steps.azure.outputs.slot_enabled }}"
          [[ "${slot_enabled}" == true || "${slot_enabled}" == false ]] || { echo '::error::Deployment mode was not resolved.'; exit 1; }
          echo "slot_enabled=${slot_enabled}" >> "${GITHUB_OUTPUT}"
          if [[ "${slot_enabled}" == true ]]; then
            echo "candidate_url=https://${{ steps.azure.outputs.staging_slot_host }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Apply release-testing safety mode
        shell: bash
        env:
          RELEASE_TESTING_ENABLED: ${{ needs.build.outputs.release_testing_enabled }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_TESTING_ENABLED}" == true || "${RELEASE_TESTING_ENABLED}" == false ]] || exit 1
          az webapp config appsettings set --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_WEBAPP_NAME}" --settings "ReleaseTesting__Enabled=${RELEASE_TESTING_ENABLED}" --output none

      - name: Deploy package
        shell: bash
        env:
          SLOT_ENABLED: ${{ steps.mode.outputs.slot_enabled }}
        run: |
          set -Eeuo pipefail
          args=(webapp deploy --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_WEBAPP_NAME}" --src-path "${DEPLOY_PACKAGE}" --type zip --clean true --restart true --enable-kudu-warmup true --enriched-errors true --track-status false --timeout 600000)
          if [[ "${SLOT_ENABLED}" == true ]]; then
            args+=(--slot "${DEPLOYMENT_SLOT}")
          fi
          for attempt in 1 2 3; do
            az "${args[@]}" && exit 0
            [[ "${attempt}" == 3 ]] && exit 1
            sleep $((attempt * 30))
          done

      - name: Verify candidate before traffic
        if: ${{ steps.mode.outputs.slot_enabled == 'true' }}
        run: bash tools/release/post-deploy-smoke.sh "${{ steps.mode.outputs.candidate_url }}"

      - name: Swap verified candidate into production
        if: ${{ steps.mode.outputs.slot_enabled == 'true' }}
        id: swap
        shell: bash
        run: |
          set -Eeuo pipefail
          az webapp deployment slot swap \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --slot "${DEPLOYMENT_SLOT}" \
            --target-slot production
          echo "completed=true" >> "${GITHUB_OUTPUT}"

      - name: Verify production after deploy
        id: production-smoke
        continue-on-error: true
        run: bash tools/release/post-deploy-smoke.sh "${{ steps.azure.outputs.production_url }}"

      - name: Roll back failed slot swap
        if: ${{ steps.mode.outputs.slot_enabled == 'true' && steps.swap.outputs.completed == 'true' && steps.production-smoke.outcome == 'failure' }}
        id: rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          az webapp deployment slot swap \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --slot "${DEPLOYMENT_SLOT}" \
            --target-slot production
          bash tools/release/post-deploy-smoke.sh "${{ steps.azure.outputs.production_url }}"
          echo "completed=true" >> "${GITHUB_OUTPUT}"

      - name: Fail release when post-deploy smoke failed
        if: ${{ steps.production-smoke.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Post-deploy smoke failed. Slot rollback was attempted when available."
          exit 1

      - name: Record release marker and summary
        if: ${{ success() }}
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
        run: |
          set -Eeuo pipefail
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --settings "Workslip__ReleaseSha=${RELEASE_SHA}" "Workslip__ReleaseArtifactSha256=${ARTIFACT_SHA256}" \
            --output none
          {
            echo "### Backend live release"
            echo
            echo "- SHA: \`${RELEASE_SHA}\`"
            echo "- Artifact SHA-256: \`${ARTIFACT_SHA256}\`"
            echo "- Azure app: \`${AZURE_WEBAPP_NAME}\`"
            echo "- Resource group: \`${AZURE_RESOURCE_GROUP}\`"
            echo "- Slot mode: \`${{ steps.mode.outputs.slot_enabled }}\`"
            echo "- Delivery path: staging slot + swap when available; direct production otherwise"
            echo "- Candidate smoke: passed when slot mode enabled"
            echo "- Production smoke: passed"
            echo "- Automatic rollback: available only in slot mode"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Capture Azure deployment diagnostics on failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          az webapp show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_WEBAPP_NAME}" --query '{state:state,host:defaultHostName,lastModified:lastModifiedTimeUtc}' -o jsonc
          az webapp log deployment list --resource-group "${AZURE_RESOURCE_GROUP}" --name "${AZURE_WEBAPP_NAME}" --query '[0:5]' -o jsonc
