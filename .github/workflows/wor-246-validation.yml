name: TEMP — Assistant Validation — WOR-246

on:
  pull_request:
    branches: [main]
    paths:
      - 'Docs/architecture/domain-and-dataflows.md'
      - 'src/BE/WorkslipApi/Workslip.Application/Jobs/JobService.cs'
      - 'src/BE/WorkslipApi/Workslip.Application/Jobs/JobViewTypes.cs'
      - 'src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfJobRepository.cs'
      - 'src/BE/WorkslipApi/Workslip.Tests/Jobs/JobViewTypesTests.cs'
      - 'src/FE/src/features/jobs/routes/CompletedJobReport.tsx'
      - 'src/FE/src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx'
      - 'src/FE/src/features/jobs/routes/JobList.tsx'
      - 'src/FE/src/features/jobs/routes/JobList.completed-dot.test.tsx'
      - 'src/FE/src/features/jobs/utils/markJobSeen.ts'
      - '.github/workflows/wor-246-validation.yml'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  backend:
    name: Backend build and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/BE/WorkslipApi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore Workslip.slnx

      - name: Build backend Release
        run: dotnet build Workslip.slnx -c Release --no-restore

      - name: Test completed-view semantics
        run: >-
          dotnet test Workslip.Tests/Workslip.Tests.csproj
          -c Release
          --no-build
          --filter FullyQualifiedName~JobViewTypesTests

  frontend:
    name: Frontend and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate frontend API client
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Lint affected frontend files
        run: >-
          npx eslint
          src/features/jobs/routes/CompletedJobReport.tsx
          src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx
          src/features/jobs/routes/JobList.tsx
          src/features/jobs/routes/JobList.completed-dot.test.tsx
          src/features/jobs/utils/markJobSeen.ts

      - name: Run focused frontend tests
        run: >-
          npm test -- --run
          src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx
          src/features/jobs/routes/JobList.completed-dot.test.tsx

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Create browser validation harness
        run: |
          mkdir -p .tmp-wor-246
          cat > wor-246.validation.html <<'HTML'
          <!doctype html>
          <html lang="da">
            <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>WOR-246 validation</title></head>
            <body><div id="root"></div><script type="module" src="/wor-246.validation.tsx"></script></body>
          </html>
          HTML

          cat > wor-246.validation.tsx <<'TSX'
          import { StrictMode, useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import type { JobListItemViewModel } from './src/api/generated/models';
          import { JobStatus } from './src/api/generated/models/jobStatus';
          import { JobCard } from './src/features/jobs/routes/JobList';
          import './src/base.css';
          import './src/App.css';

          declare global {
            interface Window {
              __wor246OpenCount: number;
            }
          }

          window.__wor246OpenCount = 0;

          function createJob(isSeen: boolean): JobListItemViewModel {
            return {
              id: 'job-1',
              organizationId: 'organization-1',
              customer: {
                customerId: 'customer-1',
                name: 'Kunde A/S',
                address: 'Testvej 1',
                email: 'kunde@example.com',
                contactPerson: 'Test Person',
                phone: '12345678',
              },
              reportNumber: '0001',
              status: JobStatus.Approved,
              installationTypes: [],
              assignedUsers: [{ id: 'user-1', displayName: 'Testbruger' }],
              softDeleted: false,
              totalHours: 1,
              createdAt: '2026-07-31T00:00:00Z',
              updatedAt: '2026-07-31T00:00:00Z',
              reportDate: '2026-07-31',
              jobType: 'KLS',
              destinationAddress: 'Testvej 2',
              destinationZipCode: '8000',
              destinationCity: 'Aarhus C',
              taskDescription: 'Testopgave',
              isSeen,
              isNewRejection: false,
              rejectionNote: null,
            };
          }

          function ValidationPage() {
            const [isSeen, setIsSeen] = useState(false);
            const [openCount, setOpenCount] = useState(0);

            return (
              <main className="page-container">
                <h1>Opgaver</h1>
                <div className="job-list" data-testid="job-list">
                  <JobCard
                    job={createJob(isSeen)}
                    isAdmin={false}
                    onOpen={() => {
                      window.__wor246OpenCount += 1;
                      setOpenCount((count) => count + 1);
                    }}
                  />
                </div>
                <output data-testid="open-count">{openCount}</output>
                <button type="button" onClick={() => setIsSeen(true)}>Markér godkendt sag som set</button>
              </main>
            );
          }

          createRoot(document.getElementById('root')!).render(
            <StrictMode><ValidationPage /></StrictMode>,
          );
          TSX

          cat > .tmp-wor-246/playwright.config.ts <<'TS'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: '.',
            timeout: 15_000,
            reporter: 'line',
            use: {
              baseURL: 'http://127.0.0.1:5270',
              browserName: 'chromium',
            },
          });
          TS

          cat > .tmp-wor-246/wor-246.spec.ts <<'TS'
          import { expect, test } from '@playwright/test';

          async function validateCompletedDot(page: import('@playwright/test').Page) {
            const browserErrors: string[] = [];
            page.on('console', (message) => {
              if (message.type() === 'error') browserErrors.push(message.text());
            });
            page.on('pageerror', (error) => browserErrors.push(error.message));

            await page.goto('/wor-246.validation.html');
            const card = page.getByRole('button', { name: /SAG-0001/ });
            await expect(card).toBeVisible();
            await expect(card.locator('.approved-dot')).toBeVisible();

            await card.click();
            await expect(page.getByTestId('open-count')).toHaveText('1');

            await page.getByRole('button', { name: 'Markér godkendt sag som set' }).click();
            await expect(card.locator('.approved-dot')).toHaveCount(0);
            expect(browserErrors).toEqual([]);
          }

          test('shows and clears the assigned-user completed dot on desktop', async ({ page }) => {
            await page.setViewportSize({ width: 1280, height: 900 });
            await validateCompletedDot(page);
          });

          test('shows and clears the assigned-user completed dot on mobile', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await validateCompletedDot(page);
          });
          TS

      - name: Run browser validation
        run: |
          set -Eeuo pipefail
          npx vite --host 127.0.0.1 --port 5270 > .tmp-wor-246/vite.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            rm -f wor-246.validation.html wor-246.validation.tsx
            rm -rf .tmp-wor-246
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5270/wor-246.validation.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            cat .tmp-wor-246/vite.log || true
            exit 1
          fi

          npx playwright test --config .tmp-wor-246/playwright.config.ts
