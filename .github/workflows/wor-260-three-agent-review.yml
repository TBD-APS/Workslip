name: WOR-260 Three Agent Review

on:
  push:
    branches:
      - acmilan-mahad/wor-260-notifikation-medarbejder-maks-timer-brugt-pa-dag
    paths:
      - .github/workflows/wor-260-three-agent-review.yml

permissions:
  contents: read

jobs:
  three-agent-review:
    name: Three independent Kimi reviews
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_BASE_URL: https://api.moonshot.ai/v1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail closed when Kimi secret is unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KIMI_API_KEY:-}" || { echo "KIMI_API_KEY is not configured"; exit 10; }

      - name: Fetch current main
        shell: bash
        run: git fetch origin main --depth=50

      - name: Run three independent review agents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, pathlib, sys, time

          base = subprocess.check_output(['git','merge-base','HEAD','origin/main'], text=True).strip()
          diff = subprocess.check_output(['git','diff','--unified=50',f'{base}..HEAD','--',
              'src/BE/WorkslipApi/Workslip.Application/Notifications/INotificationService.cs',
              'src/BE/WorkslipApi/Workslip.Application/Notifications/NotificationService.cs',
              'src/BE/WorkslipApi/Workslip.Application/Worksheets/WorksheetService.cs',
              'src/BE/WorkslipApi/Workslip.Domain/Models/NotificationPayload.cs',
              'src/BE/WorkslipApi/Workslip.Domain/Models/NotificationType.cs',
              'src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfNotificationRepository.cs',
              'src/BE/WorkslipApi/Workslip.Tests/Notifications/EfNotificationRepositoryTests.cs',
              'src/BE/WorkslipApi/Workslip.Tests/Worksheets/DailyHoursLimitNotificationTests.cs'], text=True)
          if not diff.strip():
              raise SystemExit('No WOR-260 diff found')
          if len(diff) > 70000:
              diff = diff[:70000]

          models_req = urllib.request.Request(
              os.environ['MOONSHOT_BASE_URL'].rstrip('/') + '/models',
              headers={'Authorization':'Bearer ' + os.environ['KIMI_API_KEY']})
          with urllib.request.urlopen(models_req, timeout=60) as r:
              models = json.load(r).get('data', [])
          ids = [m.get('id','') for m in models]
          model = next((m for m in ids if m == 'kimi-k2.6'), None) or next((m for m in ids if m.lower().startswith('kimi-')), None)
          if not model:
              raise SystemExit('No Kimi model available')
          print(f'Using model: {model}')

          roles = [
            ('correctness', 'Act as an independent senior backend correctness reviewer. Check recipient, trigger semantics, payload, failure handling, compatibility and correctness.'),
            ('edge-cases', 'Act as an independent adversarial edge-case and concurrency reviewer. Check duplicate user-visible notifications, retries, concurrent writes, edits, authorization/tenant concerns and hidden regressions.'),
            ('qa-regression', 'Act as an independent QA/regression reviewer. Check whether tests prove the behavior and whether existing notification/timesheet flows regress. Separate unrelated CI failures.'),
          ]
          facts = '''Verified system facts:\n- Maximum daily hours is exactly 24 and values are decimal quarter-hour increments.\n- SQL Server worksheet saves use an exclusive transaction-owned application lock per organization/user/date before enforcing the 24-hour limit.\n- Daily-limit notifications use one deterministic queue primary-key ID per user/date.\n- Delivered notifications are retained: MarkNotificationCompletedAsync sets Status=Completed; it does not delete the row.\n- ClaimPendingNotificationsAsync does not claim Completed rows.\n- Duplicate inserts with the same ID are idempotent even if the existing row is Completed; a regression test proves this.\n- Required user-visible behavior: at most one daily-limit notification per employee/day when the persisted day reaches 24 hours. It need not attribute the crossing to one specific concurrent HTTP request.\n- Manual local verification was performed by the repository owner.\n'''

          def ask_agent(name, role):
              prompt = f'''Issue WOR-260: "Notifikation: medarbejder maks timer brugt på dag".\n\n{facts}\nRole: {role}\n\nReview ONLY this patch against WOR-260. Return JSON only with exactly these keys: verdict, confidence, findings, required_fixes, rationale. verdict must be PASS or FAIL. findings and required_fixes must be arrays of at most 5 concise strings. rationale must be at most 120 words. PASS means no concrete issue-specific blocker remains. Do not fail for behavior contradicted by the verified facts or speculative future requirements.\n\nPATCH:\n{diff}'''
              payload={
                'model': model,
                'messages': [
                  {'role':'system','content':'You are an independent code-review agent. Judge independently, use only supplied evidence, and fail closed only for concrete issue-specific blockers. Return compact valid JSON only.'},
                  {'role':'user','content':prompt}],
                'thinking': {'type':'disabled'},
                'response_format': {'type':'json_object'},
                'max_completion_tokens': 1800,
                'stream': False
              }
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req=urllib.request.Request(
                        os.environ['MOONSHOT_BASE_URL'].rstrip('/') + '/chat/completions',
                        data=json.dumps(payload).encode(),
                        headers={'Authorization':'Bearer '+os.environ['KIMI_API_KEY'],'Content-Type':'application/json'},
                        method='POST')
                      with urllib.request.urlopen(req, timeout=180) as r:
                          api=json.load(r)
                      raw=api['choices'][0]['message']['content']
                      result=json.loads(raw)
                      verdict=str(result.get('verdict','')).upper()
                      if verdict not in ('PASS','FAIL'):
                          raise ValueError(f'invalid verdict {verdict!r}')
                      return {'agent':name,'model':api.get('model') or model,**result}
                  except (json.JSONDecodeError, ValueError) as exc:
                      last_error = exc
                      print(f'{name}: invalid structured response on attempt {attempt}: {exc}')
                      if attempt < 3:
                          time.sleep(1)
              raise SystemExit(f'{name}: failed to return valid JSON after 3 attempts: {last_error}')

          results=[]
          for name, role in roles:
              result=ask_agent(name, role)
              results.append(result)
              print(f"AGENT {name}: {str(result['verdict']).upper()}")
              print(json.dumps(result, ensure_ascii=False, indent=2))
              pathlib.Path('/tmp/wor-260-three-agent-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')

          failed=[r['agent'] for r in results if str(r.get('verdict','')).upper()!='PASS']
          if failed:
              print('Three-agent gate FAILED:', ', '.join(failed))
              sys.exit(30)
          print('THREE_AGENT_GATE=PASS')
          PY

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wor-260-three-agent-review
          path: /tmp/wor-260-three-agent-results.json
          if-no-files-found: warn
          retention-days: 14
