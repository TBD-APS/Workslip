name: Production delivery · Self-test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/generate-frontend-api/**'
      - '.github/workflows/backend-production-deploy.yml'
      - '.github/workflows/database-production-migrations.yml'
      - '.github/workflows/infrastructure-current-production.yml'
      - '.github/workflows/infrastructure-new-tenant.yml'
      - '.github/workflows/infrastructure-production-reconcile.yml'
      - '.github/workflows/production-readiness-smoke.yml'
      - '.github/workflows/production-delivery-selftest.yml'
      - 'src/BE/infrastructure/*.bicep'
      - 'tools/release/configure-github-branch-rules.ps1'
      - 'tools/release/verify-production-eligibility.mjs'
      - 'tools/release/verify-production-eligibility.test.mjs'
      - 'tools/release/verify-deployment-environment.mjs'
      - 'tools/release/verify-deployment-environment.test.mjs'
      - 'src/FE/scripts/vercel-production-eligibility.mjs'
      - 'src/FE/scripts/vercel-production-eligibility.test.mjs'
      - 'src/FE/vercel.json'
      - 'Docs/operations/ci-quality-gates.md'
      - 'Docs/operations/feature-branch-safety.md'
      - 'Docs/architecture/adr/0005-main-as-production-boundary.md'
  push:
    branches: [main]
    paths:
      - '.github/actions/generate-frontend-api/**'
      - '.github/workflows/backend-production-deploy.yml'
      - '.github/workflows/database-production-migrations.yml'
      - '.github/workflows/infrastructure-current-production.yml'
      - '.github/workflows/infrastructure-new-tenant.yml'
      - '.github/workflows/infrastructure-production-reconcile.yml'
      - '.github/workflows/production-readiness-smoke.yml'
      - '.github/workflows/production-delivery-selftest.yml'
      - 'src/BE/infrastructure/*.bicep'
      - 'tools/release/configure-github-branch-rules.ps1'
      - 'tools/release/verify-production-eligibility.mjs'
      - 'tools/release/verify-production-eligibility.test.mjs'
      - 'tools/release/verify-deployment-environment.mjs'
      - 'tools/release/verify-deployment-environment.test.mjs'
      - 'src/FE/scripts/vercel-production-eligibility.mjs'
      - 'src/FE/scripts/vercel-production-eligibility.test.mjs'
      - 'src/FE/vercel.json'
      - 'Docs/operations/ci-quality-gates.md'
      - 'Docs/operations/feature-branch-safety.md'
      - 'Docs/architecture/adr/0005-main-as-production-boundary.md'

permissions:
  contents: read

jobs:
  static-validation:
    name: Production delivery · Static invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test exact-SHA production gates
        run: |
          set -Eeuo pipefail
          node --check tools/release/verify-production-eligibility.mjs
          node --test tools/release/verify-production-eligibility.test.mjs
          node --check tools/release/verify-deployment-environment.mjs
          node --test tools/release/verify-deployment-environment.test.mjs
          node --check src/FE/scripts/vercel-production-eligibility.mjs
          node --test src/FE/scripts/vercel-production-eligibility.test.mjs

      - name: Compile authoritative Bicep templates
        run: |
          set -Eeuo pipefail
          for template in src/BE/infrastructure/*.bicep; do
            az bicep build --file "${template}" --stdout >/dev/null
          done

      - name: Verify Vercel production is green-gated and deterministic
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('src/FE/vercel.json', 'utf8'));
          const deployments = config.git?.deploymentEnabled;
          if (deployments?.main !== true || deployments?.['**'] !== false || Object.keys(deployments).length !== 2) {
            throw new Error('Vercel automatic Git deployments must use a globstar deny-all rule with only main explicitly enabled.');
          }
          if (!String(config.buildCommand || '').includes('scripts/vercel-production-eligibility.mjs')) {
            throw new Error('Vercel production build must run the root-local exact-SHA production gate.');
          }
          if (String(config.buildCommand || '').includes('../')) {
            throw new Error('Vercel production gate must not depend on files outside the configured Root Directory.');
          }
          if (String(config.buildCommand || '').includes('generate:api:dev')) {
            throw new Error('Vercel production must not generate API clients from the dev OpenAPI endpoint.');
          }
          NODE

      - name: Verify all production mutation workflows fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          workflows=(
            .github/workflows/backend-production-deploy.yml
            .github/workflows/database-production-migrations.yml
            .github/workflows/infrastructure-production-reconcile.yml
          )
          for workflow in "${workflows[@]}"; do
            grep -Fq 'verify-production-eligibility.mjs' "${workflow}"
            grep -Fq 'group: workslip-production' "${workflow}"
          done

          backend=.github/workflows/backend-production-deploy.yml
          grep -Fq 'environment:' "${backend}"
          grep -Fq "github.event_name == 'workflow_dispatch' && 'live' || 'prod'" "${backend}"
          grep -Fq 'DEPLOY NEW TENANT AFTER DATA VERIFIED' "${backend}"
          grep -Fq 'data_manifest_sha256' "${backend}"
          grep -Fq 'data_manifest_evidence_url' "${backend}"
          grep -Fq 'issue/WOR-430/' "${backend}"
          grep -Fq 'api-mrsoftwarev2-live' "${backend}"
          grep -Fq 'api-mrsoftware-prod' "${backend}"
          grep -Fq 'verify-deployment-environment.mjs' "${backend}"
          grep -Fq -- '--require-reviewers' "${backend}"
          grep -Fq -- '--required-reviewer-id 31623093' "${backend}"
          grep -Fq -- '--require-no-admin-bypass' "${backend}"
          grep -Fq 'environment: prod' .github/workflows/database-production-migrations.yml

          infrastructure=.github/workflows/infrastructure-production-reconcile.yml
          grep -Fq 'name: $'"{{ needs.select-target.outputs.github_environment }}" "${infrastructure}"
          grep -Fq "echo 'github_environment=prod'" "${infrastructure}"
          grep -Fq "echo 'github_environment=live'" "${infrastructure}"
          grep -Fq "echo 'resource_group=rg-mrsoftware-prod'" "${infrastructure}"
          grep -Fq "echo 'resource_group=rg-mrsoftwarev2-live'" "${infrastructure}"
          grep -Fq "expected='PLAN NEW TENANT'" "${infrastructure}"
          grep -Fq "expected='RECONCILE NEW TENANT'" "${infrastructure}"
          grep -Fq 'plan.ps1' "${infrastructure}"
          grep -Fq "inputs.operation == 'reconcile'" "${infrastructure}"
          grep -Fq 'verify-deployment-environment.mjs' "${infrastructure}"
          grep -Fq 'workflow_call:' "${infrastructure}"

          new_tenant_control=.github/workflows/infrastructure-new-tenant.yml
          current_production_control=.github/workflows/infrastructure-current-production.yml
          for control in "${new_tenant_control}" "${current_production_control}"; do
            grep -Fq 'workflow_dispatch:' "${control}"
            grep -Fq 'acknowledge:' "${control}"
            grep -Fq 'ACKNOWLEDGED:' "${control}"
            grep -Fq 'actions: read' "${control}"
            grep -Fq 'id-token: write' "${control}"
            grep -Fq 'uses: ./.github/workflows/infrastructure-production-reconcile.yml' "${control}"
          done
          grep -Fq 'target: new-tenant' "${new_tenant_control}"
          grep -Fq 'PLAN NEW TENANT' "${new_tenant_control}"
          grep -Fq 'RECONCILE NEW TENANT' "${new_tenant_control}"
          grep -Fq 'target: current-production' "${current_production_control}"
          grep -Fq 'PLAN CURRENT PRODUCTION' "${current_production_control}"
          grep -Fq 'RECONCILE CURRENT PRODUCTION' "${current_production_control}"

          grep -Fq -- '--ci-run-id "${CI_RUN_ID}"' "${backend}"
          grep -Fq 'actions: read' "${backend}"
          grep -Fq 'Re-verify green current main before mutation' "${backend}"

          if grep -Fq 'merge-base --is-ancestor' "${backend}"; then
            echo 'Backend production deploy must not accept an older green ancestor SHA.' >&2
            exit 1
          fi

      - name: Verify repository protection source is fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          rules=tools/release/configure-github-branch-rules.ps1
          grep -Fq "RequiredStatusChecks = @('CI Gate', 'Feature change guard')" "${rules}"
          grep -Fq -- "-Name 'Workslip main protection'" "${rules}"
          grep -Fq -- "-IncludedRefs @('refs/heads/main')" "${rules}"
          grep -Fq 'bypass_actors = @()' "${rules}"
          grep -Fq '$actual.bypass_actors' "${rules}"
          grep -Fq 'strict_required_status_checks_policy = $true' "${rules}"

      - name: Reject retired production workflow entrypoints
        shell: bash
        run: |
          set -Eeuo pipefail
          retired=(
            .github/workflows/main_api-mrsoftware-prod.yml
            .github/workflows/production-database-migrations.yml
            .github/workflows/manual-production-infrastructure.yml
            .github/workflows/playwright-prod-smoke.yml
          )
          for path in "${retired[@]}"; do
            if [[ -e "${path}" ]]; then
              echo "Retired production workflow still exists: ${path}" >&2
              exit 1
            fi
          done

      - name: Verify readiness also targets green main
        run: |
          set -Eeuo pipefail
          grep -Fq 'verify-production-eligibility.mjs' .github/workflows/production-readiness-smoke.yml
          grep -Fq "refs/heads/main" .github/workflows/production-readiness-smoke.yml

      - name: Validate maintained documentation
        run: python tools/docs/check_docs.py
