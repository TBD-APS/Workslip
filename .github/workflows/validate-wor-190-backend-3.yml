name: Validate current WOR-190 backend head

on:
  push:
    branches:
      - rbj--190-infrastructure-deployment-hardening
    paths:
      - .github/workflows/validate-wor-190-backend-3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--190-infrastructure-deployment-hardening
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build current head
        shell: bash
        run: |
          set +e
          validated_head=$(git rev-parse HEAD)
          cd src/BE/WorkslipApi
          dotnet restore Workslip.slnx > ../../../backend-validation.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            dotnet build Workslip.slnx --configuration Release --no-restore >> ../../../backend-validation.log 2>&1
            status=$?
          fi
          cd ../../..
          {
            echo "validated_head=$validated_head"
            echo "exit_code=$status"
            echo
            tail -n 250 backend-validation.log
          } > .github/WOR-190-backend-validation.txt
          exit 0

      - name: Publish result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/validate-wor-190-backend-3.yml
          git add .github/WOR-190-backend-validation.txt
          git commit -m "RBJ-190 record current backend validation"
          git push origin HEAD:rbj--190-infrastructure-deployment-hardening
