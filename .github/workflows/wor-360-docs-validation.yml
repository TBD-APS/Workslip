name: WOR-360 docs validation

on:
  push:
    branches:
      - 'rbj--360-docs-truth'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run documentation truth check
        run: python tools/docs/check_docs.py
