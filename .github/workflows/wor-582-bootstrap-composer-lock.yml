name: WOR-582 Materialize Gate 0 Composer Lock

on:
  push:
    branches:
      - rbj--582-laravel-control-plane-gate0

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: rbj--582-laravel-control-plane-gate0

      - name: Download exact lock from green Gate 0 run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gate0-lock
          mkdir -p /tmp/gate0-lock
          gh run download 31929048173 \
            --repo "${GITHUB_REPOSITORY}" \
            --name mr-saasy-gate0-composer-lock \
            --dir /tmp/gate0-lock
          test -s /tmp/gate0-lock/composer.lock
          cp /tmp/gate0-lock/composer.lock platform/mr-saasy-control-plane/composer.lock

      - name: Commit exact lock if missing or changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- platform/mr-saasy-control-plane/composer.lock && \
             [[ -z "$(git status --porcelain --untracked-files=all -- platform/mr-saasy-control-plane/composer.lock)" ]]; then
            echo 'Composer lock already matches green Gate 0 artifact.'
            exit 0
          fi

          git config user.name 'workslip-ci'
          git config user.email 'workslip-ci@users.noreply.github.com'
          git add platform/mr-saasy-control-plane/composer.lock
          git commit -m 'RBJ-582 commit green Gate 0 Composer lock'
          git push origin HEAD:rbj--582-laravel-control-plane-gate0
