name: TEMP WOR-221 repair validation workflow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-wor221-fix-validation.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--221-recover-cancelled-microsoft-login
      - name: Add generated-client step and remove this workflow
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temp-wor221-implement.yml')
          content = path.read_text(encoding='utf-8')
          needle = "      - name: Lint affected frontend files\n"
          step = """      - name: Generate frontend API client
        working-directory: src/FE
        run: |
          set -Eeuo pipefail
          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --output /dev/null \"${OPENAPI_BASE_URL}/openapi/v1.json\"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ \"${ready}\" != \"true\" ]]; then
            echo \"::error::Production OpenAPI endpoint did not become ready.\"
            exit 1
          fi
          npx orval --config orval.config.ts
        env:
          OPENAPI_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net
          VITE_API_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net

"""
          if content.count(needle) != 1:
              raise SystemExit('Validation insertion point did not match exactly once')
          path.write_text(content.replace(needle, step + needle, 1), encoding='utf-8')
          PY
          git config user.name 'Workslip Validation Bot'
          git config user.email 'workslip-validation@users.noreply.github.com'
          git add .github/workflows/temp-wor221-implement.yml
          git rm .github/workflows/temp-wor221-fix-validation.yml
          git commit -m 'TEMP WOR-221: generate API client before build'
          git push origin HEAD:rbj--221-recover-cancelled-microsoft-login
