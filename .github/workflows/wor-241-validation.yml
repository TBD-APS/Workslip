name: TEMP — Assistant Validation — WOR-241

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FE/src/features/jobs/routes/CompletedJobReport.tsx'
      - 'src/FE/src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx'
      - '.github/workflows/wor-241-validation.yml'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  validate:
    name: Frontend regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate frontend API client
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Lint affected frontend files
        run: >-
          npx eslint
          src/features/jobs/routes/CompletedJobReport.tsx
          src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx

      - name: Run focused regression
        run: npm test -- --run src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx

      - name: Build production frontend
        run: npm run build
