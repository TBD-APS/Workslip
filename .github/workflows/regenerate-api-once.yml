name: Regenerate API client once

on:
  push:
    branches:
      - fix/generated-api-accounting

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore API project
        run: dotnet restore src/BE/WorkslipApi/Workslip.Api.csproj --nologo

      - name: Generate branch-matched API client
        working-directory: src/FE
        run: node scripts/generate-api-client.mjs --no-restore

      - name: Commit generated client and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/regenerate-api-once.yml
          git config user.name 'MR Software automation'
          git config user.email 'automation@mrsoftware.dk'
          git add src/FE/src/api/generated .github/workflows/regenerate-api-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate frontend API client'
          git push origin HEAD:${GITHUB_REF_NAME}
