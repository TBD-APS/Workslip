name: WOR-199 sync main and validate

on:
  push:
    branches:
      - rbj--199-microsoft-full-logout

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: rbj--199-microsoft-full-logout
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-ff --no-edit origin/main

      - name: Validate merged authentication boundaries
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'src/BE/infrastructure/deploy-entra.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

          $login = Get-Content 'src/FE/src/features/auth/routes/Login.tsx' -Raw
          $layout = Get-Content 'src/FE/src/components/layouts/AppLayout.tsx' -Raw
          $entra = Get-Content 'src/FE/src/features/auth/api/entraLogin.ts' -Raw
          $deployment = Get-Content 'src/BE/infrastructure/deploy-entra.ps1' -Raw

          if ($login -notmatch 'lazy\(' -or $login -notmatch 'AUTH_PROVIDER_KEY' -or $login -notmatch 'ENTRA_LOGOUT_HINT_KEY') {
            throw 'Merged Login.tsx does not preserve both lazy one-time-code loading and Microsoft logout metadata.'
          }
          if ($layout -notmatch "authenticated-base\.css" -or $layout -match "navigate\('/login'") {
            throw 'Merged AppLayout.tsx does not preserve lazy authenticated CSS or provider-owned logout navigation.'
          }
          if ($entra -notmatch 'logout_hint' -or $entra -notmatch 'post_logout_redirect_uri') {
            throw 'Merged Entra logout request is incomplete.'
          }
          if ($deployment -notmatch "signInAudience = 'AzureADMyOrg'" -or $deployment -notmatch "name = 'login_hint'") {
            throw 'Merged Entra registration configuration is incomplete.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Generate API client
        working-directory: src/FE
        run: npm run generate:api:prod

      - name: Ensure generated client is current
        run: git diff --exit-code -- src/FE/src/api/generated

      - name: Lint changed frontend files
        working-directory: src/FE
        run: >-
          npx eslint
          src/components/ErrorState.tsx
          src/components/layouts/AppLayout.tsx
          src/features/auth/api/entraInviteEnrollment.ts
          src/features/auth/api/entraLogin.ts
          src/features/auth/api/entraOidc.ts
          src/features/auth/routes/InviteAccept.tsx
          src/features/auth/routes/Login.tsx
          src/providers/AuthContext.tsx
          src/providers/ErrorFallback.tsx
          src/providers/authContextValue.ts
          src/routes/index.tsx

      - name: Build frontend
        working-directory: src/FE
        run: npm run build

      - name: Validate merge diff
        run: git diff --check origin/main...HEAD

      - name: Remove temporary workflow and push validated merge
        run: |
          git rm .github/workflows/wor-199-sync-main.yml
          git commit --amend --no-edit
          git push origin HEAD:rbj--199-microsoft-full-logout
