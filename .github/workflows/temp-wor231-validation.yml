name: TEMP WOR-231 combined job filter validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FE/src/components/filters/StatusFilter.tsx'
      - 'src/FE/src/components/filters/StatusFilter.test.tsx'
      - 'src/FE/src/features/jobs/jobListStatusFilters.ts'
      - 'src/FE/src/features/jobs/jobListStatusFilters.test.ts'
      - 'src/FE/src/features/jobs/routes/JobList.tsx'
      - 'src/FE/wor-231.validation.spec.ts'
      - '.github/workflows/temp-wor231-validation.yml'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net

jobs:
  validate:
    name: Frontend build and combined job filter browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate frontend API client
        run: |
          set -Eeuo pipefail
          ready=false
          for attempt in $(seq 1 24); do
            if curl --fail --silent --output /dev/null "${OPENAPI_BASE_URL}/openapi/v1.json"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "${ready}" != "true" ]]; then
            echo "::error::Production OpenAPI endpoint did not become ready."
            exit 1
          fi
          npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Lint affected frontend files
        run: >-
          npx eslint
          src/components/filters/StatusFilter.tsx
          src/components/filters/StatusFilter.test.tsx
          src/features/jobs/jobListStatusFilters.ts
          src/features/jobs/jobListStatusFilters.test.ts
          src/features/jobs/routes/JobList.tsx

      - name: Run focused regression tests
        run: >-
          npm test -- --run
          src/components/filters/StatusFilter.test.tsx
          src/features/jobs/jobListStatusFilters.test.ts

      - name: Build production frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4173

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser validation
        run: |
          set -Eeuo pipefail

          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/wor-231-preview.log 2>&1 &
          preview_pid=$!

          cleanup() {
            kill "${preview_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/app; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "${ready}" != "true" ]]; then
            cat /tmp/wor-231-preview.log || true
            echo "::error::Frontend preview did not become ready."
            exit 1
          fi

          npx playwright test wor-231.validation.spec.ts --reporter=line --workers=1
