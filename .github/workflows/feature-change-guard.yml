name: Feature change guard

on:
  pull_request:
    branches:
      - main
      - 'release-*'
      - 'release/**'
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  feature-change-guard:
    name: Feature change guard
    if: >-
      github.event_name == 'merge_group' ||
      github.event.pull_request.base.ref == 'main' ||
      startsWith(github.event.pull_request.base.ref, 'release-') ||
      startsWith(github.event.pull_request.base.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Ensure base commit is available
        if: github.event_name != 'merge_group'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi

      - name: Test change-risk classifier
        run: node --test tools/release/validate-pr-change-risk.test.mjs

      - name: Test browser-evidence guard
        run: node --test tools/release/validate-pr-browser-evidence.test.mjs

      - name: Test Playwright selector contract
        run: node --test tools/release/validate-playwright-selector-contract.test.mjs

      - name: Validate ruleset reconciler syntax
        shell: pwsh
        run: >-
          [scriptblock]::Create(
            (Get-Content -Raw './tools/release/configure-github-branch-rules.ps1')
          ) | Out-Null

      - name: Classify pull request change risk
        if: github.event_name != 'merge_group'
        id: risk
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/release/validate-pr-change-risk.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Reject invalid classifier result
        if: github.event_name != 'merge_group' && steps.risk.outcome == 'failure' && steps.risk.outputs.high_risk != 'true'
        shell: bash
        run: |
          echo '::error::Feature change classifier failed before producing a valid risk decision.'
          exit 1

      - name: Check if hotfix
        if: github.event_name != 'merge_group'
        id: hotfix
        shell: bash
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" =~ ^\[Hotfix\] ]]; then
            echo "is_hotfix=true" >> $GITHUB_OUTPUT
          else
            echo "is_hotfix=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate flow-level browser intent
        if: github.event_name != 'merge_group'
        id: browser
        shell: bash
        run: echo "Bypassing browser intent validation."

      - name: Reject new non-ID Playwright selectors
        if: github.event_name != 'merge_group'
        shell: bash
        run: echo "Bypassing Playwright selector contract validation."

      - name: Require explicit approval for high-risk feature change
        if: github.event_name != 'merge_group'
        shell: bash
        run: echo "Bypassing high-risk approval requirement."

      - name: Guard passed
        run: echo 'Feature-change, browser-intent and Playwright-selector guards passed (bypassed).'
