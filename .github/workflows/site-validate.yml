name: Validate Jekyll site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-validate.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site
      - name: Compile output validator
        run: python -m py_compile site/scripts/validate_output.py
      - name: Build site with strict front matter
        working-directory: site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Validate generated site
        run: python site/scripts/validate_output.py site/_site
      - name: Upload generated dependency lock
        uses: actions/upload-artifact@v7
        with:
          name: site-gemfile-lock
          path: site/Gemfile.lock
          if-no-files-found: error
          retention-days: 1
