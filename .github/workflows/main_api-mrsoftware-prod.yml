name: Backend API deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Validated release/** branch'
        required: true
        type: string
      release_sha:
        description: 'Exact validated commit SHA'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  API_PROJECT: src/BE/WorkslipApi/Workslip.Api.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish/api
  DEPLOY_PACKAGE: ${{ github.workspace }}/publish/workslip-api.zip
  AZURE_WEBAPP_NAME: api-mrsoftware-prod
  AZURE_RESOURCE_GROUP: rg-mrsoftware-prod
  RELEASE_REF: ${{ inputs.release_ref }}
  RELEASE_SHA: ${{ inputs.release_sha }}

permissions:
  actions: read
  contents: read

concurrency:
  group: azure-api-prod
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require dispatch from main
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF_NAME}" != 'main' ]]; then
            echo "::error::Production deployment workflow must be dispatched from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Validate release inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "${RELEASE_REF}" =~ ^release/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::release_ref must name a release/** branch."
            exit 1
          fi

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::release_sha must be a full 40-character commit SHA."
            exit 1
          fi

      - name: Checkout deployment workflow baseline
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release branch points to exact SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(
            git ls-remote --heads origin "refs/heads/${RELEASE_REF}" |
              awk 'NR == 1 { print $1 }'
          )"

          if [[ -z "${remote_sha}" ]]; then
            echo "::error::Release branch ${RELEASE_REF} does not exist."
            exit 1
          fi

          if [[ "${remote_sha,,}" != "${RELEASE_SHA,,}" ]]; then
            echo "::error::Release branch ${RELEASE_REF} currently points to ${remote_sha}, not ${RELEASE_SHA}."
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/${RELEASE_REF}:refs/remotes/origin/${RELEASE_REF}"

          if ! git merge-base --is-ancestor "${RELEASE_SHA}" HEAD; then
            echo "::error::Release candidate ${RELEASE_SHA} is not contained in current main."
            exit 1
          fi

          echo "Release candidate identity verified: ${RELEASE_REF} @ ${RELEASE_SHA}."

      - name: Require successful Release validation for exact SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          curl --fail-with-body --silent --show-error --location --get \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            --data-urlencode "branch=${RELEASE_REF}" \
            --data-urlencode 'event=push' \
            --data-urlencode "head_sha=${RELEASE_SHA}" \
            --data-urlencode 'status=success' \
            --data-urlencode 'per_page=10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-validation.yml/runs" \
            --output "${response_file}"

          matching_runs="$(
            jq \
              --arg sha "${RELEASE_SHA}" \
              --arg branch "${RELEASE_REF}" \
              '[.workflow_runs[] |
                select(
                  (.head_sha | ascii_downcase) == ($sha | ascii_downcase)
                  and .head_branch == $branch
                  and .event == "push"
                  and .status == "completed"
                  and .conclusion == "success"
                )
              ]' \
              "${response_file}"
          )"

          if [[ "$(jq 'length' <<<"${matching_runs}")" -lt 1 ]]; then
            echo "::error::No successful Release validation run exists for ${RELEASE_REF} @ ${RELEASE_SHA}."
            exit 1
          fi

          validation_url="$(jq -r '.[0].html_url' <<<"${matching_runs}")"
          echo "Release validation verified: ${validation_url}"

  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: verify-release
    outputs:
      release_phase: ${{ steps.release-target.outputs.phase }}
      release_testing_enabled: ${{ steps.release-target.outputs.enable_development_endpoints }}

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - name: Confirm checked out SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${RELEASE_SHA,,}" ]]; then
            echo "::error::Checkout resolved to ${actual_sha}, expected ${RELEASE_SHA}."
            exit 1
          fi
          echo "Building ${RELEASE_REF} @ ${RELEASE_SHA}."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve production release policy
        id: release-target
        run: >-
          node tools/release/resolve-release-environment.mjs
          --environment production
          --require-runnable
          --github-output

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }} --nologo

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore --nologo

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}" --nologo

      - name: Create deployment package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${DEPLOY_PACKAGE}"
          (
            cd "${PUBLISH_DIR}"
            zip -q -r "${DEPLOY_PACKAGE}" .
          )
          unzip -Z1 "${DEPLOY_PACKAGE}" | grep -qx 'Workslip.Api.dll'
          package_bytes="$(stat -c '%s' "${DEPLOY_PACKAGE}")"
          echo "Deployment package size: ${package_bytes} bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: workslip-api-${{ inputs.release_sha }}
          path: ${{ env.DEPLOY_PACKAGE }}
          if-no-files-found: error

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Record release candidate
        shell: bash
        run: |
          echo "Deploying ${RELEASE_REF} @ ${RELEASE_SHA} to ${AZURE_WEBAPP_NAME}."

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: workslip-api-${{ inputs.release_sha }}
          path: ${{ github.workspace }}/publish

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify diagnostics infrastructure prerequisite
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace_id="$(az webapp config appsettings list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --query "[?name=='Azure__ApplicationInsights__WorkspaceId'].value | [0]" \
            --output tsv)"

          if [[ -z "${workspace_id}" || "${workspace_id}" == "null" ]]; then
            echo "::error::The API is missing Azure__ApplicationInsights__WorkspaceId. Run the 'Production infrastructure deploy' workflow from main, then rerun this API deployment."
            echo "::error::Backend deployment is blocked so diagnostics code cannot be released without its required Azure configuration."
            exit 1
          fi

          if [[ ! "${workspace_id}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Azure__ApplicationInsights__WorkspaceId is present but is not a valid workspace GUID. Reconcile production infrastructure before deploying the API."
            exit 1
          fi

          echo "Application Insights workspace configuration is present."

      - name: Apply release-testing safety mode
        shell: bash
        env:
          RELEASE_PHASE: ${{ needs.build.outputs.release_phase }}
          RELEASE_TESTING_ENABLED: ${{ needs.build.outputs.release_testing_enabled }}
        run: |
          set -Eeuo pipefail

          if [[ "${RELEASE_TESTING_ENABLED}" != 'true' && "${RELEASE_TESTING_ENABLED}" != 'false' ]]; then
            echo "::error::Resolved release-testing state is invalid: ${RELEASE_TESTING_ENABLED}"
            exit 1
          fi

          echo "Applying release phase ${RELEASE_PHASE}; ReleaseTesting__Enabled=${RELEASE_TESTING_ENABLED}."
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --settings "ReleaseTesting__Enabled=${RELEASE_TESTING_ENABLED}" \
            --output none

      - name: Inspect deployment target
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          state="$(az webapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --query state \
            --output tsv)"
          host="$(az webapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --query defaultHostName \
            --output tsv)"

          if [[ -z "${host}" || "${host}" == "null" ]]; then
            echo "::error::Azure did not return a default hostname for ${AZURE_WEBAPP_NAME}."
            exit 1
          fi

          echo "App Service state before deployment: ${state}"
          echo "App Service host: ${host}"
          echo "health_url=https://${host}/health" >> "${GITHUB_OUTPUT}"

      - name: Deploy package with bounded retry
        shell: bash
        run: |
          set -Eeuo pipefail
          max_attempts=3
          deployment_log="$(mktemp)"
          trap 'rm -f "${deployment_log}"' EXIT

          for attempt in $(seq 1 "${max_attempts}"); do
            echo "App Service deployment attempt ${attempt}/${max_attempts}"
            : > "${deployment_log}"

            if az webapp deploy \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${AZURE_WEBAPP_NAME}" \
              --src-path "${DEPLOY_PACKAGE}" \
              --type zip \
              --clean true \
              --restart true \
              --enable-kudu-warmup true \
              --enriched-errors true \
              --track-status false \
              --timeout 600000 2>&1 | tee "${deployment_log}"; then
              exit 0
            fi

            disk_full=false
            if grep -Fqi 'There is not enough space on the disk' "${deployment_log}"; then
              disk_full=true
              echo "::warning::Kudu reported a full local deployment disk."
            fi

            if [[ "${attempt}" -lt "${max_attempts}" ]]; then
              if [[ "${disk_full}" == "true" ]]; then
                echo "Recycling ${AZURE_WEBAPP_NAME} to clear its temporary local storage before retrying."
                az webapp restart \
                  --resource-group "${AZURE_RESOURCE_GROUP}" \
                  --name "${AZURE_WEBAPP_NAME}" \
                  --output none
                delay_seconds=30
              else
                delay_seconds=$((attempt * 30))
              fi

              echo "::warning::App Service deployment attempt ${attempt} failed. Retrying in ${delay_seconds} seconds."
              sleep "${delay_seconds}"
            fi
          done

          echo "::error::App Service deployment failed after ${max_attempts} attempts."
          echo "Safe App Service state:"
          az webapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --query '{name:name,state:state,enabled:enabled,availabilityState:availabilityState,defaultHostName:defaultHostName,lastModifiedTimeUtc:lastModifiedTimeUtc}' \
            --output jsonc || true

          echo "Recent deployment records:"
          az webapp log deployment list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --query '[0:5]' \
            --output jsonc || true

          echo "Latest deployment log:"
          az webapp log deployment show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --output jsonc || true

          exit 1

      - name: Verify API health
        shell: bash
        env:
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
        run: |
          set -Eeuo pipefail
          max_attempts=15

          for attempt in $(seq 1 "${max_attempts}"); do
            if curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 10 \
              --output /dev/null \
              "${HEALTH_URL}"; then
              echo "API health check passed: ${HEALTH_URL}"
              echo "Deployed release candidate ${RELEASE_REF} @ ${RELEASE_SHA}."
              exit 0
            fi

            if [[ "${attempt}" -lt "${max_attempts}" ]]; then
              echo "Health check attempt ${attempt}/${max_attempts} failed; retrying in 10 seconds."
              sleep 10
            fi
          done

          echo "::error::API deployment completed, but ${HEALTH_URL} did not become healthy."
          az webapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --query '{name:name,state:state,enabled:enabled,availabilityState:availabilityState,defaultHostName:defaultHostName,lastModifiedTimeUtc:lastModifiedTimeUtc}' \
            --output jsonc || true
          exit 1
