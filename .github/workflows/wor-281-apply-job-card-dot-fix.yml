name: WOR-281 apply job-card dot color correction

on:
  push:
    branches:
      - rbj--281-job-card-status-dot-colors

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--281-job-card-status-dot-colors
          fetch-depth: 0

      - name: Remove only lifecycle dot theme overrides
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/FE/src/farvelab-theme.css')
          text = path.read_text(encoding='utf-8')
          removals = [
              'body:has(.app-shell) .review-dot { background: var(--warning); }\n',
              'body:has(.app-shell) .approved-dot { background: var(--success); }\n',
              'body:has(.app-shell) .rejected-dot { background: var(--danger); }\n',
          ]
          for line in removals:
              if text.count(line) != 1:
                  raise SystemExit(f'Expected exactly one lifecycle override: {line.strip()}')
              text = text.replace(line, '')
          required = 'body:has(.app-shell) :is(.unread-dot, .unassigned-dot) { background: var(--accent-cyan); }\n'
          if required not in text:
              raise SystemExit('Unread/unassigned dot override must remain unchanged.')
          path.write_text(text, encoding='utf-8')

          app_css = Path('src/FE/src/App.css').read_text(encoding='utf-8')
          expected = {
              '.review-dot': '#eab308',
              '.approved-dot': '#22c55e',
              '.rejected-dot': '#ef4444',
          }
          for selector, color in expected.items():
              start = app_css.find(selector)
              if start < 0 or color not in app_css[start:start + 260]:
                  raise SystemExit(f'Legacy color contract missing for {selector}: {color}')

      - name: Remove temporary implementation workflow
        run: git rm .github/workflows/wor-281-apply-job-card-dot-fix.yml

      - name: Commit product-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'workslip-validation-bot'
          git config user.email 'workslip-validation-bot@users.noreply.github.com'
          git add src/FE/src/farvelab-theme.css
          git diff --cached --check
          git commit -m 'RBJ-281: restore legacy job-card status dot colors'
          git push origin HEAD:rbj--281-job-card-status-dot-colors
