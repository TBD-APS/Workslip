name: WOR-199 promptless Microsoft logout validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wor-199-promptless-logout.yml
      - src/FE/.wor-199-promptless-logout.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: rbj--199-microsoft-full-logout
          fetch-depth: 0

      - name: Apply promptless logout changes
        run: python3 src/FE/.wor-199-promptless-logout.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'src/BE/infrastructure/deploy-entra.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Generate API client
        working-directory: src/FE
        env:
          VITE_API_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net
        run: npm run generate:api:prod

      - name: Validate changed lint-clean frontend files
        working-directory: src/FE
        run: >-
          npx eslint
          src/features/auth/api/entraOidc.ts
          src/features/auth/api/entraLogin.ts
          src/features/auth/api/entraInviteEnrollment.ts
          src/providers/AuthContext.tsx
          src/providers/authContextValue.ts

      - name: Build frontend
        working-directory: src/FE
        run: npm run build

      - name: Validate diff
        run: |
          git diff --check
          test -f src/FE/src/features/auth/api/entraOidc.ts
          grep -q "logout_hint" src/FE/src/features/auth/api/entraLogin.ts
          grep -q "name = 'login_hint'" src/BE/infrastructure/deploy-entra.ps1

      - name: Commit validated implementation and remove temporary files
        run: |
          rm .github/workflows/wor-199-promptless-logout.yml
          rm src/FE/.wor-199-promptless-logout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WOR-199: skip Microsoft logout account picker"
          git push origin HEAD:rbj--199-microsoft-full-logout
