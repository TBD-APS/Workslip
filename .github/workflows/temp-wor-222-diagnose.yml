name: TEMP — Validate WOR-222 NuGet security updates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore without vulnerability or pruning warnings
        shell: bash
        run: |
          set -o pipefail
          dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj 2>&1 | tee restore.log
          if grep -Eq 'NU1903|NU1510' restore.log; then
            echo 'A vulnerability or unnecessary-package warning remains after package updates.'
            exit 1
          fi

      - name: Verify vulnerable package list is empty
        shell: bash
        run: |
          set -o pipefail
          dotnet package list --project src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.log
          grep -q 'has no vulnerable packages' vulnerable-packages.log
          if grep -Eq 'SQLitePCLRaw\.lib\.e_sqlite3[[:space:]]+2\.1\.11|System\.Security\.Cryptography\.Xml[[:space:]]+10\.0\.7' vulnerable-packages.log; then
            echo 'A known vulnerable package version remains in the restored graph.'
            exit 1
          fi

      - name: Verify resolved dependency versions
        shell: bash
        run: |
          set -o pipefail
          dotnet nuget why src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj SQLitePCLRaw.lib.e_sqlite3 --framework net10.0 | tee sqlite-dependency.log
          dotnet nuget why src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj System.Security.Cryptography.Xml --framework net10.0 | tee xml-dependency.log
          grep -q 'SQLitePCLRaw.lib.e_sqlite3 (v2.1.12)' sqlite-dependency.log
          if ! grep -Eq 'System.Security.Cryptography.Xml \(v10\.0\.10\)|does not have a dependency on' xml-dependency.log; then
            echo 'System.Security.Cryptography.Xml is neither patched nor absent from the graph.'
            exit 1
          fi

      - name: Build backend tests in Release
        run: dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-restore

      - name: Run backend and relational tests
        run: dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-build
