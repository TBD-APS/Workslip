name: WOR-474 dependency map refresh

on:
  push:
    branches:
      - rbj--474-fix-assignment-repository-coupling

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate dependency map
        run: node tools/depmap/depmap.mjs
      - name: Remove temporary workflow
        run: rm .github/workflows/wor474-depmap-refresh.yml
      - name: Commit generated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/architecture/dependency-map.md tools/depmap/last-run.json .github/workflows/wor474-depmap-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'RBJ-474: refresh dependency map after repository cleanup'
          git push origin HEAD:rbj--474-fix-assignment-repository-coupling
