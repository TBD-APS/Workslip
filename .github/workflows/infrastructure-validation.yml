name: Infrastructure Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BE/infrastructure/**'
      - '.github/workflows/infrastructure-validation.yml'

permissions:
  contents: read

concurrency:
  group: infrastructure-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build Bicep and validate scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Bicep
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az bicep install
            az bicep build --file src/BE/infrastructure/main.bicep --stdout > /tmp/workslip-main.json

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src/BE/infrastructure -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Guard Azure SQL security invariants
        shell: bash
        run: |
          set -euo pipefail

          if rg -n -i \
            'administratorLogin|administratorLoginPassword|AllowAzureServices|AllowDeveloperIP|0\.0\.0\.0|Password=' \
            src/BE/infrastructure/*.bicep; then
            echo "Azure SQL password authentication or broad firewall access was reintroduced." >&2
            exit 1
          fi

          rg -n 'azureADOnlyAuthentication: true' src/BE/infrastructure/main.bicep
          rg -n 'Authentication=Active Directory Managed Identity' src/BE/infrastructure/main.bicep
          rg -n 'possibleOutboundIpAddresses' src/BE/infrastructure/main.bicep
