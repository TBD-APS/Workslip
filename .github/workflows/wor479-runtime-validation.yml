name: WOR-479 · Temporary API integration validation

on:
  push:
    branches:
      - rbj--479-auditor-visibility

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'

jobs:
  postman:
    name: Auditor scope API + SQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate focused collection and runner syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n src/BE/WorkslipApi/Postman/run-hosted-integration.sh
          node -e "JSON.parse(require('node:fs').readFileSync('src/BE/WorkslipApi/Postman/auditor_scope.postman_collection.json', 'utf8'));"

      - name: Run isolated hosted integration suite
        shell: bash
        run: bash src/BE/WorkslipApi/Postman/run-hosted-integration.sh

      - name: Upload backend diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: wor479-postman-backend-${{ github.run_id }}
          path: ${{ runner.temp }}/workslip-postman-backend.log
          if-no-files-found: warn
          retention-days: 1
