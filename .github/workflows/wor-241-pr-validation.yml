name: TEMP — WOR-241 pull request implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: rbj--241-red-dot-follows-status
          fetch-depth: 0

      - name: Apply status-driven rejection indicator
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}, found {count}: {old!r}')
              file_path.write_text(content.replace(old, new, 1), encoding='utf-8')

          job_repository = 'src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfJobRepository.cs'
          replace_once(job_repository, '        HashSet<Guid> rejectedSeenJobIds = [];\n', '')
          replace_once(
              job_repository,
              '''
            var rejectedViewed = await _jobViewRepo.GetViewedJobIdsAsync(
                query.CurrentUserId.Value, reportIds, ["RejectedAssignment"], cancellationToken);
            rejectedSeenJobIds = new HashSet<Guid>(rejectedViewed);
''',
              '',
          )
          replace_once(
              job_repository,
              '''                && isAssignedToCurrentUser
                && !rejectedSeenJobIds.Contains(x.Id);''',
              '''                && isAssignedToCurrentUser;''',
          )

          assignment_repository = 'src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfAssignmentRepository.cs'
          replace_once(
              assignment_repository,
              '''
        var rejectedSeenJobIds = await _jobViewRepo.GetViewedJobIdsAsync(userId, reportIds, ["RejectedAssignment"], cancellationToken);
        var rejectedSeenSet = new HashSet<Guid>(rejectedSeenJobIds);
''',
              '',
          )
          replace_once(
              assignment_repository,
              '            var isNewRejection = status == JobStatus.Rejected && !rejectedSeenSet.Contains(x.Id);',
              '            var isNewRejection = status == JobStatus.Rejected;',
          )

          replace_once(
              'src/FE/src/features/jobs/routes/JobDetail.tsx',
              '''    if (jobStatus === JobStatus.Rejected) {
      markJobAsSeen(id, queryClient, 'RejectedAssignment');
    }
''',
              '',
          )

          replace_once(
              'src/FE/src/features/jobs/routes/CompletedJobReport.tsx',
              '''  useEffect(() => {
    if (!id || (isAdmin && job?.status === JobStatus.Rejected)) return;
    markJobAsSeen(id, queryClient);
    if (job?.status === JobStatus.Rejected) {
      markJobAsSeen(id, queryClient, 'RejectedAssignment');
    }
  }, [id, job?.status, isAdmin, queryClient]);
''',
              '''  useEffect(() => {
    if (!id) return;
    markJobAsSeen(id, queryClient);
  }, [id, queryClient]);
''',
          )

          replace_once(
              'src/FE/src/features/jobs/routes/JobDetail.test.tsx',
              '''    expect(mocks.markJobAsSeen).toHaveBeenCalledWith('job-1', queryClient);
    expect(mocks.markJobAsSeen).toHaveBeenCalledWith('job-1', queryClient, 'RejectedAssignment');
''',
              '''    expect(mocks.markJobAsSeen).toHaveBeenCalledOnce();
    expect(mocks.markJobAsSeen).toHaveBeenCalledWith('job-1', queryClient);
''',
          )

          completed_test = 'src/FE/src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx'
          replace_once(
              completed_test,
              '''  it('does not clear a rejected assignment indicator when an admin opens the report', async () => {
    renderReport();

    await waitFor(() => {
      expect(mocks.markJobAsSeen).not.toHaveBeenCalled();
    });
  });
''',
              '''  it('marks a rejected report as normally seen when an admin opens it', async () => {
    renderReport();

    await waitFor(() => {
      expect(mocks.markJobAsSeen).toHaveBeenCalledOnce();
    });
    expect(mocks.markJobAsSeen).toHaveBeenCalledWith('job-1', expect.any(QueryClient));
  });
''',
          )
          replace_once(
              completed_test,
              '''  it('marks a rejected assignment as seen for an ordinary user', async () => {
    mocks.isAdmin = false;
    renderReport();

    await waitFor(() => {
      expect(mocks.markJobAsSeen).toHaveBeenCalledTimes(2);
    });
    expect(mocks.markJobAsSeen).toHaveBeenNthCalledWith(1, 'job-1', expect.any(QueryClient));
    expect(mocks.markJobAsSeen).toHaveBeenNthCalledWith(
      2,
      'job-1',
      expect.any(QueryClient),
      'RejectedAssignment',
    );
  });
''',
              '''  it('marks a rejected report as normally seen for an ordinary user', async () => {
    mocks.isAdmin = false;
    renderReport();

    await waitFor(() => {
      expect(mocks.markJobAsSeen).toHaveBeenCalledOnce();
    });
    expect(mocks.markJobAsSeen).toHaveBeenCalledWith('job-1', expect.any(QueryClient));
  });
''',
          )
          PY

          if grep -R "RejectedAssignment" \
            src/FE/src/features/jobs/routes/JobDetail.tsx \
            src/FE/src/features/jobs/routes/CompletedJobReport.tsx \
            src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfJobRepository.cs \
            src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfAssignmentRepository.cs; then
            echo "::error::Rejected indicators must not depend on rejected seen-state."
            exit 1
          fi
          git diff --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        working-directory: src/BE/WorkslipApi
        run: dotnet restore Workslip.slnx --nologo

      - name: Build backend
        working-directory: src/BE/WorkslipApi
        run: dotnet build Workslip.slnx --configuration Release --no-restore --nologo

      - name: Test backend
        working-directory: src/BE/WorkslipApi
        run: dotnet test Workslip.slnx --configuration Release --no-build --nologo

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Lint affected frontend files
        working-directory: src/FE
        run: >-
          npx eslint
          src/features/jobs/routes/JobDetail.tsx
          src/features/jobs/routes/JobDetail.test.tsx
          src/features/jobs/routes/CompletedJobReport.tsx
          src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx

      - name: Test seen-state routes
        working-directory: src/FE
        run: >-
          npm test -- --run
          src/features/jobs/routes/JobDetail.test.tsx
          src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx

      - name: Build frontend
        working-directory: src/FE
        run: npm run build

      - name: Commit validated implementation and remove temporary workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/wor-241-status-dot.yml
          rm .github/workflows/wor-241-pr-validation.yml
          git config user.name "Workslip Validation Bot"
          git config user.email "workslip-validation@users.noreply.github.com"
          git add -A
          git commit -m "fix(WOR-241): keep rejected indicator until status changes"
          git push origin HEAD:rbj--241-red-dot-follows-status