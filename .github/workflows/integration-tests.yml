name: Workslip Integration Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Non-production Workslip API base URL. Overrides WORKSLIP_INTEGRATION_BASE_URL secret when set.'
        required: false
        type: string

jobs:
  postman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Postman integration tests
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          SECRET_BASE_URL: ${{ secrets.WORKSLIP_INTEGRATION_BASE_URL }}
          WORKSLIP_AUTH_TOKEN: ${{ secrets.WORKSLIP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          base_url="$INPUT_BASE_URL"
          if [ -z "$base_url" ]; then
            base_url="$SECRET_BASE_URL"
          fi
          if [ -z "$base_url" ]; then
            echo "::error::Set workflow input base_url or repository secret WORKSLIP_INTEGRATION_BASE_URL."
            exit 64
          fi
          src/BE/WorkslipApi/Postman/run-integration-tests.sh "$base_url"
