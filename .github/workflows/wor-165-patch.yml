name: WOR-165 one-time branch patch

on:
  push:
    branches:
      - rbj--wor-165-fix-timer-dark-mode
    paths:
      - .github/workflows/wor-165-patch.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wor-165-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'rbj--wor-165-fix-timer-dark-mode' || github.ref_name == 'rbj--wor-165-fix-timer-dark-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--wor-165-fix-timer-dark-mode
          fetch-depth: 0

      - name: Remove forced Timer theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_css = Path('src/FE/src/App.css')
          data = app_css.read_bytes()
          bom = b'\xef\xbb\xbf' if data.startswith(b'\xef\xbb\xbf') else b''
          text = data[len(bom):].decode('utf-8')

          selector = '.time-overview-page--admin {'
          selector_start = text.find(selector)
          if selector_start < 0:
              raise SystemExit('Expected admin Timer selector was not found')

          block_end = text.find('\n}\n', selector_start)
          if block_end < 0:
              raise SystemExit('Admin Timer selector block was not terminated')
          block_end += len('\n}\n')

          removal_start = selector_start
          comment_start = text.rfind('/*', 0, selector_start)
          comment_end = text.find('*/', comment_start, selector_start) if comment_start >= 0 else -1
          if comment_start >= 0 and comment_end >= 0 and 'Admin Timer' in text[comment_start:selector_start]:
              removal_start = comment_start

          while block_end < len(text) and text[block_end] == '\n':
              block_end += 1

          app_css.write_bytes(bom + (text[:removal_start] + text[block_end:]).encode('utf-8'))

          temporary_stylesheet = Path('src/FE/src/features/worksheets/timerTheme.css')
          if temporary_stylesheet.exists():
              temporary_stylesheet.unlink()

          Path('.github/workflows/wor-165-patch.yml').unlink()
          PY

      - name: Verify focused change
        shell: bash
        run: |
          if grep -qF ".time-overview-page--admin {" src/FE/src/App.css; then
            echo "Forced admin Timer theme block still exists" >&2
            exit 1
          fi
          if grep -qF "timerTheme.css" src/FE/src/App.tsx; then
            echo "App.tsx still imports timerTheme.css" >&2
            exit 1
          fi
          test ! -e src/FE/src/features/worksheets/timerTheme.css

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Build frontend and capture result
        shell: bash
        run: |
          set +e
          cd src/FE
          npm ci > /tmp/wor-165-npm-ci.log 2>&1
          install_status=$?

          build_status=not_run
          if [ "$install_status" -eq 0 ]; then
            npm run build > /tmp/wor-165-build.log 2>&1
            build_status=$?
          fi

          cd ../..
          {
            echo "npm_ci_status=$install_status"
            echo "build_status=$build_status"
            echo
            echo "--- npm ci (last 80 lines) ---"
            tail -n 80 /tmp/wor-165-npm-ci.log
            if [ -f /tmp/wor-165-build.log ]; then
              echo
              echo "--- npm run build (last 160 lines) ---"
              tail -n 160 /tmp/wor-165-build.log
            fi
          } > .wor-165-build-result.txt

      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WOR-165: inherit active theme in timer overview"
          git push origin HEAD:rbj--wor-165-fix-timer-dark-mode
