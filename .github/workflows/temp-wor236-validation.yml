name: TEMP WOR-236 validate desktop report date

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FE/src/features/jobs/routes/JobList.tsx'
      - 'src/FE/src/features/jobs/routes/jobListReportDate.ts'
      - 'src/FE/src/features/jobs/routes/JobList.reportDate.test.ts'
      - '.github/workflows/temp-wor236-validation.yml'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate frontend API client
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Align legacy generated-model fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixture_paths = [
              Path('src/components/layouts/AppLayout.desktopOnly.test.tsx'),
              Path('src/features/superadmin/components/DesktopOnlySuperadmin.test.tsx'),
          ]
          needle = "  role: 'Superadmin',\n"
          replacement = needle + "  roleDisplayName: 'Superadmin',\n"

          for fixture_path in fixture_paths:
              content = fixture_path.read_text(encoding='utf-8')
              if 'roleDisplayName:' in content:
                  continue
              if needle not in content:
                  raise SystemExit(f'Expected Superadmin fixture not found in {fixture_path}')
              fixture_path.write_text(content.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Lint affected files
        run: npx eslint src/features/jobs/routes/JobList.tsx src/features/jobs/routes/jobListReportDate.ts src/features/jobs/routes/JobList.reportDate.test.ts

      - name: Run focused regression test
        run: npm test -- --run src/features/jobs/routes/JobList.reportDate.test.ts

      - name: Build production frontend
        run: npm run build
