name: Documentation Quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'Docs/**'
      - 'tools/docs/**'
      - 'src/BE/WorkslipApi/**'
      - 'src/FE/**'
      - '.github/workflows/**'
      - '.github/pull_request_template.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'Docs/**'
      - 'tools/docs/**'
      - 'src/BE/WorkslipApi/**'
      - 'src/FE/**'
      - '.github/workflows/**'
      - '.github/pull_request_template.md'

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile validators
        run: python -m py_compile tools/docs/check_docs.py tools/docs/check_pr_docs_impact.py

      - name: Check Markdown and internal links
        id: docs
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/docs/check_docs.py 2>&1 | tee docs-validation.log

      - name: Upload documentation validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-validation-log
          path: docs-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail on documentation errors
        if: steps.docs.outcome == 'failure'
        run: exit 1

      - name: Check PR documentation decision
        if: github.event_name == 'pull_request'
        run: python tools/docs/check_pr_docs_impact.py
