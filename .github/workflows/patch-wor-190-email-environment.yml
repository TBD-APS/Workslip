name: Diagnose WOR-190 environment-safe ACS deployment

on:
  push:
    branches:
      - rbj--190-infrastructure-deployment-hardening
    paths:
      - .github/workflows/patch-wor-190-email-environment.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--190-infrastructure-deployment-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Apply patch and capture Bicep output
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/BE/infrastructure/main.bicep')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, "var sqlAdminGroupMailNickname = take(replace(sqlAdminGroupName, '-', ''), 64)\n", "var sqlAdminGroupMailNickname = take(replace(sqlAdminGroupName, '-', ''), 64)\nvar useCustomEmailDomain = toLower(environment) == 'prod'\n", 'selector')
          text = replace_once(text, "    acsSenderAddress: '${customEmailSenderUsername}@${customEmailDomainName}'\n", "    acsSenderAddress: useCustomEmailDomain\n      ? '${customEmailSenderUsername}@${customEmailDomainName}'\n      : '${azureManagedSenderUsername.properties.username}@${azureManagedEmailDomain.properties.mailFromSenderDomain}'\n", 'sender config')
          text = replace_once(text, """    linkedDomains: [
      azureManagedEmailDomain.id
      customEmailDomain.id
    ]
""", """    linkedDomains: useCustomEmailDomain
      ? [
          azureManagedEmailDomain.id
          customEmailDomain.id
        ]
      : [
          azureManagedEmailDomain.id
        ]
""", 'linked domains')
          text = replace_once(text, """// Production DNS verification is complete. The custom domain and sender are
// unconditional parts of every infrastructure deployment.
resource customEmailDomain 'Microsoft.Communication/emailServices/domains@2023-04-01' = {
""", """// Production DNS verification is complete. Production always provisions the
// custom domain; non-production environments use the Azure-managed sender.
resource customEmailDomain 'Microsoft.Communication/emailServices/domains@2023-04-01' = if (useCustomEmailDomain) {
""", 'domain condition')
          text = replace_once(text, "resource customEmailSender 'Microsoft.Communication/emailServices/domains/senderUsernames@2023-04-01' = {\n", "resource customEmailSender 'Microsoft.Communication/emailServices/domains/senderUsernames@2023-04-01' = if (useCustomEmailDomain) {\n", 'sender condition')
          text = replace_once(text, """output ACS_CUSTOM_EMAIL_DOMAIN_ID string        = customEmailDomain.id
output ACS_CUSTOM_EMAIL_DOMAIN_ACTIVE bool      = true
output ACS_SENDER_ADDRESS string                = '${customEmailSenderUsername}@${customEmailDomainName}'
""", """output ACS_CUSTOM_EMAIL_DOMAIN_ID string        = useCustomEmailDomain ? customEmailDomain.id : ''
output ACS_CUSTOM_EMAIL_DOMAIN_ACTIVE bool      = useCustomEmailDomain
output ACS_SENDER_ADDRESS string                = useCustomEmailDomain
  ? '${customEmailSenderUsername}@${customEmailDomainName}'
  : '${azureManagedSenderUsername.properties.username}@${azureManagedEmailDomain.properties.mailFromSenderDomain}'
""", 'outputs')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          set +e
          az bicep build --file src/BE/infrastructure/main.bicep > bicep-validation.log 2>&1
          status=$?
          set -e
          {
            echo "exit_code=$status"
            echo
            cat bicep-validation.log
          } > .github/WOR-190-bicep-validation.txt

      - name: Publish diagnostic and patched Bicep
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-wor-190-email-environment.yml
          git add src/BE/infrastructure/main.bicep .github/WOR-190-bicep-validation.txt
          git commit -m "RBJ-190 capture ACS Bicep validation"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:rbj--190-infrastructure-deployment-hardening
