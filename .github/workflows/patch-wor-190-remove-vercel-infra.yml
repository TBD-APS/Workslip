name: Patch WOR-190 remove Vercel infrastructure coupling

on:
  push:
    branches:
      - rbj--190-infrastructure-deployment-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--190-infrastructure-deployment-hardening
          fetch-depth: 0

      - name: Remove Vercel configuration from infrastructure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def load(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def save(path: str, content: str) -> None:
              Path(path).write_text(content, encoding='utf-8', newline='\n')

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return content.replace(old, new, 1)

          path = 'src/BE/infrastructure/deploy-infrastructure.ps1'
          text = load(path)
          text = replace_once(text, "    [string]$VercelToken = '',\n", '', 'VercelToken parameter')
          text = replace_once(text, "$VercelTokenSecretName = 'Vercel--Token'\n", '', 'Vercel secret constant')
          text = replace_once(text, """    $existingVercelToken = Get-KeyVaultSecretValue -SecretName $VercelTokenSecretName
    if (-not [string]::IsNullOrWhiteSpace($VercelToken)) {
        Write-Warning 'The -VercelToken parameter is retained for compatibility. Prefer WORKSLIP_VERCEL_TOKEN to avoid shell-history exposure.'
    }
    $requestedVercelToken = if (-not [string]::IsNullOrWhiteSpace($VercelToken)) {
        $VercelToken
    } elseif (-not [string]::IsNullOrWhiteSpace($env:WORKSLIP_VERCEL_TOKEN)) {
        $env:WORKSLIP_VERCEL_TOKEN
    } else {
        $null
    }

    if ([string]::IsNullOrWhiteSpace($existingVercelToken) -and
        [string]::IsNullOrWhiteSpace($requestedVercelToken)) {
        $legacyVercelValue = Get-AppConfigurationValue -Key 'Vercel:Token'
        if (-not [string]::IsNullOrWhiteSpace($legacyVercelValue) -and
            $legacyVercelValue -notmatch '^\s*\{\s*"uri"\s*:') {
            $requestedVercelToken = $legacyVercelValue
        }
    }

    if ([string]::IsNullOrWhiteSpace($existingVercelToken) -and
        [string]::IsNullOrWhiteSpace($requestedVercelToken)) {
        throw 'Vercel token is missing. Set WORKSLIP_VERCEL_TOKEN for the first hardened deployment.'
    }

""", '', 'Vercel token reconciliation block')
          text = replace_once(text, "            vercelToken = @{ value = '' }\n", '', 'Vercel Bicep parameter')
          text = replace_once(text, """    if (-not [string]::IsNullOrWhiteSpace($requestedVercelToken)) {
        Set-KeyVaultSecretFromMemory -SecretName $VercelTokenSecretName -SecretValue $requestedVercelToken
    }

""", '', 'Vercel Key Vault write')
          text = replace_once(text, "    Set-AppConfigurationKeyVaultReference -Key 'Vercel:Token' -SecretName $VercelTokenSecretName\n", '', 'Vercel App Configuration reference')
          text = replace_once(text, "    $requestedVercelToken = $null\n    $existingVercelToken = $null\n", '', 'Vercel cleanup variables')
          save(path, text)

          path = 'src/BE/infrastructure/main.bicep'
          text = load(path)
          text = replace_once(text, "@secure()\nparam vercelToken string\n", '', 'main.bicep Vercel parameter')
          text = replace_once(text, "    appConfigurationName: appConfiguration.name\n    vercelToken: vercelToken\n", "    appConfigurationName: appConfiguration.name\n", 'staticConfig Vercel parameter forwarding')
          save(path, text)

          path = 'src/BE/infrastructure/staticConfig.bicep'
          text = load(path)
          text = replace_once(text, "@secure()\n@description('Deprecated compatibility parameter. Azure infrastructure does not configure or invoke Vercel cache purge.')\nparam vercelToken string\n\n", '', 'staticConfig compatibility parameter')
          save(path, text)

          path = 'src/BE/infrastructure/README.md'
          text = load(path)
          text = replace_once(text, "| `Vercel:Token` | `Vercel--Token` | Reuses the existing secret, migrates the prior plain App Configuration value, or accepts `WORKSLIP_VERCEL_TOKEN` / `-VercelToken` for first setup or rotation. Omitted input never blanks the secret. |\n", '', 'README Vercel secret row')
          text = replace_once(text, "Secrets are written through temporary files and cleared from script variables during cleanup. A JWT signing-key rotation invalidates outstanding local Workslip JWTs.\n", "Secrets are written through temporary files and cleared from script variables during cleanup. A JWT signing-key rotation invalidates outstanding local Workslip JWTs. Vercel CDN purge configuration is outside the infrastructure deployment boundary.\n", 'README boundary statement')
          text = replace_once(text, "1. `Azure:Sql:ConnectionString`, `Jwt:SigningKey` and `Vercel:Token` are Key Vault references in App Configuration.\n", "1. `Azure:Sql:ConnectionString` and `Jwt:SigningKey` are Key Vault references in App Configuration.\n", 'README verification')
          save(path, text)

          path = 'Docs/architecture/adr/0001-managed-identity-runtime-and-secret-lifecycle.md'
          text = load(path)
          text = replace_once(text, "The infrastructure rewrite separated Entra application registration from Azure resources, but the infrastructure wrapper still delegated to a monolithic legacy script. That script duplicated Graph permission assignment, provisioned an unused OAuth client secret, exposed a Vercel token as ordinary App Configuration and configured the API to use the SQL administrator password at runtime. JWT signing material was deterministic and derived from public resource identifiers.", "The infrastructure rewrite separated Entra application registration from Azure resources, but the infrastructure wrapper still delegated to a monolithic legacy script. That script duplicated Graph permission assignment, provisioned an unused OAuth client secret and configured the API to use the SQL administrator password at runtime. JWT signing material was deterministic and derived from public resource identifiers.", 'ADR context')
          text = replace_once(text, "5. App Configuration contains versionless Key Vault references for JWT signing material, Vercel credentials and the SQL connection string.\n6. JWT signing material is generated with a cryptographic random-number generator and rotated explicitly or when the legacy deterministic value is detected.\n7. The deployment-created OAuth application client secret is removed. Future server-side confidential-client flows require a separate ADR and scoped credential lifecycle.\n8. `deploy.ps1` remains temporarily as a compatibility shim that delegates to `deploy-safe.ps1`.\n", "5. App Configuration contains versionless Key Vault references for JWT signing material and the SQL connection string.\n6. Vercel CDN purge configuration is outside the Azure infrastructure deployment boundary.\n7. JWT signing material is generated with a cryptographic random-number generator and rotated explicitly or when the legacy deterministic value is detected.\n8. The deployment-created OAuth application client secret is removed. Future server-side confidential-client flows require a separate ADR and scoped credential lifecycle.\n9. `deploy.ps1` remains temporarily as a compatibility shim that delegates to `deploy-safe.ps1`.\n", 'ADR decision')
          text = replace_once(text, "- Store Vercel/JWT values directly in App Configuration: rejected because App Configuration is the non-secret configuration layer.\n", "- Store JWT values directly in App Configuration: rejected because App Configuration is the non-secret configuration layer.\n", 'ADR rejected alternative')
          save(path, text)

          forbidden = ('VercelToken', 'WORKSLIP_VERCEL_TOKEN', 'Vercel--Token', 'Vercel:Token', 'Vercel:ProjectId')
          files = [
              'src/BE/infrastructure/deploy-infrastructure.ps1',
              'src/BE/infrastructure/deploy-safe.ps1',
              'src/BE/infrastructure/deploy.ps1',
              'src/BE/infrastructure/main.bicep',
              'src/BE/infrastructure/staticConfig.bicep',
              'src/BE/infrastructure/README.md',
              'Docs/architecture/adr/0001-managed-identity-runtime-and-secret-lifecycle.md',
          ]
          failures = []
          for file in files:
              content = load(file)
              for token in forbidden:
                  if token in content:
                      failures.append(f'{file}: {token}')
          if failures:
              raise SystemExit('Remaining Vercel infrastructure coupling:\n' + '\n'.join(failures))
          PY

          git diff --check

      - name: Commit focused correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-wor-190-remove-vercel-infra.yml
          git add \
            src/BE/infrastructure/deploy-infrastructure.ps1 \
            src/BE/infrastructure/main.bicep \
            src/BE/infrastructure/staticConfig.bicep \
            src/BE/infrastructure/README.md \
            Docs/architecture/adr/0001-managed-identity-runtime-and-secret-lifecycle.md
          git commit -m "RBJ-190 remove Vercel purge from infrastructure"
          git push origin HEAD:rbj--190-infrastructure-deployment-hardening
