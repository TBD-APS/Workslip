name: TEMP — Assistant Validation — WOR-201

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: temp-wor-201-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate production API client
        env:
          VITE_API_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net
        run: npx orval --config orval.config.ts

      - name: Lint changed TypeScript files
        run: npx eslint src/features/auth/components/OneTimeCodeInput.tsx src/features/auth/components/OneTimeCodeLogin.tsx

      - name: Build frontend
        run: npm run build
