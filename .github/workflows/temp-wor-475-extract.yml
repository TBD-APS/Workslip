name: Temporary WOR-475 stylesheet extraction

on:
  push:
    branches:
      - rbj--475-app-css-ownership

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--475-app-css-ownership
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Extract owned stylesheet clusters
        run: node src/FE/scripts/extract-app-css-wor475.mjs
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FE/src/App.css src/FE/src/authenticated-base.css src/FE/src/components/forms/FormPrimitives.css src/FE/src/components/layouts/AppLayout.shell.css src/FE/src/features/settings/routes/Profile.css src/FE/scripts/check-app-css-budget.mjs
          git diff --cached --quiet && exit 0
          git commit -m "RBJ-475: extract legacy stylesheet owners"
          git push origin HEAD:rbj--475-app-css-ownership
