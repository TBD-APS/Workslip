name: TEMP — Validate final WOR-223 head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --nologo
      - name: Build Release
        run: dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-restore --nologo
      - name: Focused push tests
        run: dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~Workslip.Tests.Notifications.WebPushSenderTests --nologo
      - name: Relevant notification tests
        run: dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Workslip.Tests.Notifications&FullyQualifiedName!~Workslip.Tests.Notifications.EfNotificationRepositoryTests.QueueNotificationAsync_DetachesRowAfterPersistenceFailure" --nologo
