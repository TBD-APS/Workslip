name: TEMP — Diagnose WOR-226 browser harness

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies and browser
        run: |
          npm ci
          npx orval --config orval.config.ts
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Create diagnostic harness
        run: |
          set -Eeuo pipefail
          rm -rf .tmp-wor-226
          mkdir -p .tmp-wor-226

          cat > src/wor226Validation.tsx <<'TSX'
          import { useMemo, useState } from 'react';
          import { QueryClient, QueryClientProvider } from '@tanstack/react-query';
          import { AuthContext, type AuthContextType } from './providers/authContextValue';
          import { CreateOverviewStep } from './features/jobs/components/steps/CreateOverviewStep';

          const queryClient = new QueryClient({ defaultOptions: { queries: { retry: false } } });

          export function Wor226Validation() {
            const [createCustomer, setCreateCustomer] = useState(false);
            const auth = useMemo(() => ({
              hasAuthToken: true,
              isAuthenticated: true,
              user: {
                id: 'user-1',
                displayName: 'Testbruger',
                role: 'User',
                roleDisplayName: 'User',
              },
              isLoading: false,
              login: async () => true,
              devLogin: async () => true,
              logout: () => undefined,
              clearLocalSession: () => undefined,
              updateUser: () => undefined,
              meQuery: {
                isPending: false,
                isError: false,
                refetch: async () => undefined,
                data: null,
              },
            }) as unknown as AuthContextType, []);

            const create = {
              form: {
                customerId: null,
                customerSnapshot: null,
                editSnapshot: true,
                createCustomer,
                reportNumber: '',
                destinationAddress: 'Testvej 1',
                destinationZipCode: '8000',
                destinationCity: 'Aarhus C',
                jobType: 'KLS',
                taskDescription: '',
                customerObservations: '',
                technicalObservations: '',
              },
              assignedUserIds: ['user-1'],
              assignableUsers: [],
              isLoadingUsers: false,
              linkedJobIds: [],
              fieldErrors: {},
              updateDestinationAddress: () => undefined,
              updateDestinationZipCode: () => undefined,
              updateDestinationCity: () => undefined,
              updateCreateCustomer: setCreateCustomer,
              selectCustomer: () => undefined,
              createNewCustomer: () => undefined,
              updateSnapshotField: () => undefined,
              updateEditSnapshot: () => undefined,
              updateAssignedUsers: () => undefined,
              updateLinkedJobs: () => undefined,
              updateTaskDescription: () => undefined,
              updateCustomerObservations: () => undefined,
              updateTechnicalObservations: () => undefined,
            };

            return (
              <AuthContext.Provider value={auth}>
                <QueryClientProvider client={queryClient}>
                  <main><h1>WOR-226 validation</h1><CreateOverviewStep create={create as never} linkableJobs={[]} isLoadingJobs={false} /></main>
                </QueryClientProvider>
              </AuthContext.Provider>
            );
          }
          TSX

          cat > src/main.tsx <<'TSX'
          import { createRoot } from 'react-dom/client';
          import { Wor226Validation } from './wor226Validation';
          createRoot(document.getElementById('root')!).render(<Wor226Validation />);
          TSX

          cat > .tmp-wor-226/playwright.config.ts <<'TS'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({ testDir: '.', timeout: 30_000, use: { baseURL: 'http://127.0.0.1:4173', browserName: 'chromium' } });
          TS

          cat > .tmp-wor-226/diagnose.spec.ts <<'TS'
          import { test } from '@playwright/test';

          test('renders the actual create overview component', async ({ page }) => {
            const failures: string[] = [];
            page.on('console', message => failures.push(`console:${message.type()}: ${message.text()}`));
            page.on('pageerror', error => failures.push(`pageerror: ${error.stack ?? error.message}`));
            page.on('requestfailed', request => failures.push(`requestfailed: ${request.url()} ${request.failure()?.errorText ?? ''}`));
            await page.route('**/*', async route => {
              const url = new URL(route.request().url());
              if (url.pathname.startsWith('/api/')) {
                await route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
                return;
              }
              await route.continue();
            });
            await page.goto('/');
            await page.waitForTimeout(1500);
            const headingVisible = await page.getByRole('heading', { name: 'WOR-226 validation' }).isVisible().catch(() => false);
            if (!headingVisible) {
              throw new Error(`Harness did not render.\nFailures:\n${failures.join('\n')}\nHTML:\n${await page.content()}`);
            }
          });
          TS

      - name: Run browser diagnostic
        run: |
          set -Eeuo pipefail
          npx vite --host 127.0.0.1 --port 4173 > .tmp-wor-226/vite.log 2>&1 &
          server_pid=$!
          cleanup() { kill "${server_pid}" 2>/dev/null || true; rm -rf .tmp-wor-226 src/wor226Validation.tsx; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          set +e
          npx playwright test --config .tmp-wor-226/playwright.config.ts --reporter=line --workers=1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo '--- Vite log ---'
            cat .tmp-wor-226/vite.log || true
            exit $status
          fi
