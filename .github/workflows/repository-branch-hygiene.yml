name: Repository · Branch hygiene

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '47 2 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report merged branches without deleting them
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repository-branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup-closed-pull-request:
    name: Delete merged PR branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Delete safe merged branch
        shell: bash
        run: |
          set -Eeuo pipefail

          case "${HEAD_REF}" in
            main|production|release-*|release/*|safety/*|backup/*|mahad-*)
              echo "Preserving protected branch: ${HEAD_REF}"
              exit 0
              ;;
          esac

          if gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 500 --json headRefName --jq '.[].headRefName' | grep -Fxq -- "${HEAD_REF}"; then
            echo "Preserving branch used by an open pull request: ${HEAD_REF}"
            exit 0
          fi

          if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
            echo "Deleted merged branch: ${HEAD_REF}"
          else
            echo "Branch already absent: ${HEAD_REF}"
          fi

  sweep-merged-pull-request-branches:
    name: Sweep old merged PR branches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Remove only same-repository merged PR branches
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t open_heads < <(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --limit 500 \
              --json headRefName \
              --jq '.[].headRefName'
          )

          is_open_head() {
            local candidate="$1"
            local open_head
            for open_head in "${open_heads[@]:-}"; do
              if [[ "${open_head}" == "${candidate}" ]]; then
                return 0
              fi
            done
            return 1
          }

          mapfile -t merged_heads < <(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state merged \
              --limit 500 \
              --json headRefName,isCrossRepository \
              --jq '.[] | select(.isCrossRepository == false) | .headRefName' \
              | sort -u
          )

          deleted=0
          preserved=0
          absent=0

          for branch in "${merged_heads[@]:-}"; do
            [[ -n "${branch}" ]] || continue

            case "${branch}" in
              main|production|release-*|release/*|safety/*|backup/*|mahad-*)
                echo "Preserve: ${branch}"
                preserved=$((preserved + 1))
                continue
                ;;
            esac

            if is_open_head "${branch}"; then
              echo "Preserve open PR head: ${branch}"
              preserved=$((preserved + 1))
              continue
            fi

            if ! gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              absent=$((absent + 1))
              continue
            fi

            if [[ "${DRY_RUN}" == 'true' ]]; then
              echo "Would delete merged branch: ${branch}"
              continue
            fi

            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted merged branch: ${branch}"
            deleted=$((deleted + 1))
          done

          echo "Branch hygiene complete: deleted=${deleted}, preserved=${preserved}, already_absent=${absent}, dry_run=${DRY_RUN}"
