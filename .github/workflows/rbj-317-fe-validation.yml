name: RBJ-317 FE validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rbj-317-fe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-notifications:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'rbj--248-push-service-test-matrix'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - run: npm ci
      - name: Notification unit tests
        run: >-
          npm test -- --run
          src/features/users/hooks/usePushNotifications.test.ts
          src/pwa/notificationNavigation.test.ts
          src/pwa/pushNotificationPayload.test.ts
      - name: Service worker typecheck
        run: npm run typecheck:sw
      - name: Notification lint
        run: >-
          npx eslint
          src/features/users/hooks/usePushNotifications.ts
          src/features/users/hooks/usePushNotifications.test.ts
          src/pwa/notificationNavigation.ts
          src/pwa/notificationNavigation.test.ts
          src/pwa/pushNotificationPayload.ts
          src/pwa/pushNotificationPayload.test.ts
          src/sw.ts
      - name: Install Playwright harness dependency
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Playwright notification navigation harness
        env:
          PROD_URL: https://app.mrsoftware.dk
        run: node scripts/playwright-notification-navigation.mjs

  frontend-diagnostics-export:
    if: github.head_ref == 'rbj--319-copy-diagnostics-chatgpt'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - run: npm ci
      - name: Diagnostics export unit tests
        run: >-
          npm test -- --run
          src/features/superadmin/diagnostics/DiagnosticsSupportCopyButton.test.tsx
          src/features/superadmin/diagnostics/supportSnapshot.test.ts
      - name: Diagnostics export lint
        run: >-
          npx eslint
          src/features/superadmin/diagnostics/DiagnosticsSupportCopyButton.tsx
          src/features/superadmin/diagnostics/DiagnosticsSupportCopyButton.test.tsx
          src/features/superadmin/diagnostics/api.ts
          src/features/superadmin/diagnostics/supportSnapshot.ts
          src/features/superadmin/diagnostics/supportSnapshot.test.ts
          src/features/superadmin/routes/SuperAdmin.tsx
      - name: Diagnostics source typecheck
        run: |
          cat > tsconfig.wor319.json <<'JSON'
          {
            "extends": "./tsconfig.app.json",
            "compilerOptions": {
              "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.wor319.tsbuildinfo"
            },
            "include": [
              "src/features/superadmin/diagnostics/DiagnosticsSupportCopyButton.tsx",
              "src/features/superadmin/diagnostics/api.ts",
              "src/features/superadmin/diagnostics/supportSnapshot.ts",
              "src/features/superadmin/diagnostics/types.ts"
            ]
          }
          JSON
          npx tsc -p tsconfig.wor319.json
