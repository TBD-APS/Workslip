name: Playwright critical flows

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Vælg et isoleret flow eller hele den risikobaserede suite
        required: true
        default: public-smoke
        type: choice
        options:
          - public-smoke
          - auth-session
          - kls-lifecycle
          - rejection-loop
          - draft-recovery
          - role-tenant-isolation
          - invitation-onboarding
          - assignment-lifecycle
          - customer-lifecycle
          - worksheet-integrity
          - diverse-lifecycle
          - all-critical

permissions:
  contents: read

concurrency:
  group: playwright-critical-flows-${{ inputs.scenario }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Mobile critical flow (${{ inputs.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install Playwright temporarily
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate test sources
        run: |
          node --check scripts/playwright-prod-smoke.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('../BE/WorkslipApi/Postman/postman_collection.json', 'utf8'))"

      - name: Run Playwright scenario
        env:
          PROD_URL: https://app.mrsoftware.dk
          SCENARIO: ${{ inputs.scenario }}
        run: node scripts/playwright-prod-smoke.mjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-flows-${{ inputs.scenario }}
          path: artifacts/playwright-prod-smoke
          if-no-files-found: warn
          retention-days: 7
