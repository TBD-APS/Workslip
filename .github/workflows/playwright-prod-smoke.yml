name: Playwright prod smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-prod-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Mobile prod smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install Playwright temporarily
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visit production site
        env:
          PROD_URL: https://app.mrsoftware.dk
        run: |
          mkdir -p ../../artifacts/playwright-prod-smoke
          node --input-type=module <<'EOF'
          import { chromium, devices } from 'playwright';

          const browser = await chromium.launch();
          const context = await browser.newContext({
            ...devices['iPhone 13'],
          });
          const page = await context.newPage();
          const consoleErrors = [];

          page.on('console', message => {
            if (message.type() === 'error') {
              consoleErrors.push(message.text());
            }
          });

          try {
            const response = await page.goto(process.env.PROD_URL, {
              waitUntil: 'networkidle',
              timeout: 45_000,
            });

            if (!response) {
              throw new Error('Production navigation returned no HTTP response.');
            }

            if (!response.ok()) {
              throw new Error(`Production returned HTTP ${response.status()}.`);
            }

            await page.screenshot({
              path: '../../artifacts/playwright-prod-smoke/mobile-home.png',
              fullPage: true,
            });

            const report = {
              url: page.url(),
              status: response.status(),
              title: await page.title(),
              viewport: devices['iPhone 13'].viewport,
              consoleErrors,
            };

            await import('node:fs/promises').then(fs =>
              fs.writeFile(
                '../../artifacts/playwright-prod-smoke/report.json',
                JSON.stringify(report, null, 2),
              ),
            );
          } finally {
            await browser.close();
          }
          EOF

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-smoke
          path: artifacts/playwright-prod-smoke
          if-no-files-found: warn
          retention-days: 7
