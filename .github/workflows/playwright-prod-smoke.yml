name: Playwright prod smoke

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Vælg skrivefrit smoke-check eller komplet testsag i dev-miljøet
        required: true
        default: public-smoke
        type: choice
        options:
          - public-smoke
          - full-case

permissions:
  contents: read

concurrency:
  group: playwright-prod-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Mobile prod smoke (${{ inputs.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install Playwright temporarily
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright scenario
        env:
          PROD_URL: https://app.mrsoftware.dk
          SCENARIO: ${{ inputs.scenario }}
        run: node scripts/playwright-prod-smoke.mjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-smoke-${{ inputs.scenario }}
          path: artifacts/playwright-prod-smoke
          if-no-files-found: warn
          retention-days: 7
