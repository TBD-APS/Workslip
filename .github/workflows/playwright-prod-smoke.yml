name: Playwright public smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-public-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Mobile public smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host

    defaults:
      run:
        working-directory: src/FE

    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SCENARIO: public-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release-test target
        id: release-target
        working-directory: .
        run: >-
          node tools/release/resolve-release-environment.mjs
          --environment production
          --require-runnable
          --github-output

      - name: Install lightweight Playwright runtime
        run: >-
          npm install
          --prefix scripts
          --no-save
          --package-lock=false
          --ignore-scripts
          --no-audit
          --no-fund
          playwright@1.55.0

      - name: Validate test sources
        run: |
          node --check scripts/playwright-release-runner.mjs
          node --check scripts/playwright-release-policy.mjs
          node --check scripts/playwright-prod-smoke.mjs
          node --check scripts/playwright-critical-contract.mjs
          node --check scripts/playwright-critical-domain.mjs
          node --check scripts/playwright-scenarios-core.mjs
          node --check scripts/playwright-scenarios-admin.mjs
          node --check scripts/playwright-synthetic-auth.mjs
          node --check scripts/playwright-release-runner.test.mjs
          node --check scripts/playwright-scenarios-admin.test.mjs
          node --test scripts/playwright-release-runner.test.mjs
          node --test scripts/playwright-scenarios-admin.test.mjs
          node --test scripts/playwright-synthetic-auth.test.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('../BE/WorkslipApi/Postman/postman_collection.json', 'utf8'))"

      - name: Run Playwright scenario
        env:
          PROD_URL: ${{ steps.release-target.outputs.url }}
          WORKSLIP_RELEASE_PHASE: ${{ steps.release-target.outputs.phase }}
          WORKSLIP_TEST_TARGET: ${{ steps.release-target.outputs.environment }}
          WORKSLIP_ALLOW_DESTRUCTIVE_PLAYWRIGHT: ${{ steps.release-target.outputs.allow_destructive_playwright }}
        run: node scripts/playwright-release-runner.mjs

      - name: Upload Playwright evidence
        if: ${{ always() && env.ACT != 'true' && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-public-smoke-production
          path: artifacts/playwright-prod-smoke
          if-no-files-found: warn
          retention-days: 7
