name: Data · Seed live SQL from current production

run-name: >-
  SQL seed · current production → live · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEED NEW TENANT DATABASE
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/sql-live-seed-copy.yml'
      - 'src/BE/infrastructure/aca/seed-live-sql-from-prod-ci.ps1'
      - 'src/BE/infrastructure/aca/configure-live-migration-database-access.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sql-live-seed-copy.yml'
      - 'src/BE/infrastructure/aca/seed-live-sql-from-prod-ci.ps1'
      - 'src/BE/infrastructure/aca/configure-live-migration-database-access.ps1'

permissions:
  contents: read

concurrency:
  group: workslip-cross-tenant-sql-seed
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  TARGET_RESOURCE_GROUP: rg-mrsoftwarev2-live
  TARGET_KEY_VAULT: kv-mrsoftwarev2-live
  TARGET_INFRA_IDENTITY: id-mrsoftwarev2-live-infra-github
  TARGET_INFRA_CLIENT_ID: 1269f00f-e4af-4ea2-8c01-8cf28e66ef09
  SOURCE_KEY_VAULT: kv-mrsoftware-prod
  SQL_PASSWORD_SECRET: Azure--Sql--AdminPassword
  TEMP_TARGET_FIC: github-sql-seed-from-prod
  PROD_OIDC_SUBJECT: repo:rasm105k@31623093/Workslip-v2.0@1245555609:environment:prod

jobs:
  verify:
    name: SQL seed · Validate intent and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      execute: ${{ steps.intent.outputs.execute }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Parse PowerShell without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            './src/BE/infrastructure/aca/seed-live-sql-from-prod-ci.ps1',
            './src/BE/infrastructure/aca/configure-live-migration-database-access.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell syntax validation failed for ${path}."
            }
          }

      - name: Resolve execution intent
        id: intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirmation || '' }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -Eeuo pipefail
          execute=false
          case "${EVENT_NAME}" in
            pull_request)
              echo 'PR validation is syntax/policy only; no Azure credentials are reachable.'
              ;;
            workflow_dispatch)
              [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo '::error::SQL seed may only run from main.'; exit 1; }
              [[ "${CONFIRMATION}" == 'SEED NEW TENANT DATABASE' ]] || { echo '::error::Confirmation must be exactly SEED NEW TENANT DATABASE.'; exit 1; }
              execute=true
              ;;
            push)
              [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo '::error::Push seed may only run on main.'; exit 1; }
              if [[ "${PUSH_MESSAGE}" == *'[run-sql-seed]'* ]]; then
                execute=true
              else
                echo 'Push did not contain the one-shot [run-sql-seed] marker; Azure jobs are disabled.'
              fi
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}."
              exit 1
              ;;
          esac
          echo "execute=${execute}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js for production eligibility gate
        if: ${{ steps.intent.outputs.execute == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Wait for exact green current main before Azure access
        if: ${{ steps.intent.outputs.execute == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 40); do
            if node tools/release/verify-production-eligibility.mjs --sha "${GITHUB_SHA}"; then
              exit 0
            fi
            if [[ ${attempt} -eq 40 ]]; then
              echo '::error::Exact main CI did not become production-eligible within 20 minutes.'
              exit 1
            fi
            echo "CI Gate not ready yet (${attempt}/40); retrying in 30 seconds."
            sleep 30
          done

  prepare-target:
    name: SQL seed · Prepare temporary live trust
    needs: verify
    if: ${{ needs.verify.outputs.execute == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: live
    permissions:
      id-token: write
      contents: read
    env:
      INFRA_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      TARGET_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      TARGET_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Verify live configuration exists
        shell: bash
        run: |
          set -Eeuo pipefail
          for pair in \
            "INFRA_CLIENT_ID=${INFRA_CLIENT_ID}" \
            "TARGET_TENANT_ID=${TARGET_TENANT_ID}" \
            "TARGET_SUBSCRIPTION_ID=${TARGET_SUBSCRIPTION_ID}"; do
            key="${pair%%=*}"
            value="${pair#*=}"
            [[ -n "${value}" ]] || { echo "::error::live is missing ${key}."; exit 1; }
          done
          [[ "${INFRA_CLIENT_ID}" == "${TARGET_INFRA_CLIENT_ID}" ]] || { echo '::error::live infrastructure client ID does not match the reviewed target identity.'; exit 1; }

      - name: Azure login to live infrastructure identity
        uses: azure/login@v3
        with:
          client-id: ${{ env.INFRA_CLIENT_ID }}
          tenant-id: ${{ env.TARGET_TENANT_ID }}
          subscription-id: ${{ env.TARGET_SUBSCRIPTION_ID }}

      - name: Create temporary prod-subject federation on live identity
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          account="$(az account show --query '{tenant:tenantId,subscription:id}' -o json)"
          [[ "$(jq -r '.tenant' <<<"${account}")" == "${TARGET_TENANT_ID}" ]] || { echo '::error::live tenant mismatch.'; exit 1; }
          [[ "$(jq -r '.subscription' <<<"${account}")" == "${TARGET_SUBSCRIPTION_ID}" ]] || { echo '::error::live subscription mismatch.'; exit 1; }

          actual_client="$(az identity show \
            --resource-group "${TARGET_RESOURCE_GROUP}" \
            --name "${TARGET_INFRA_IDENTITY}" \
            --query clientId -o tsv --only-show-errors)"
          [[ "${actual_client}" == "${TARGET_INFRA_CLIENT_ID}" ]] || { echo '::error::Reviewed live infrastructure identity client ID drifted.'; exit 1; }

          az keyvault secret show \
            --vault-name "${TARGET_KEY_VAULT}" \
            --name "${SQL_PASSWORD_SECRET}" \
            --query id -o tsv --only-show-errors >/dev/null

          az identity federated-credential delete \
            --resource-group "${TARGET_RESOURCE_GROUP}" \
            --identity-name "${TARGET_INFRA_IDENTITY}" \
            --name "${TEMP_TARGET_FIC}" \
            --yes >/dev/null 2>&1 || true
          az identity federated-credential create \
            --resource-group "${TARGET_RESOURCE_GROUP}" \
            --identity-name "${TARGET_INFRA_IDENTITY}" \
            --name "${TEMP_TARGET_FIC}" \
            --issuer 'https://token.actions.githubusercontent.com' \
            --subject "${PROD_OIDC_SUBJECT}" \
            --audiences 'api://AzureADTokenExchange' \
            --only-show-errors --output none

      - name: Allow federated credential propagation
        run: sleep 20

      - name: Remove temporary federation if target preparation fails
        if: ${{ failure() }}
        shell: bash
        run: |
          az identity federated-credential delete \
            --resource-group "${TARGET_RESOURCE_GROUP}" \
            --identity-name "${TARGET_INFRA_IDENTITY}" \
            --name "${TEMP_TARGET_FIC}" \
            --yes >/dev/null 2>&1 || true

  seed:
    name: SQL seed · Copy prod into live
    needs: [verify, prepare-target]
    if: ${{ needs.verify.outputs.execute == 'true' && needs.prepare-target.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: prod
    permissions:
      id-token: write
      contents: read
    env:
      SOURCE_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      SOURCE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      SOURCE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout exact validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Azure login to current-production infrastructure identity
        uses: azure/login@v3
        with:
          client-id: ${{ env.SOURCE_CLIENT_ID }}
          tenant-id: ${{ env.SOURCE_TENANT_ID }}
          subscription-id: ${{ env.SOURCE_SUBSCRIPTION_ID }}

      - name: Verify source SQL administrator secret is readable
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SOURCE_CLIENT_ID}" && -n "${SOURCE_TENANT_ID}" && -n "${SOURCE_SUBSCRIPTION_ID}" ]] || { echo '::error::prod Azure configuration is incomplete.'; exit 1; }
          account="$(az account show --query '{tenant:tenantId,subscription:id}' -o json)"
          [[ "$(jq -r '.tenant' <<<"${account}")" == "${SOURCE_TENANT_ID}" ]] || { echo '::error::prod tenant mismatch.'; exit 1; }
          [[ "$(jq -r '.subscription' <<<"${account}")" == "${SOURCE_SUBSCRIPTION_ID}" ]] || { echo '::error::prod subscription mismatch.'; exit 1; }
          az keyvault secret show \
            --vault-name "${SOURCE_KEY_VAULT}" \
            --name "${SQL_PASSWORD_SECRET}" \
            --query id -o tsv --only-show-errors >/dev/null

      - name: Acquire one protected prod-environment GitHub OIDC assertion
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo '::error::GitHub OIDC request context is unavailable.'; exit 1; }
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange")"
          token="$(jq -er '.value' <<<"${response}")"
          echo "::add-mask::${token}"
          token_path="${RUNNER_TEMP}/workslip-sql-seed-oidc.jwt"
          umask 077
          printf '%s' "${token}" > "${token_path}"
          echo "token_path=${token_path}" >> "${GITHUB_OUTPUT}"

      - name: Discover live tenant and subscription without cross-environment outputs
        shell: bash
        env:
          TOKEN_PATH: ${{ steps.oidc.outputs.token_path }}
        run: |
          set -Eeuo pipefail
          headers="$(mktemp)"
          trap 'rm -f "${headers}"' EXIT
          curl -sS -D "${headers}" -o /dev/null \
            "https://${TARGET_KEY_VAULT}.vault.azure.net/secrets?api-version=7.4" || true
          auth_url="$(tr -d '\r' < "${headers}" | grep -ioE 'https://login\.windows\.net/[0-9a-fA-F-]+' | head -n1 || true)"
          target_tenant="${auth_url##*/}"
          [[ "${target_tenant}" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo '::error::Could not discover live tenant from Key Vault challenge.'; exit 1; }

          token="$(cat "${TOKEN_PATH}")"
          az account clear >/dev/null 2>&1
          az login --service-principal \
            --username "${TARGET_INFRA_CLIENT_ID}" \
            --tenant "${target_tenant}" \
            --federated-token "${token}" \
            --allow-no-subscriptions --output none --only-show-errors

          matches=()
          while IFS= read -r subscription; do
            [[ -n "${subscription}" ]] || continue
            az account set --subscription "${subscription}" >/dev/null 2>&1 || continue
            if az group show --name "${TARGET_RESOURCE_GROUP}" --query id -o tsv --only-show-errors >/dev/null 2>&1; then
              matches+=("${subscription}")
            fi
          done < <(az account list --all --query '[].id' -o tsv --only-show-errors)
          [[ ${#matches[@]} -eq 1 ]] || { echo "::error::Expected exactly one subscription containing ${TARGET_RESOURCE_GROUP}; found ${#matches[@]}."; exit 1; }
          target_subscription="${matches[0]}"

          echo "RESOLVED_TARGET_TENANT_ID=${target_tenant}" >> "${GITHUB_ENV}"
          echo "RESOLVED_TARGET_SUBSCRIPTION_ID=${target_subscription}" >> "${GITHUB_ENV}"

          az account clear >/dev/null 2>&1
          az login --service-principal \
            --username "${SOURCE_CLIENT_ID}" \
            --tenant "${SOURCE_TENANT_ID}" \
            --federated-token "${token}" \
            --allow-no-subscriptions --output none --only-show-errors
          az account set --subscription "${SOURCE_SUBSCRIPTION_ID}"

      - name: Install SQL PowerShell module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Install-Module SqlServer -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          Import-Module SqlServer -ErrorAction Stop
          Get-Command Invoke-Sqlcmd -ErrorAction Stop | Out-Null

      - name: Run guarded cross-tenant seed and canonical swap
        id: copy
        shell: pwsh
        env:
          OIDC_TOKEN_PATH: ${{ steps.oidc.outputs.token_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RESOLVED_TARGET_TENANT_ID) -or
              [string]::IsNullOrWhiteSpace($env:RESOLVED_TARGET_SUBSCRIPTION_ID)) {
            throw 'Resolved target boundary is missing.'
          }
          $manifest = Join-Path $env:RUNNER_TEMP 'workslip-sql-seed-manifest.json'
          & ./src/BE/infrastructure/aca/seed-live-sql-from-prod-ci.ps1 `
            -SourceTenantId $env:SOURCE_TENANT_ID `
            -SourceSubscriptionId $env:SOURCE_SUBSCRIPTION_ID `
            -SourceClientId $env:SOURCE_CLIENT_ID `
            -TargetTenantId $env:RESOLVED_TARGET_TENANT_ID `
            -TargetSubscriptionId $env:RESOLVED_TARGET_SUBSCRIPTION_ID `
            -TargetClientId $env:TARGET_INFRA_CLIENT_ID `
            -FederatedTokenPath $env:OIDC_TOKEN_PATH `
            -Confirmation 'SEED NEW TENANT DATABASE' `
            -ManifestPath $manifest
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'Seed completed without an evidence manifest.' }
          "manifest=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Login back into live infrastructure identity
        if: ${{ steps.copy.outcome == 'success' }}
        shell: bash
        env:
          TOKEN_PATH: ${{ steps.oidc.outputs.token_path }}
        run: |
          set -Eeuo pipefail
          token="$(cat "${TOKEN_PATH}")"
          az account clear >/dev/null 2>&1
          az login --service-principal \
            --username "${TARGET_INFRA_CLIENT_ID}" \
            --tenant "${RESOLVED_TARGET_TENANT_ID}" \
            --federated-token "${token}" \
            --allow-no-subscriptions --output none --only-show-errors
          az account set --subscription "${RESOLVED_TARGET_SUBSCRIPTION_ID}"

      - name: Restore live database migration identity on copied database
        if: ${{ steps.copy.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./src/BE/infrastructure/aca/configure-live-migration-database-access.ps1

      - name: Publish non-personal seed evidence
        if: ${{ steps.copy.outcome == 'success' }}
        shell: bash
        env:
          MANIFEST: ${{ steps.copy.outputs.manifest }}
        run: |
          set -Eeuo pipefail
          users="$(jq -r '.validation.usersRowCount' "${MANIFEST}")"
          mismatches="$(jq -r '.validation.mismatchCount' "${MANIFEST}")"
          quarantine="$(jq -r '.target.previousDatabaseQuarantine // "none"' "${MANIFEST}")"
          hash="$(sha256sum "${MANIFEST}" | awk '{print $1}')"
          {
            echo '## Cross-tenant SQL seed'
            echo
            echo '- Source: `db-mrsoftware-prod`'
            echo '- Canonical target: `db-mrsoftwarev2-live`'
            echo "- Users rows copied: \`${users}\`"
            echo "- Row-count differences after writable seed window: \`${mismatches}\`"
            echo "- Previous target quarantine: \`${quarantine}\`"
            echo "- Evidence SHA-256: \`${hash}\`"
            echo '- Current production remained writable; this is not the final frozen cutover copy.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload non-personal table-count evidence
        if: ${{ steps.copy.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: workslip-sql-seed-evidence-${{ github.run_id }}
          path: ${{ steps.copy.outputs.manifest }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary live federation
        if: ${{ always() && steps.oidc.outputs.token_path != '' }}
        shell: bash
        env:
          TOKEN_PATH: ${{ steps.oidc.outputs.token_path }}
        run: |
          set +e
          if [[ -n "${RESOLVED_TARGET_TENANT_ID:-}" && -n "${RESOLVED_TARGET_SUBSCRIPTION_ID:-}" && -s "${TOKEN_PATH}" ]]; then
            token="$(cat "${TOKEN_PATH}")"
            az account clear >/dev/null 2>&1
            az login --service-principal \
              --username "${TARGET_INFRA_CLIENT_ID}" \
              --tenant "${RESOLVED_TARGET_TENANT_ID}" \
              --federated-token "${token}" \
              --allow-no-subscriptions --output none --only-show-errors >/dev/null 2>&1
            az account set --subscription "${RESOLVED_TARGET_SUBSCRIPTION_ID}" >/dev/null 2>&1
            az identity federated-credential delete \
              --resource-group "${TARGET_RESOURCE_GROUP}" \
              --identity-name "${TARGET_INFRA_IDENTITY}" \
              --name "${TEMP_TARGET_FIC}" \
              --yes >/dev/null 2>&1
          fi
          rm -f "${TOKEN_PATH}" >/dev/null 2>&1

  cleanup-target-fallback:
    name: SQL seed · Cleanup temporary live trust after failure
    needs: [prepare-target, seed]
    if: ${{ always() && needs.prepare-target.result == 'success' && needs.seed.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: live
    permissions:
      id-token: write
      contents: read
    env:
      INFRA_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      TARGET_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      TARGET_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Azure login to live infrastructure identity
        uses: azure/login@v3
        with:
          client-id: ${{ env.INFRA_CLIENT_ID }}
          tenant-id: ${{ env.TARGET_TENANT_ID }}
          subscription-id: ${{ env.TARGET_SUBSCRIPTION_ID }}

      - name: Delete temporary prod-subject federation
        shell: bash
        run: |
          set -Eeuo pipefail
          az identity federated-credential delete \
            --resource-group "${TARGET_RESOURCE_GROUP}" \
            --identity-name "${TARGET_INFRA_IDENTITY}" \
            --name "${TEMP_TARGET_FIC}" \
            --yes >/dev/null 2>&1 || true
