name: RBJ-167 remove SQL admin membership

on:
  push:
    branches:
      - rbj--167-fix-oidc-subject-defaults-v2
    paths:
      - '.github/workflows/rbj-167-remove-sql-admin-membership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--167-fix-oidc-subject-defaults-v2

      - name: Remove obsolete SQL admin group membership
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/BE/infrastructure/deploy.ps1')
          text = path.read_text(encoding='utf-8')
          text = text.replace("$DeploymentIdentityPrincipalId = $DeploymentOutputs.MANAGED_IDENTITY_PRINCIPAL_ID.value\n", '', 1)
          text = text.replace('''
          if ([string]::IsNullOrWhiteSpace($DeploymentIdentityPrincipalId)) {
              throw "Deployment output MANAGED_IDENTITY_PRINCIPAL_ID was empty."
          }
          ''', '\n', 1)
          text = text.replace('Add-GraphGroupMember -GroupId $SqlAdminGroupId -MemberId $DeploymentIdentityPrincipalId -Description "deployment managed identity"\n', '', 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit privilege cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BE/infrastructure/deploy.ps1
          git diff --cached --check
          git commit -m "RBJ-167: Remove obsolete SQL admin membership"
          git push origin HEAD:rbj--167-fix-oidc-subject-defaults-v2
