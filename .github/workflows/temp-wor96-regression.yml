name: TEMP WOR-96 deletion notification regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BE/WorkslipApi/**'
      - '.github/workflows/temp-wor96-regression.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore src/BE/WorkslipApi/WorkslipApi.sln

      - name: Build backend
        run: dotnet build src/BE/WorkslipApi/WorkslipApi.sln --configuration Release --no-restore

      - name: Run focused notification tests
        run: >-
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --filter FullyQualifiedName~Workslip.Tests.Notifications.JobDeletionNotificationServiceTests
