name: TEMP — WOR-245 final validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wor-245-final-validation.yml'
      - 'src/BE/WorkslipApi/**'
      - 'Docs/architecture/domain-and-dataflows.md'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify deletion notification toggle is removed
        run: |
          if git grep -n 'NotifyAssignedUsersOnJobDeletion\|Features:NotifyAssignedUsersOnJobDeletion\|JobNotificationFeatures' -- src/BE/WorkslipApi; then
            echo '::error::Deletion notification toggle remains in the application.'
            exit 1
          fi
          grep -q 'public bool IsEnabled => true;' src/BE/WorkslipApi/Workslip.Application/Notifications/JobDeletionNotificationService.cs

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend tests
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj

      - name: Build backend Release
        run: >-
          dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run focused notification tests
        run: >-
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --filter 'FullyQualifiedName~JobRejectionNotificationTests|FullyQualifiedName~JobDeletionNotificationServiceTests'

      - name: Verify final diff hygiene
        run: git diff --check origin/main...HEAD
