name: WOR-107 validation

on:
  push:
    branches:
      - rbj--107-superadmin-organization-admin
  pull_request:
    branches:
      - main
    paths:
      - "src/BE/WorkslipApi/**"
      - "Docs/api/**"
      - ".github/workflows/wor-107-validation.yml"

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BE/WorkslipApi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Add organization admin upsert to Postman
        working-directory: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("src/BE/WorkslipApi/Postman/postman_collection.json")
          collection = json.loads(path.read_text(encoding="utf-8"))
          organizations = next(item for item in collection["item"] if item.get("name") == "Organizations")

          create_item = next(
              item for item in organizations["item"]
              if item.get("request", {}).get("method") == "POST"
              and item.get("request", {}).get("url", {}).get("raw") == "{{baseUrl}}/api/organizations/"
          )
          create_item["request"]["description"] = (
              "Superadmin-only organization creation. Creates the organization and initial local admin row, "
              "then saves organizationId and userId on 200."
          )

          raw_url = "{{baseUrl}}/api/organizations/{{organizationId}}/admin"
          existing = next(
              (
                  item for item in organizations["item"]
                  if item.get("request", {}).get("url", {}).get("raw") == raw_url
              ),
              None,
          )
          if existing is None:
              organizations["item"].append(
                  {
                      "name": "/api/organizations/{organizationId}/admin",
                      "request": {
                          "method": "PUT",
                          "header": [
                              {"key": "Content-Type", "value": "application/json"}
                          ],
                          "url": {
                              "raw": raw_url,
                              "host": ["{{baseUrl}}"],
                              "path": [
                                  "api",
                                  "organizations",
                                  "{{organizationId}}",
                                  "admin",
                              ],
                          },
                          "description": (
                              "Superadmin-only idempotent admin upsert. Ensures the Entra guest and creates or "
                              "updates the selected organization's local Admin row."
                          ),
                          "body": {
                              "mode": "raw",
                              "raw": "{\n  \"email\": \"{{testEmail}}\",\n  \"displayName\": \"{{adminDisplayName}}\",\n  \"phone\": \"{{adminPhone}}\"\n}",
                              "options": {"raw": {"language": "json"}},
                          },
                      },
                      "response": [],
                      "event": [
                          {
                              "listen": "test",
                              "script": {
                                  "type": "text/javascript",
                                  "exec": [
                                      "pm.test('200 OK', function () { pm.response.to.have.status(200); });",
                                      "const json = pm.response.json();",
                                      "pm.test('admin belongs to selected organization', function () { pm.expect(json.organizationId).to.eql(pm.collectionVariables.get('organizationId')); });",
                                      "pm.test('canonical Admin role returned', function () { pm.expect(json.role).to.eql('Admin'); });",
                                      "pm.collectionVariables.set('userId', json.id);",
                                  ],
                              },
                          }
                      ],
                  }
              )

          path.write_text(
              json.dumps(collection, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Workslip.slnx

      - name: Build
        run: dotnet build Workslip.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Workslip.slnx --configuration Release --no-build --no-restore

      - name: Commit Postman update
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet -- src/BE/WorkslipApi/Postman/postman_collection.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BE/WorkslipApi/Postman/postman_collection.json
          git commit -m "WOR-107 update organization Postman requests"
          git push origin HEAD:rbj--107-superadmin-organization-admin
