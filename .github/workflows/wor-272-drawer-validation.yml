name: WOR-272 drawer gesture validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wor-272-drawer-validation.yml'
      - 'src/FE/src/components/common/Drawer.tsx'
      - 'src/FE/src/components/common/Drawer.css'
      - 'src/FE/src/components/common/Drawer.history.test.tsx'
      - 'src/FE/src/wor-272-validation.tsx'
      - 'src/FE/wor-272-validation.html'
      - 'src/FE/wor-272-playwright.mjs'

permissions:
  contents: read

jobs:
  drawer-gesture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Lint changed frontend files
        run: npx eslint src/components/common/Drawer.tsx src/components/common/Drawer.history.test.tsx src/wor-272-validation.tsx

      - name: Run focused drawer regression tests
        run: npm run test -- --run src/components/common/Drawer.history.test.tsx

      - name: Validate drawer gesture in mobile Chromium
        run: |
          npx vite --host 127.0.0.1 --port 4173 > "${RUNNER_TEMP}/wor-272-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/wor-272-validation.html > /dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${RUNNER_TEMP}/wor-272-vite.log"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/wor-272-validation.html > /dev/null
          node wor-272-playwright.mjs
