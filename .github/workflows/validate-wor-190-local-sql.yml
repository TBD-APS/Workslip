name: Validate WOR-190 local Azure SQL authentication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: src/BE/WorkslipApi
        run: dotnet restore Workslip.slnx

      - name: Build
        working-directory: src/BE/WorkslipApi
        run: dotnet build Workslip.slnx --configuration Release --no-restore

      - name: Run configuration regression tests
        working-directory: src/BE/WorkslipApi
        run: dotnet test Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~InfrastructureConfigurationTests
