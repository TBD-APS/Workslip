name: Build and deploy Workslip API to Azure

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Azure Web App name'
        required: false
        default: 'api-npteknik-udv'
      environment:
        description: 'GitHub environment name'
        required: false
        default: 'udv'
  push:
    branches: [main]
    paths:
      - 'src/BE/WorkslipApi/**'
      - '.github/workflows/azure-api-deploy.yml'

env:
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: src/BE/WorkslipApi/Workslip.Api.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish/api

permissions:
  contents: read

concurrency:
  group: azure-api-${{ github.event.inputs.environment || 'udv' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
    
      - name: Azure Login
        uses: Azure/login@v3.0.0
        
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }} --nologo

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore --nologo

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}" --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workslip-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'udv' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: workslip-api
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ github.event.inputs.app_name || 'api-npteknik-udv' }}
          package: ${{ env.PUBLISH_DIR }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
