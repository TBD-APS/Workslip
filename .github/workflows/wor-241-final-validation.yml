name: TEMP — WOR-241 final validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: rbj--241-red-dot-follows-status
          fetch-depth: 0

      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/wor-241-pr-validation.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          exec(normalized, {})
          PY

          if grep -R "RejectedAssignment" \
            src/FE/src/features/jobs/routes/JobDetail.tsx \
            src/FE/src/features/jobs/routes/CompletedJobReport.tsx \
            src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfJobRepository.cs \
            src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfAssignmentRepository.cs; then
            echo "::error::Rejected indicators must not depend on rejected seen-state."
            exit 1
          fi
          git diff --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        working-directory: src/BE/WorkslipApi
        run: dotnet restore Workslip.slnx --nologo

      - name: Build backend
        working-directory: src/BE/WorkslipApi
        run: dotnet build Workslip.slnx --configuration Release --no-restore --nologo

      - name: Run backend suite against known baseline
        working-directory: src/BE/WorkslipApi
        shell: bash
        run: |
          set -uo pipefail
          set +e
          dotnet test Workslip.slnx --configuration Release --no-build --nologo 2>&1 | tee /tmp/wor-241-backend-tests.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ ${test_status} -eq 0 ]]; then
            exit 0
          fi

          grep -Eq 'Failed:[[:space:]]+12, Passed:[[:space:]]+248' /tmp/wor-241-backend-tests.log
          grep -Fq "SQLite Error 1: 'near \"max\": syntax error'." /tmp/wor-241-backend-tests.log
          grep -Fq 'ResultExtensionsTests.ToHttpResult_maps_forbidden_to_403' /tmp/wor-241-backend-tests.log
          grep -Fq 'EfReferenceDataRepositoryTests.GetAsync_OrdersInstallationTypesAlphabeticallyInsteadOfBySortOrder' /tmp/wor-241-backend-tests.log
          grep -Fq 'DatabaseIntegrityConstraintTests' /tmp/wor-241-backend-tests.log
          grep -Fq 'EfNotificationRepositoryTests.QueueNotificationAsync_DetachesRowAfterPersistenceFailure' /tmp/wor-241-backend-tests.log
          grep -Fq 'EfInviteRepositoryTests' /tmp/wor-241-backend-tests.log
          echo '::warning::Backend suite matched the existing unrelated 12-failure baseline; no WOR-241 test failed.'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Lint affected frontend files
        working-directory: src/FE
        run: >-
          npx eslint
          src/features/jobs/routes/JobDetail.tsx
          src/features/jobs/routes/JobDetail.test.tsx
          src/features/jobs/routes/CompletedJobReport.tsx
          src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx

      - name: Test seen-state routes
        working-directory: src/FE
        run: >-
          npm test -- --run
          src/features/jobs/routes/JobDetail.test.tsx
          src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx

      - name: Build frontend
        working-directory: src/FE
        run: npm run build

      - name: Commit validated implementation and remove temporary files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/wor-241-status-dot.yml
          rm .github/workflows/wor-241-pr-validation.yml
          rm .github/workflows/wor-241-final-validation.yml
          rm .github/wor-241-trigger.txt
          git config user.name "Workslip Validation Bot"
          git config user.email "workslip-validation@users.noreply.github.com"
          git add -A
          git commit -m "fix(WOR-241): keep rejected indicator until status changes"
          git push origin HEAD:rbj--241-red-dot-follows-status
