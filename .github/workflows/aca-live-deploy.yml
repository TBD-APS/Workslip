name: Deploy Workslip Live App (Container Apps)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: workslip-live-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Live App · Serverless Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: live
    env:
      AZURE_RESOURCE_GROUP: rg-mrsoftwarev2-live
      AZURE_LOCATION: swedencentral
      LIVE_SQL_SERVER: db-mrsoftwarev2-live-server
      LIVE_SQL_DATABASE: db-mrsoftwarev2-live
      LIVE_RUNTIME_IDENTITY: id-workslip-live-app
      LIVE_MIGRATION_IDENTITY: id-mrsoftwarev2-live-migration
      APP_CONFIG_ENDPOINT: https://appcs-mrsoftwarev2-live.azconfig.io
      INFRA_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
    steps:
      - name: Require main
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error::The production Workslip live-app may only be deployed from main. Selected ref: $GITHUB_REF"
            exit 1
          fi

      - name: Checkout exact selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js for production gate
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Require exact green main CI Gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          node tools/release/verify-production-eligibility.mjs --sha "$GITHUB_SHA"

      - name: Enforce expand-contract migration policy
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(git rev-parse HEAD^)"
          node tools/release/verify-migration-compatibility.mjs "$base" "$GITHUB_SHA"

      - name: Verify Azure bootstrap configuration
        shell: bash
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$INFRA_CLIENT_ID" ]] || missing+=(AZURE_INFRA_CLIENT_ID-or-AZURE_CLIENT_ID)
          [[ -n "$TENANT_ID" ]] || missing+=(AZURE_TENANT_ID)
          [[ -n "$SUBSCRIPTION_ID" ]] || missing+=(AZURE_SUBSCRIPTION_ID)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing Azure OIDC configuration on the live GitHub environment: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Azure login as infrastructure bootstrap identity
        uses: azure/login@v3
        with:
          client-id: ${{ env.INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate live-app Bicep
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in foundation.bicep runtimeDataAccess.bicep app.bicep; do
            az bicep build --file "src/BE/infrastructure/aca/$file" --stdout >/dev/null
          done

      - name: Verify existing live resource group boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          resource_group_id="$(az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query id \
            --output tsv)"
          [[ -n "$resource_group_id" && "$resource_group_id" != null ]] || {
            echo "::error::Expected live resource group '$AZURE_RESOURCE_GROUP' was not found. Initial resource-group bootstrap remains a privileged administrator operation."
            exit 1
          }

      - name: Resolve existing live shared resources
        id: shared
        shell: bash
        run: |
          set -Eeuo pipefail
          loganal_id="$(az monitor log-analytics workspace show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name logAnal-mrsoftwarev2-live \
            --query id --output tsv)"
          loganal_customer="$(az monitor log-analytics workspace show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name logAnal-mrsoftwarev2-live \
            --query customerId --output tsv)"
          keyvault_id="$(az keyvault show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name kv-mrsoftwarev2-live \
            --query id --output tsv)"
          appinsights_conn="$(az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name ai-mrsoftwarev2-live \
            --resource-type Microsoft.Insights/components \
            --api-version 2020-02-02 \
            --query properties.ConnectionString --output tsv)"
          sql_fqdn="$(az sql server show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$LIVE_SQL_SERVER" \
            --query fullyQualifiedDomainName --output tsv)"
          {
            echo "loganal_id=$loganal_id"
            echo "loganal_customer_id=$loganal_customer"
            echo "keyvault_id=$keyvault_id"
            echo "app_insights_connection_string=$appinsights_conn"
            echo "sql_server_fqdn=$sql_fqdn"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile live-app foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name workslip-live-app-foundation \
            --template-file src/BE/infrastructure/aca/foundation.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              logAnalyticsWorkspaceId='${{ steps.shared.outputs.loganal_id }}' \
              logAnalyticsWorkspaceCustomerId='${{ steps.shared.outputs.loganal_customer_id }}' \
              keyVaultId='${{ steps.shared.outputs.keyvault_id }}' \
              keyVaultName='kv-mrsoftwarev2-live' \
              appConfigurationName='appcs-mrsoftwarev2-live' \
              storageAccountName='stmrsoftwarev2live' \
              githubOwner="$GITHUB_REPOSITORY_OWNER" \
              githubOwnerId="$GITHUB_REPOSITORY_OWNER_ID" \
              githubRepository="$repository_name" \
              githubRepositoryId="$GITHUB_REPOSITORY_ID" \
              githubEnvironment='live' \
            --only-show-errors \
            --output none

      - name: Resolve foundation outputs
        id: foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          output() {
            az deployment group show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name workslip-live-app-foundation \
              --query "properties.outputs.$1.value" \
              --output tsv
          }
          {
            echo "environment_name=$(output managedEnvironmentName)"
            echo "acr_id=$(output registryId)"
            echo "acr_name=$(output registryName)"
            echo "acr_login_server=$(output registryLoginServer)"
            echo "runtime_identity_name=$(output runtimeIdentityName)"
            echo "runtime_identity_id=$(output runtimeIdentityId)"
            echo "runtime_principal_id=$(output runtimeIdentityPrincipalId)"
            echo "runtime_client_id=$(output runtimeIdentityClientId)"
            echo "ci_client_id=$(output ciIdentityClientId)"
            echo "migration_client_id=$(az identity show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$LIVE_MIGRATION_IDENTITY" \
              --query clientId --output tsv)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify ACR managed-identity authentication
        shell: bash
        env:
          ACR_ID: ${{ steps.foundation.outputs.acr_id }}
          ACR_NAME: ${{ steps.foundation.outputs.acr_name }}
          RUNTIME_PRINCIPAL_ID: ${{ steps.foundation.outputs.runtime_principal_id }}
        run: |
          set -Eeuo pipefail

          admin_enabled="$(az acr show --name "$ACR_NAME" --query adminUserEnabled --output tsv)"
          if [[ "$admin_enabled" != 'false' ]]; then
            echo "::error::ACR admin credentials must remain disabled. Current adminUserEnabled=$admin_enabled"
            exit 1
          fi

          arm_auth="$(az acr config authentication-as-arm show --registry "$ACR_NAME" --query status --output tsv)"
          if [[ "$arm_auth" != 'enabled' ]]; then
            echo "::error::ACR ARM-audience authentication is '$arm_auth'; managed-identity image pulls require it to be enabled."
            exit 1
          fi

          assignment_count=0
          for attempt in {1..10}; do
            assignment_count="$(az role assignment list \
              --assignee "$RUNTIME_PRINCIPAL_ID" \
              --scope "$ACR_ID" \
              --role AcrPull \
              --query 'length(@)' \
              --output tsv)"
            if [[ "$assignment_count" =~ ^[0-9]+$ ]] && (( assignment_count > 0 )); then
              break
            fi
            sleep 3
          done

          if ! [[ "$assignment_count" =~ ^[0-9]+$ ]] || (( assignment_count < 1 )); then
            echo "::error::Runtime managed identity does not have AcrPull on $ACR_NAME."
            exit 1
          fi

      - name: Allow new federated identities to propagate
        shell: bash
        run: sleep 20

      - name: Logout infrastructure bootstrap identity
        shell: bash
        run: az logout

      - name: Azure login as dedicated live-app deployment identity
        uses: azure/login@v3
        with:
          client-id: ${{ steps.foundation.outputs.ci_client_id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable live-app API image in ACR
        shell: bash
        run: |
          set -Eeuo pipefail
          az acr build \
            --registry '${{ steps.foundation.outputs.acr_name }}' \
            --image "workslip-live-app-api:$GITHUB_SHA" \
            --file src/BE/WorkslipApi/Dockerfile \
            .

      - name: Build immutable live-app frontend image in ACR
        shell: bash
        env:
          VITE_AZURE_AD_TENANT_ID: ${{ secrets.VITE_AZURE_AD_TENANT_ID }}
          VITE_AZURE_AD_CLIENT_ID: ${{ secrets.VITE_AZURE_AD_CLIENT_ID }}
          VITE_AZURE_AD_SCOPE: ${{ secrets.VITE_AZURE_AD_SCOPE }}
          VITE_AZURE_AD_LOGIN_REDIRECT_URI: ${{ secrets.VITE_AZURE_AD_LOGIN_REDIRECT_URI }}
        run: |
          set -Eeuo pipefail
          for v in VITE_AZURE_AD_TENANT_ID VITE_AZURE_AD_CLIENT_ID VITE_AZURE_AD_SCOPE VITE_AZURE_AD_LOGIN_REDIRECT_URI; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::Frontend build requires GitHub secret $v (Microsoft login configuration)."
              exit 1
            fi
          done
          az acr build \
            --registry '${{ steps.foundation.outputs.acr_name }}' \
            --image "workslip-live-app-frontend:$GITHUB_SHA" \
            --file src/FE/Dockerfile \
            --build-arg VITE_AZURE_AD_TENANT_ID="$VITE_AZURE_AD_TENANT_ID" \
            --build-arg VITE_AZURE_AD_CLIENT_ID="$VITE_AZURE_AD_CLIENT_ID" \
            --build-arg VITE_AZURE_AD_SCOPE="$VITE_AZURE_AD_SCOPE" \
            --build-arg VITE_AZURE_AD_LOGIN_REDIRECT_URI="$VITE_AZURE_AD_LOGIN_REDIRECT_URI" \
            src/FE

      - name: Logout deployment identity before database mutation
        shell: bash
        run: az logout

      - name: Azure login as dedicated live migration identity
        uses: azure/login@v3
        with:
          client-id: ${{ steps.foundation.outputs.migration_client_id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install SQL migration tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Install-Module SqlServer -Scope CurrentUser -Repository PSGallery -Force -AllowClobber
          }
          Import-Module SqlServer -ErrorAction Stop
          Get-Command Invoke-Sqlcmd -ErrorAction Stop | Out-Null

      - name: Apply pending reviewed live database migrations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./src/BE/infrastructure/run-database-migrations.ps1 `
            -Environment live `
            -CompanyName mrsoftwarev2

      - name: Grant runtime identity least-privilege database roles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./src/BE/infrastructure/aca/configure-live-app-database-access.ps1 `
            -CompanyName mrsoftwarev2 `
            -Environment live `
            -RuntimeIdentityName '${{ steps.foundation.outputs.runtime_identity_name }}' `
            -RuntimePrincipalId '${{ steps.foundation.outputs.runtime_principal_id }}'

      - name: Logout live migration identity
        shell: bash
        run: az logout

      - name: Azure login as dedicated live-app deployment identity for release
        uses: azure/login@v3
        with:
          client-id: ${{ steps.foundation.outputs.ci_client_id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy live-app Container App revision
        id: app
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ steps.foundation.outputs.acr_login_server }}
          APP_INSIGHTS_CONNECTION_STRING: ${{ steps.shared.outputs.app_insights_connection_string }}
        run: |
          set -Eeuo pipefail
          frontend_image="$ACR_LOGIN_SERVER/workslip-live-app-frontend:$GITHUB_SHA"
          api_image="$ACR_LOGIN_SERVER/workslip-live-app-api:$GITHUB_SHA"

          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name workslip-live-app \
            --template-file src/BE/infrastructure/aca/app.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              containerAppsEnvironmentName='${{ steps.foundation.outputs.environment_name }}' \
              containerRegistryName='${{ steps.foundation.outputs.acr_name }}' \
              runtimeIdentityName='${{ steps.foundation.outputs.runtime_identity_name }}' \
              frontendImage="$frontend_image" \
              apiImage="$api_image" \
              appConfigEndpoint="$APP_CONFIG_ENDPOINT" \
              applicationInsightsConnectionString="$APP_INSIGHTS_CONNECTION_STRING" \
              sqlServerName="$LIVE_SQL_SERVER" \
              sqlServerFqdn='${{ steps.shared.outputs.sql_server_fqdn }}' \
              sqlDatabaseName="$LIVE_SQL_DATABASE" \
              storageAccountName='stmrsoftwarev2live' \
              apiEnvironment='Production' \
            --only-show-errors \
            --output none

          fqdn="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name workslip-live-app \
            --query properties.outputs.containerAppFqdn.value \
            --output tsv)"
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Verify Container App registry identity
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ steps.foundation.outputs.acr_login_server }}
          EXPECTED_RUNTIME_ID: ${{ steps.foundation.outputs.runtime_identity_id }}
        run: |
          set -Eeuo pipefail
          registry_identity="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name ca-workslip-live-app \
            --query "properties.configuration.registries[?server=='$ACR_LOGIN_SERVER'].identity | [0]" \
            --output tsv)"

          if [[ "$registry_identity" != "$EXPECTED_RUNTIME_ID" ]]; then
            echo "::error::Container App registry auth is not bound to the expected runtime managed identity. Expected '$EXPECTED_RUNTIME_ID', got '$registry_identity'."
            exit 1
          fi

      - name: Smoke-test public live-app frontend and API
        shell: bash
        env:
          LIVE_URL: ${{ steps.app.outputs.url }}
        run: bash tools/release/post-deploy-smoke.sh "$LIVE_URL"

      - name: Publish live-app handoff
        shell: bash
        env:
          LIVE_URL: ${{ steps.app.outputs.url }}
          LIVE_FQDN: ${{ steps.app.outputs.fqdn }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Workslip live-app (serverless) deployed

          - Revision: \`$GITHUB_SHA\`
          - Azure URL: $LIVE_URL
          - Hostname: \`$LIVE_FQDN\`
          - Boundary: \`rg-mrsoftwarev2-live\` (uniquely named parallel ACA resources — App Service untouched)
          - Runtime identity: \`rg-mrsoftwarev2-live / $LIVE_RUNTIME_IDENTITY\`
          - Registry auth: managed identity + \`AcrPull\`; ACR admin credentials disabled
          - Database: pending reviewed migrations applied before release
          - Smoke: frontend \`/\` = 200, backend \`/health\` = 200, unauthenticated \`/api/auth/me\` = 401
          - Scale: 0→4 replicas, HTTP autoscale, scale-to-zero when idle
          EOF
