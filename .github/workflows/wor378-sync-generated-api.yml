name: WOR-378 Sync generated inventory API

on:
  push:
    branches:
      - rbj--378-qr-inventory

permissions:
  contents: write

concurrency:
  group: wor-378-generated-api
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v7
        with:
          ref: rbj--378-qr-inventory
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate branch-matched API client
        working-directory: src/FE
        run: npm run generate:api:local

      - name: Commit generated client only
        shell: bash
        run: |
          set -euo pipefail
          git add src/FE/src/api/generated
          if git diff --cached --quiet; then
            echo 'Generated client already current.'
            exit 0
          fi
          git config user.name 'Workslip API Generator'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'RBJ-378: regenerate inventory API client'
          git push origin HEAD:rbj--378-qr-inventory
