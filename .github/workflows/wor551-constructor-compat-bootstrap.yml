name: WOR-551 temporary constructor compatibility bootstrap

on:
  push:
    branches:
      - rbj--551-action-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--551-action-completion
      - name: Patch constructor compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/BE/WorkslipApi/Workslip.Application/Conversations/JobConversationService.cs')
          text = p.read_text()
          old = '''public sealed class JobConversationService(\n    IJobConversationRepository repository,\n    IJobService jobs,\n    IAssignmentRepository assignmentRepository,\n    IJobAssignmentService jobAssignmentService,\n    ICurrentUserContext currentUser,\n    INotificationService notifications,\n    IApplicationTransactionFactory transactionFactory) : IJobConversationService'''
          new = '''public sealed class JobConversationService(\n    IJobConversationRepository repository,\n    IJobService jobs,\n    IAssignmentRepository assignmentRepository,\n    ICurrentUserContext currentUser,\n    INotificationService notifications,\n    IApplicationTransactionFactory transactionFactory,\n    IJobAssignmentService? jobAssignmentService = null) : IJobConversationService'''
          if text.count(old) != 1:
              raise SystemExit('constructor declaration did not match exactly once')
          text = text.replace(old, new, 1)
          marker = '    private static readonly TimeSpan MaxReminderHorizon = TimeSpan.FromDays(365);\n'
          replacement = marker + '\n    private IJobAssignmentService JobAssignmentService => jobAssignmentService\n        ?? throw new InvalidOperationException("Conversation assignment actions require IJobAssignmentService.");\n'
          if text.count(marker) != 1:
              raise SystemExit('service property marker did not match exactly once')
          text = text.replace(marker, replacement, 1)
          text = text.replace('jobAssignmentService.AssignSelfAsync(', 'JobAssignmentService.AssignSelfAsync(')
          text = text.replace('jobAssignmentService.ValidateSelfAssignmentTargetAsync(', 'JobAssignmentService.ValidateSelfAssignmentTargetAsync(')
          p.write_text(text)
          PY
      - name: Remove bootstrap and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wor551-constructor-compat-bootstrap.yml
          git add src/BE/WorkslipApi/Workslip.Application/Conversations/JobConversationService.cs
          git commit -m "RBJ-551: keep conversation service adapters compatible"
          git push origin HEAD:rbj--551-action-completion
