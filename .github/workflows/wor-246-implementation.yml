name: TEMP — WOR-246 implementation

on:
  push:
    branches: [rbj--246-user-completed-dot]
    paths:
      - '.github/workflows/wor-246-implementation.yml'
      - '.github/scripts/wor-246-apply.py'
      - '.github/wor-246-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    name: Apply completed-view fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: rbj--246-user-completed-dot

      - name: Apply implementation
        run: python3 .github/scripts/wor-246-apply.py

      - name: Commit implementation
        run: |
          set -Eeuo pipefail
          git diff --check
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No implementation changes were produced.'
            exit 1
          fi
          git config user.name 'workslip-validation-bot'
          git config user.email 'workslip-validation-bot@users.noreply.github.com'
          git add \
            Docs/architecture/domain-and-dataflows.md \
            src/BE/WorkslipApi/Workslip.Application/Jobs/JobService.cs \
            src/BE/WorkslipApi/Workslip.Application/Jobs/JobViewTypes.cs \
            src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfJobRepository.cs \
            src/BE/WorkslipApi/Workslip.Tests/Jobs/JobViewTypesTests.cs \
            src/FE/src/features/jobs/routes/CompletedJobReport.tsx \
            src/FE/src/features/jobs/routes/CompletedJobReport.seen-state.test.tsx \
            src/FE/src/features/jobs/utils/markJobSeen.ts
          git commit -m 'RBJ-246: show completed jobs as unread to assigned users'
          git push origin HEAD:rbj--246-user-completed-dot
