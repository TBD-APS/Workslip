name: SAAS'y baseline

# Inherited from TBD-APS/mr-saassy. The checks live there. This file only calls them.
# It does not copy the control-plane ruleset, the live environments, or auto-merge policy.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  schedule:
    - cron: '31 3 * * 0'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: saasy-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    uses: TBD-APS/mr-saassy/.github/workflows/reusable-pr-title.yml@main
  branch-hygiene:
    if: github.event_name == 'schedule'
    uses: TBD-APS/mr-saassy/.github/workflows/reusable-branch-hygiene.yml@main
