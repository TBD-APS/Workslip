name: Delivery · pipeline checkpoint

on:
  workflow_run:
    workflows: [CI, 'Deploy backend · Azure API']
    types: [in_progress, completed]

permissions:
  contents: read

# Preserve the source CI lifecycle order. A late Active event must never overwrite
# the completed outcome for the same GitHub run in the Control Center projection.
concurrency:
  group: delivery-ci-checkpoint-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish sanitized delivery checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run has access to repository secrets. Execute only the trusted
      # default-branch sender, never the PR or workflow-run head revision.
      - name: Checkout trusted delivery sender
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish Control Center checkpoint
        env:
          MR_SAASY_ACTIVITY_URL: ${{ vars.MR_SAASY_ACTIVITY_URL }}
          MR_SAASY_ACTIVITY_TOKEN: ${{ secrets.MR_SAASY_ACTIVITY_TOKEN }}
          MR_SAASY_CF_ACCESS_CLIENT_ID: ${{ secrets.MR_SAASY_CF_ACCESS_CLIENT_ID }}
          MR_SAASY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.MR_SAASY_CF_ACCESS_CLIENT_SECRET }}
        run: node tools/delivery/publish-control-center-checkpoint.mjs
