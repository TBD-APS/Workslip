name: WOR-107 Platform Superadmin Validation

on:
  push:
    branches:
      - rbj--107-superadmin-organization-admin

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--107-superadmin-organization-admin
          fetch-depth: 0

      - name: Apply remaining nullable organization updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f"Replacement marker not found in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/BE/WorkslipApi/Workslip.Application/Invitations/InvitationService.cs',
              '            Guid organizationId;\n',
              '            Guid? organizationId;\n')

          replace(
              'src/BE/WorkslipApi/Workslip.Application/Organizations/OrganizationService.cs',
              '            admin.OrganizationId,\n            normalizedEmail,',
              '            organizationId,\n            normalizedEmail,')

          replace(
              'src/BE/WorkslipApi/Workslip.Application/Organizations/OrganizationService.cs',
              '        user.OrganizationId,\n        user.DisplayName,',
              '        user.OrganizationId ?? throw new InvalidOperationException("Organization administrator must belong to an organization."),\n        user.DisplayName,')

          replace(
              'src/BE/WorkslipApi/Workslip.Infrastructure/Schema/DevelopmentDatabaseSeeder.cs',
              '            await DatabaseSchemaInitializer.EnsureUserRoleOrganizationScopeConstraintAsync(\n                db,\n                cancellationToken);',
              '            if (db.Database.IsRelational())\n            {\n                await DatabaseSchemaInitializer.EnsureUserRoleOrganizationScopeConstraintAsync(\n                    db,\n                    cancellationToken);\n            }')

          replace(
              'src/BE/WorkslipApi/Workslip.Tests/Infrastructure/DevelopmentDatabaseSeederTests.cs',
              '        Assert.Equal(organization.Id, rasmus.OrganizationId);',
              '        Assert.Null(rasmus.OrganizationId);')

          replace(
              'src/BE/WorkslipApi/Workslip.Tests/Infrastructure/DevelopmentDatabaseSeederTests.cs',
              '        Assert.Equal(organization.Id, mahad.OrganizationId);',
              '        Assert.Null(mahad.OrganizationId);')
          PY

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        working-directory: src/BE/WorkslipApi
        run: dotnet restore Workslip.slnx

      - name: Build backend
        working-directory: src/BE/WorkslipApi
        run: dotnet build Workslip.slnx --configuration Release --no-restore

      - name: Run focused backend tests
        working-directory: src/BE/WorkslipApi
        run: >-
          dotnet test Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~DevelopmentDatabaseSeederTests|FullyQualifiedName~AuthServiceEntraLoginTests|FullyQualifiedName~Organization"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Build frontend
        working-directory: src/FE
        run: npm run build

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/wor-107-platform-superadmin-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "WOR-107 make Superadmins platform scoped"
          git push origin HEAD:rbj--107-superadmin-organization-admin
