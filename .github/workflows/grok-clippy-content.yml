name: Grok Clippy Content

on:
  push:
    branches:
      - chore/grok-clippy-content
    paths:
      - .github/workflows/grok-clippy-content.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.XAI_REVIEW_MODEL || 'grok-4.6' }}
    steps:
      - name: Generate Clippy content with Grok
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${XAI_API_KEY:-}" ]; then
            echo "::error::XAI_API_KEY is not configured"
            exit 1
          fi

          cat > /tmp/request.mjs <<'NODE'
          import fs from 'node:fs';

          const endpoint = 'https://api.x.ai/v1/chat/completions';
          const apiKey = process.env.XAI_API_KEY;
          const model = process.env.XAI_MODEL || 'grok-4.6';

          const system = `You are the product copywriter for Workslip Clippy 2.0, the contextual paperclip mascot/helper already implemented in Workslip.

Current product behavior:
- Clippy is collapsed and quiet by default; clicking currently only shows "Skal jeg hjælpe?".
- Clippy can move to stable UI targets, point at them, react with attention/success/warning/thinking, and return home.
- Success events can trigger a celebration and return home.
- Validation errors can move Clippy to the actual invalid field and point at it.
- It must never auto-scroll the page or become an interruptive product tour.
- Mobile and desktop are both first-class.

Workslip audience:
- Danish tradespeople and office/admin staff in VVS, electrical, carpentry and similar businesses.
- The language should be ordinary Danish: short, practical and memorable, not corporate SaaS copy.
- Clippy may be a little cheeky/funny, but never childish, patronizing or noisy.
- Help users discover useful features and explain what to do next.
- Do not invent functionality that Workslip does not have.

Return only valid JSON with this shape:
{
  "persona": {"name":"Clippy","oneLiner":"...","voiceRules":["..."]},
  "launcher": {"collapsedLabel":"...","openGreeting":"...","dismissLabel":"..."},
  "firstRun": [{"id":"...","headline":"...","body":"...","cta":"..."}],
  "contextual": [
    {"surface":"overview|jobs|job-form|worksheets|timer|customers|docs|search|notifications|profile","trigger":"...","headline":"...","body":"...","cta":"..."}
  ],
  "reactions": {
    "success":["..."],
    "warning":["..."],
    "thinking":["..."],
    "attention":["..."]
  },
  "validation": {
    "fieldError":["..."],
    "formError":["..."]
  },
  "emptyStates": [
    {"surface":"...","headline":"...","body":"...","cta":"..."}
  ]
}

Write 5 first-run messages, at least 20 contextual messages, 10 lines per reaction array, 10 field-error lines, 8 form-error lines, and at least 8 empty-state helpers. Keep headlines under 45 characters and bodies under 170 characters. Avoid repeating the same joke or catchphrase.`;

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${apiKey}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              model,
              temperature: 0.75,
              messages: [
                { role: 'system', content: system },
                { role: 'user', content: 'Create the complete Workslip Clippy 2.0 content bundle now.' },
              ],
              response_format: { type: 'json_object' },
            }),
          });

          if (!response.ok) {
            throw new Error(`Grok returned HTTP ${response.status}: ${(await response.text()).slice(0, 1200)}`);
          }

          const payload = await response.json();
          const raw = payload?.choices?.[0]?.message?.content;
          if (!raw) throw new Error('Grok returned no content');
          const parsed = JSON.parse(raw);
          fs.writeFileSync('clippy-content.json', JSON.stringify(parsed, null, 2));
          console.log(`Generated Workslip Clippy content with ${model}`);
          NODE

          node /tmp/request.mjs

      - name: Persist generated content on isolated branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('clippy-content.json', 'utf8');
            const path = 'tmp/grok-clippy-content.json';
            const branch = 'chore/grok-clippy-content';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: 'Chore: store generated Grok Clippy content',
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
            });

      - name: Upload Clippy content
        uses: actions/upload-artifact@v4
        with:
          name: grok-clippy-content
          path: clippy-content.json
          retention-days: 3
