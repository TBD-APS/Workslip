name: WOR-89 modal validation

on:
  pull_request:
    branches:
      - rbj--89-modal-validation-base
    paths:
      - 'src/FE/**'
      - '.github/workflows/wor-89-modal-validation.yml'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Generate frontend API client
        working-directory: src/FE
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Lint affected frontend file
        working-directory: src/FE
        run: npx eslint src/features/jobs/routes/CompletedJobReport.tsx

      - name: Build frontend
        working-directory: src/FE
        run: npm run build

      - name: Install temporary Playwright dependencies
        working-directory: src/FE/e2e-wor89-modal
        run: npm install --no-package-lock

      - name: Install Chromium
        working-directory: src/FE/e2e-wor89-modal
        run: npx playwright install --with-deps chromium

      - name: Run WOR-89 modal browser scenarios
        working-directory: src/FE/e2e-wor89-modal
        run: npm test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wor-89-modal-playwright-diagnostics
          path: |
            src/FE/e2e-wor89-modal/playwright-report
            src/FE/e2e-wor89-modal/test-results
          if-no-files-found: ignore
          retention-days: 7
