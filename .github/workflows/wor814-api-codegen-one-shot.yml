name: WOR-814 API codegen one-shot

on:
  push:
    branches:
      - rbj--814-auditor-v1

permissions:
  contents: write

jobs:
  codegen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--814-auditor-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate branch-matched API client
        run: |
          set -Eeuo pipefail
          dotnet restore src/BE/WorkslipApi/Workslip.Api.csproj --nologo
          cd src/FE
          node scripts/generate-api-client.mjs --no-restore
      - name: Commit generated client and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FE/src/api/generated
          git rm .github/workflows/wor814-api-codegen-one-shot.yml
          git commit -m 'WOR-814: generate branch-matched API client'
          git push origin HEAD:rbj--814-auditor-v1
