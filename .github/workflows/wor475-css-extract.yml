name: WOR-475 app shell CSS extraction

on:
  push:
    branches:
      - rbj--475-app-css-shell-boundary

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--475-app-css-shell-boundary
          fetch-depth: 0

      - name: Move shell CSS to layout ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          app_path = Path('src/FE/src/App.css')
          shell_path = Path('src/FE/src/components/layouts/AppLayout.shell.css')
          focus_path = Path('src/FE/src/components/layouts/AppLayout.focus.css')
          desktop_path = Path('src/FE/src/components/layouts/AppLayout.desktop.css')
          budget_path = Path('src/FE/scripts/check-app-css-budget.mjs')

          source = app_path.read_text(encoding='utf-8-sig')

          def extract(text: str, start: str, end: str):
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              block = text[start_index:end_index].rstrip() + '\n'
              remaining = text[:start_index] + text[end_index:]
              return remaining, block

          source, shell_header = extract(
              source,
              '/* App Shell Layout (Mobile First) */',
              '\n.user-avatar {'
          )
          source, shell_content = extract(
              source,
              '\n.app-content {',
              '\n/* Job List Components */'
          )

          shell_source = '''@charset "UTF-8";\n\n/*\n * AppLayout-owned mobile-first shell, navigation and safe-area behavior.\n * Desktop refinements live in AppLayout.desktop.css; focus/keyboard rules\n * live in AppLayout.focus.css. Keep feature and shared-component styling out.\n */\n\n''' + shell_header + '\n' + shell_content

          assert '.app-shell {' in shell_source
          assert '.app-header {' in shell_source
          assert '.bottom-nav {' in shell_source
          assert '.fab-create {' in shell_source
          assert '.profile-edit-actions' not in shell_source
          assert '/* Job List Components */' in source
          assert '/* App Shell Layout (Mobile First) */' not in source

          app_path.write_text(source, encoding='utf-8')
          shell_path.write_text(shell_source, encoding='utf-8')

          focus = focus_path.read_text(encoding='utf-8')
          desktop_import = "@import './AppLayout.desktop.css';"
          shell_import = "@import './AppLayout.shell.css';"
          if shell_import not in focus:
              focus = focus.replace(desktop_import, f"{shell_import}\n{desktop_import}", 1)
          focus_path.write_text(focus, encoding='utf-8')

          desktop = desktop_path.read_text(encoding='utf-8')
          desktop = desktop.replace(
              'Desktop refinements that build on the existing responsive rules in App.css.\n * Keep narrow/mobile behaviour in the mobile-first stylesheet and only tighten',
              'Desktop refinements that build on AppLayout.shell.css.\n * Keep narrow/mobile shell behaviour in the mobile-first layout stylesheet and only tighten'
          )
          desktop = desktop.replace(
              '/* App.css already moves the existing navigation above the content on desktop.\n     Refine that same markup instead of introducing a second navigation model. */',
              '/* Refine the same AppLayout navigation markup instead of introducing a second navigation model. */'
          )
          desktop_path.write_text(desktop, encoding='utf-8')

          size = len(source.encode('utf-8'))
          new_ceiling = math.ceil(size / 1000) * 1000
          budget = budget_path.read_text(encoding='utf-8')
          budget, replacements = re.subn(
              r'const MAX_APP_CSS_BYTES = [0-9_]+;',
              f'const MAX_APP_CSS_BYTES = {new_ceiling:_};',
              budget,
              count=1,
          )
          assert replacements == 1
          budget_path.write_text(budget, encoding='utf-8')
          print(f'App.css reduced to {size} bytes; migration ceiling -> {new_ceiling} bytes')
          PY

      - name: Remove temporary bootstrap workflow
        run: rm .github/workflows/wor475-css-extract.yml

      - name: Commit deterministic extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FE/src/App.css \
                  src/FE/src/components/layouts/AppLayout.shell.css \
                  src/FE/src/components/layouts/AppLayout.focus.css \
                  src/FE/src/components/layouts/AppLayout.desktop.css \
                  src/FE/scripts/check-app-css-budget.mjs \
                  .github/workflows/wor475-css-extract.yml
          git commit -m 'RBJ-475: move app shell CSS to layout ownership'
          git push origin HEAD:rbj--475-app-css-shell-boundary
