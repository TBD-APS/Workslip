name: WOR-545 rebase on current main

on:
  push:
    branches:
      - rbj--545-extract-job-transition-effects

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Rebase onto main
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git rebase origin/main
      - name: Refresh dependency evidence
        run: node tools/depmap/depmap.mjs
      - name: Validate backend
        run: dotnet test src/BE/WorkslipApi/Workslip.slnx -c Release
      - name: Remove temporary workflow and commit refreshed evidence
        run: |
          set -Eeuo pipefail
          rm .github/workflows/wor545-rebase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'RBJ-545: refresh dependency evidence after rebase'
          fi
          git push --force-with-lease origin HEAD:rbj--545-extract-job-transition-effects
