name: TEMP — WOR-245 rejection notification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wor-245-implementation.yml'
      - 'tools/temp-wor-245-apply.py'
      - 'src/BE/WorkslipApi/**'
      - 'Docs/architecture/domain-and-dataflows.md'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: rbj--245-harden-rejection-notification
          fetch-depth: 0

      - name: Apply deterministic product patch
        run: python3 tools/temp-wor-245-apply.py

      - name: Verify scope and obsolete dependency removal
        run: |
          git diff --check
          if grep -n "GetEventsAsync(id, organizationId.Value, 100" src/BE/WorkslipApi/Workslip.Application/Jobs/JobService.cs; then
            echo '::error::Rejection still depends on paginated presentation history.'
            exit 1
          fi
          grep -q 'SubmittedByUserId' src/BE/WorkslipApi/Workslip.Domain/Models/JobReportRow.cs
          grep -q 'FK_JobReports_Users_OrganizationId_SubmittedByUserId' src/BE/WorkslipApi/Workslip.Infrastructure/Schema/DatabaseIntegrityConstraintsSql.cs

      - name: Commit product changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'workslip-validation-bot'
          git config user.email 'workslip-validation-bot@users.noreply.github.com'
          git add \
            src/BE/WorkslipApi/Workslip.Domain/Models/JobReportRow.cs \
            src/BE/WorkslipApi/Workslip.Application/Jobs/JobContracts.cs \
            src/BE/WorkslipApi/Workslip.Application/Jobs/JobService.cs \
            src/BE/WorkslipApi/Workslip.Infrastructure/Repositories/EfJobRepository.cs \
            src/BE/WorkslipApi/Workslip.Infrastructure/Schema/SqlDbContext.cs \
            src/BE/WorkslipApi/Workslip.Infrastructure/Schema/DatabaseSchemaInitializer.cs \
            src/BE/WorkslipApi/Workslip.Infrastructure/Schema/DatabaseIntegrityConstraintsSql.cs \
            src/BE/WorkslipApi/Workslip.Tests/Jobs/JobRejectionNotificationTests.cs \
            Docs/architecture/domain-and-dataflows.md
          git commit -m 'RBJ-245: persist rejection notification recipient'
          git push origin HEAD:rbj--245-harden-rejection-notification

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend tests
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj

      - name: Build backend Release
        run: >-
          dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run focused rejection tests
        run: >-
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --filter FullyQualifiedName~JobRejectionNotificationTests

      - name: Verify final diff hygiene
        run: git diff --check origin/main...HEAD
