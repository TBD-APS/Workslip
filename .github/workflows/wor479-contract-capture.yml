name: WOR-479 · Temporary stacked validation

on:
  push:
    branches:
      - rbj--479-auditor-visibility

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  BACKEND_SOLUTION: src/BE/WorkslipApi/Workslip.slnx
  STACK_BASE_SHA: 621725dbad5e863f747ced56a69f3931e45598cc

jobs:
  backend:
    name: Backend Release build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${BACKEND_SOLUTION}" --nologo

      - name: Build
        run: dotnet build "${BACKEND_SOLUTION}" --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test "${BACKEND_SOLUTION}" --configuration Release --no-build --nologo

  frontend:
    name: Frontend and branch API contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        working-directory: src/FE
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Capture current lint findings
        working-directory: src/FE
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          npm run lint -- --format json --output-file "${RUNNER_TEMP}/eslint-current.json"
          status=$?
          set -e
          [[ "${status}" -le 1 ]]

      - name: Capture stack-base lint findings
        shell: bash
        run: |
          set -Eeuo pipefail
          base_dir="${RUNNER_TEMP}/wor479-lint-base"
          cleanup() { git worktree remove --force "${base_dir}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git cat-file -e "${STACK_BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${STACK_BASE_SHA}"
          git worktree add --detach "${base_dir}" "${STACK_BASE_SHA}"
          cd "${base_dir}/src/FE"
          npm ci --prefer-offline --no-audit --no-fund
          set +e
          npm run lint -- --format json --output-file "${RUNNER_TEMP}/eslint-base.json"
          status=$?
          set -e
          [[ "${status}" -le 1 ]]

      - name: Block new lint errors
        working-directory: src/FE
        run: node scripts/compare-eslint-results.mjs "${RUNNER_TEMP}/eslint-base.json" "${RUNNER_TEMP}/eslint-current.json"

      - name: Generate branch-matched API client
        uses: ./.github/actions/generate-frontend-api

      - name: Test
        working-directory: src/FE
        run: npm run test -- --run

      - name: Build
        working-directory: src/FE
        run: npm run build

  contracts:
    name: Migration and docs validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate database migration sources
        shell: pwsh
        run: ./src/BE/infrastructure/run-database-migrations.ps1 -Environment prod -ValidateOnly

      - name: Validate documentation
        run: python tools/docs/check_docs.py
