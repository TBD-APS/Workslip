name: WOR-551 temporary reorder Postman conversation coverage

on:
  push:
    branches:
      - rbj--551-conversations-actions-v1

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--551-conversations-actions-v1
          fetch-depth: 0
      - name: Move conversation HTTP regression before job cleanup
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('src/BE/WorkslipApi/Postman/postman_collection.json')
          collection = json.loads(path.read_text())
          items = collection.get('item', [])
          conversation = next((item for item in items if item.get('name') == 'Job Conversations'), None)
          if conversation is None:
              raise SystemExit('Job Conversations folder not found')

          reordered = [item for item in items if item.get('name') != 'Job Conversations']
          jobs_index = next((index for index, item in enumerate(reordered) if item.get('name') == 'Jobs'), None)
          if jobs_index is None:
              raise SystemExit('Jobs folder not found')

          reordered.insert(jobs_index + 1, conversation)
          collection['item'] = reordered
          path.write_text(json.dumps(collection, ensure_ascii=False, indent=2) + '\n')
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/wor551-reorder-postman.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RBJ-551: run conversation HTTP checks before job cleanup"
          git push origin HEAD:rbj--551-conversations-actions-v1
