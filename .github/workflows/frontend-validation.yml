name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  BACKEND_SOLUTION: src/BE/WorkslipApi/Workslip.slnx
  BACKEND_TEST_PROJECT: src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${BACKEND_SOLUTION}" --nologo

      - name: Build
        run: dotnet build "${BACKEND_SOLUTION}" --configuration Release --no-restore --nologo

      - name: Test merge-critical backend boundaries
        run: >-
          dotnet test "${BACKEND_TEST_PROJECT}"
          --configuration Release
          --no-build
          --nologo
          --filter "FullyQualifiedName~DatabaseStartupTests|FullyQualifiedName~InfrastructureConfigurationTests|FullyQualifiedName~AuthenticationConfigurationTests|FullyQualifiedName~EfOrganizationRepositoryOnboardingTests|FullyQualifiedName~UserServiceAuthorizationTests|FullyQualifiedName~AuthorizedJobServiceTests|FullyQualifiedName~AuditorDataScopeTests|FullyQualifiedName~AuditorCacheIsolationTests"

      - name: Inventory full backend suite debt
        continue-on-error: true
        run: >-
          dotnet test "${BACKEND_SOLUTION}"
          --configuration Release
          --no-build
          --nologo

  frontend:
    name: Frontend + API contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/FE
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test lint debt comparator
        run: node --test scripts/compare-eslint-results.test.mjs

      - name: Resolve lint baseline
        id: lint-base
        shell: bash
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
          fi

          if [[ ! "${base_sha}" =~ ^[0-9a-fA-F]{40}$ || "${base_sha}" =~ ^0{40}$ ]]; then
            echo "::error::Unable to resolve a valid lint baseline SHA."
            exit 1
          fi

          echo "sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Capture current lint findings
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          npm run lint -- --format json --output-file "${RUNNER_TEMP}/eslint-current.json"
          lint_status=$?
          set -e

          if [[ "${lint_status}" -gt 1 ]]; then
            echo "::error::ESLint failed to execute for the current revision (exit ${lint_status})."
            exit "${lint_status}"
          fi

      - name: Capture baseline lint findings
        shell: bash
        working-directory: .
        env:
          LINT_BASE_SHA: ${{ steps.lint-base.outputs.sha }}
        run: |
          set -Eeuo pipefail
          base_dir="${RUNNER_TEMP}/workslip-lint-base"

          cleanup() {
            git -C "${GITHUB_WORKSPACE}" worktree remove --force "${base_dir}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if ! git -C "${GITHUB_WORKSPACE}" cat-file -e "${LINT_BASE_SHA}^{commit}" 2>/dev/null; then
            git -C "${GITHUB_WORKSPACE}" fetch --no-tags origin "${LINT_BASE_SHA}"
          fi
          git -C "${GITHUB_WORKSPACE}" worktree add --detach "${base_dir}" "${LINT_BASE_SHA}"

          cd "${base_dir}/src/FE"
          npm ci --prefer-offline --no-audit --no-fund

          set +e
          npm run lint -- --format json --output-file "${RUNNER_TEMP}/eslint-base.json"
          lint_status=$?
          set -e

          if [[ "${lint_status}" -gt 1 ]]; then
            echo "::error::ESLint failed to execute for baseline ${LINT_BASE_SHA} (exit ${lint_status})."
            exit "${lint_status}"
          fi

      - name: Block new lint errors
        run: >-
          node scripts/compare-eslint-results.mjs
          "${RUNNER_TEMP}/eslint-base.json"
          "${RUNNER_TEMP}/eslint-current.json"

      - name: Generate branch-matched API client
        uses: ./.github/actions/generate-frontend-api

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  contracts:
    name: Contracts + docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate production release policy
        run: |
          node --check tools/release/resolve-release-environment.mjs
          node --test tools/release/resolve-release-environment.test.mjs
          node tools/release/resolve-release-environment.mjs --environment production --require-runnable

      - name: Install lightweight Playwright runtime
        working-directory: src/FE
        run: >-
          npm install
          --prefix scripts
          --no-save
          --package-lock=false
          --ignore-scripts
          --no-audit
          --no-fund
          playwright@1.55.0

      - name: Validate Playwright sources
        working-directory: src/FE
        run: |
          node --check scripts/playwright-release-runner.mjs
          node --check scripts/playwright-prod-smoke.mjs
          node --check scripts/playwright-notification-navigation.mjs
          node --check scripts/playwright-critical-contract.mjs
          node --check scripts/playwright-critical-domain.mjs
          node --check scripts/playwright-scenarios-core.mjs
          node --check scripts/playwright-scenarios-admin.mjs
          node --check scripts/playwright-synthetic-auth.mjs
          node --test scripts/playwright-synthetic-auth.test.mjs

      - name: Validate Postman collection
        working-directory: src/FE
        run: >-
          node -e
          "JSON.parse(require('node:fs').readFileSync('../BE/WorkslipApi/Postman/postman_collection.json', 'utf8')); console.log('Postman collection JSON OK');"

      - name: Validate documentation
        run: python tools/docs/check_docs.py

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - backend
      - frontend
      - contracts
    steps:
      - name: Verify required checks
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          set -Eeuo pipefail

          if [[ "${BACKEND_RESULT}" != 'success' ||
                "${FRONTEND_RESULT}" != 'success' ||
                "${CONTRACTS_RESULT}" != 'success' ]]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi

          echo "All required CI checks succeeded."
