name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - rbj--622-playwright-coverage
      - 'release-*'
      - 'release/**'
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - 'release-*'
      - 'release/**'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  BACKEND_SOLUTION: src/BE/WorkslipApi/Workslip.slnx
  PLAYWRIGHT_VERSION: '1.55.0'

jobs:
  changes:
    name: Detect impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      integration: ${{ steps.detect.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect affected areas
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # Main/release pushes and merge-group candidates remain full regression gates.
          # Impact routing only shortens PR feedback; uncertainty always falls back
          # to the full suite.
          if [[ "${EVENT_NAME}" != 'pull_request' ]]; then
            printf 'code=true\nbackend=true\nfrontend=true\nintegration=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${PR_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            printf 'code=true\nbackend=true\nfrontend=true\nintegration=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          files="$(git diff --name-only "${base}" "${HEAD_SHA}")"
          printf '%s\n' "${files}"
          code=false; backend=false; frontend=false; integration=false
          while IFS= read -r f; do
            [[ -z "${f}" ]] && continue
            case "${f}" in
              *.md|*.markdown|*.mdx|*.txt|*.rst|*.adoc|Docs/*|docs/*|LICENSE|CHANGELOG*) continue ;;
            esac
            code=true
            case "${f}" in
              src/BE/*|Directory.*|global.json|NuGet.config) backend=true; integration=true ;;
              src/FE/*) frontend=true; integration=true ;;
              .github/actions/generate-frontend-api/*) backend=true; frontend=true; integration=true ;;
              .github/workflows/frontend-validation.yml) backend=true; frontend=true; integration=true ;;
              *) backend=true; frontend=true; integration=true ;;
            esac
          done <<< "${files}"
          printf 'code=%s\nbackend=%s\nfrontend=%s\nintegration=%s\n' "$code" "$backend" "$frontend" "$integration" >> "${GITHUB_OUTPUT}"

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('src/BE/**/*.csproj', 'src/BE/**/*.props', 'src/BE/**/*.targets', 'Directory.*', 'global.json', 'NuGet.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
      - run: dotnet restore "${BACKEND_SOLUTION}" --nologo
      - run: dotnet build "${BACKEND_SOLUTION}" --configuration Release --no-restore --nologo
      - run: dotnet test "${BACKEND_SOLUTION}" --configuration Release --no-build --nologo

  frontend-lint:
    name: Frontend lint debt
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: node --test scripts/compare-eslint-results.test.mjs
      - name: Capture current lint findings
        shell: bash
        run: |
          set +e
          npm run lint -- --format json --output-file "${RUNNER_TEMP}/eslint-current.json"
          status=$?
          set -e
          [[ "$status" -le 1 ]] || exit "$status"
      - name: Capture baseline lint findings
        shell: bash
        working-directory: .
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git -C "${GITHUB_WORKSPACE}" cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git -C "${GITHUB_WORKSPACE}" rev-parse "${GITHUB_SHA}^")"
          fi

          base_dir="${RUNNER_TEMP}/workslip-lint-base"
          trap 'git -C "${GITHUB_WORKSPACE}" worktree remove --force "'"${base_dir}"'" >/dev/null 2>&1 || true' EXIT
          git -C "${GITHUB_WORKSPACE}" worktree add --detach "${base_dir}" "${BASE_SHA}"
          cd "${base_dir}/src/FE"
          npm ci --prefer-offline --no-audit --no-fund
          set +e
          npm run lint -- --format json --output-file "${RUNNER_TEMP}/eslint-base.json"
          status=$?
          set -e
          [[ "$status" -le 1 ]] || exit "$status"
      - run: node scripts/compare-eslint-results.mjs "${RUNNER_TEMP}/eslint-base.json" "${RUNNER_TEMP}/eslint-current.json"

  frontend-test:
    name: Frontend tests
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run test -- --run

  frontend-build:
    name: Frontend build + API contract
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('src/BE/**/*.csproj', 'src/BE/**/*.props', 'src/BE/**/*.targets', 'Directory.*', 'global.json', 'NuGet.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate branch-matched API client
        uses: ./.github/actions/generate-frontend-api
      - run: npm run build

  contracts:
    name: Contracts + docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Validate production release policy
        run: |
          node --check tools/release/resolve-release-environment.mjs
          node --test tools/release/resolve-release-environment.test.mjs
          node tools/release/resolve-release-environment.mjs --environment production --require-runnable
      - name: Validate database migration sources
        shell: pwsh
        run: ./src/BE/infrastructure/run-database-migrations.ps1 -Environment prod -ValidateOnly
      - name: Install lightweight Playwright runtime
        working-directory: src/FE
        run: npm install --prefix scripts --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Validate Playwright sources
        working-directory: src/FE
        run: |
          for f in scripts/playwright-*.mjs; do node --check "$f"; done
          node --test scripts/playwright-release-runner.test.mjs
          node --test scripts/playwright-scenarios-admin.test.mjs
          node --test scripts/playwright-synthetic-auth.test.mjs
          node --test scripts/playwright-ephemeral-auth.test.mjs
      - name: Validate hosted integration runner syntax
        run: |
          bash -n src/BE/WorkslipApi/Postman/run-hosted-integration.sh
          bash -n src/BE/WorkslipApi/Postman/run-integration-tests.sh
          bash -n src/FE/scripts/run-playwright-ephemeral.sh
          node -e "JSON.parse(require('node:fs').readFileSync('src/BE/WorkslipApi/Postman/postman_collection.json', 'utf8'));"
      - run: python tools/docs/check_docs.py

  postman:
    name: Postman integration (ephemeral)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('src/BE/**/*.csproj', 'src/BE/**/*.props', 'src/BE/**/*.targets', 'Directory.*', 'global.json', 'NuGet.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
      - run: bash src/BE/WorkslipApi/Postman/run-hosted-integration.sh
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: postman-integration-backend-${{ github.run_id }}
          path: ${{ runner.temp }}/workslip-postman-backend.log
          if-no-files-found: warn
          retention-days: 7

  playwright:
    name: Playwright integration (ephemeral)
    needs: changes
    if: >-
      needs.changes.outputs.integration == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('src/BE/**/*.csproj', 'src/BE/**/*.props', 'src/BE/**/*.targets', 'Directory.*', 'global.json', 'NuGet.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: bash src/FE/scripts/run-playwright-ephemeral.sh
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-integration-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workslip-playwright-backend.log
            ${{ runner.temp }}/workslip-playwright-frontend.log
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CI Gate' || 'CI Gate' }}
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, backend, frontend-lint, frontend-test, frontend-build, contracts, postman, playwright]
    steps:
      - name: Verify required checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          BACKEND_NEEDED: ${{ needs.changes.outputs.backend }}
          FRONTEND_NEEDED: ${{ needs.changes.outputs.frontend }}
          INTEGRATION_NEEDED: ${{ needs.changes.outputs.integration }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
          TEST_RESULT: ${{ needs.frontend-test.result }}
          BUILD_RESULT: ${{ needs.frontend-build.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          POSTMAN_RESULT: ${{ needs.postman.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: |
          set -Eeuo pipefail
          [[ "${CONTRACTS_RESULT}" == success ]] || { echo '::error::Contracts + docs failed.'; exit 1; }
          if [[ "${BACKEND_NEEDED}" == true ]]; then
            [[ "${BACKEND_RESULT}" == success && "${POSTMAN_RESULT}" == success ]] || { echo '::error::Backend/API validation failed.'; exit 1; }
          fi
          if [[ "${FRONTEND_NEEDED}" == true ]]; then
            [[ "${LINT_RESULT}" == success && "${TEST_RESULT}" == success && "${BUILD_RESULT}" == success ]] || { echo '::error::Frontend validation failed.'; exit 1; }
          fi
          if [[ "${INTEGRATION_NEEDED}" == true ]]; then
            if [[ "${EVENT_NAME}" == pull_request && "${PR_DRAFT}" == true ]]; then
              [[ "${PLAYWRIGHT_RESULT}" == skipped || "${PLAYWRIGHT_RESULT}" == success ]] || exit 1
            else
              [[ "${PLAYWRIGHT_RESULT}" == success ]] || { echo '::error::Exact-revision Playwright evidence failed.'; exit 1; }
            fi
          fi
          echo "CI Gate v2 passed (impact-routed, parallel deterministic checks, cached package/browser layers)."
