name: Patch WOR-190 permanent custom email deployment

on:
  push:
    branches:
      - rbj--190-infrastructure-deployment-hardening
    paths:
      - .github/workflows/patch-wor-190-custom-email.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--190-infrastructure-deployment-hardening
          fetch-depth: 0

      - name: Remove custom email activation toggle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding='utf-8', newline='\n')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return value.replace(old, new, 1)

          deploy_path = 'src/BE/infrastructure/deploy.ps1'
          deploy = read(deploy_path)
          deploy = replace_once(
              deploy,
              "    [Nullable[bool]]$ActivateCustomEmailDomain = $null,\n",
              '',
              'deploy.ps1 activation parameter',
          )
          deploy = replace_once(
              deploy,
              "    -ActivateCustomEmailDomain $ActivateCustomEmailDomain `\n",
              '',
              'deploy.ps1 activation forwarding',
          )
          write(deploy_path, deploy)

          infra_path = 'src/BE/infrastructure/deploy-infrastructure.ps1'
          infra = read(infra_path)
          infra = replace_once(
              infra,
              "    [Nullable[bool]]$ActivateCustomEmailDomain = $null,\n",
              '',
              'deploy-infrastructure activation parameter',
          )
          infra = replace_once(
              infra,
              """    $existingSender = Get-AppConfigurationValue -Key 'Azure:Acs:SenderAddress'
    $activateEmailDomain = if ($null -ne $ActivateCustomEmailDomain) {
        [bool]$ActivateCustomEmailDomain
    } else {
        $existingSender -eq 'noreply@mrsoftware.dk'
    }

""",
              '',
              'sender activation reconciliation',
          )
          infra = replace_once(
              infra,
              "            activateCustomEmailDomain = @{ value = $activateEmailDomain }\n",
              '',
              'Bicep activation deployment parameter',
          )
          write(infra_path, infra)

          bicep_path = 'src/BE/infrastructure/main.bicep'
          bicep = read(bicep_path)
          bicep = replace_once(
              bicep,
              """@description('Customer-managed ACS email domain. Keep activation disabled until Domain, SPF, DKIM and DKIM2 are verified.')
param customEmailDomainName string = 'mrsoftware.dk'
@description('Sender username used on the verified customer-managed email domain.')
param customEmailSenderUsername string = 'noreply'
@description('Links the customer-managed domain and switches Azure:Acs:SenderAddress to it. Enable only after DNS verification succeeds.')
param activateCustomEmailDomain bool = false
""",
              """@description('Verified customer-managed ACS email domain used by every deployment.')
param customEmailDomainName string = 'mrsoftware.dk'
@description('Sender username used on the verified customer-managed email domain.')
param customEmailSenderUsername string = 'noreply'
""",
              'custom email parameter block',
          )
          bicep = replace_once(
              bicep,
              """    acsConnectionString: keyVaultConfigs.outputs.acsConnectionStringSecretUri
    acsSenderAddress: activateCustomEmailDomain
      ? '${customEmailSenderUsername}@${customEmailDomainName}'
      : '${azureManagedSenderUsername.properties.username}@${azureManagedEmailDomain.properties.fromSenderDomain}'
""",
              """    acsConnectionString: keyVaultConfigs.outputs.acsConnectionStringSecretUri
    acsSenderAddress: '${customEmailSenderUsername}@${customEmailDomainName}'
""",
              'dynamic ACS sender selection',
          )
          bicep = replace_once(
              bicep,
              """    dataLocation: 'europe'
    linkedDomains: activateCustomEmailDomain
      ? [
          azureManagedEmailDomain.id
          customEmailDomain.id
        ]
      : [
          azureManagedEmailDomain.id
        ]
""",
              """    dataLocation: 'europe'
    linkedDomains: [
      customEmailDomain.id
    ]
""",
              'conditional ACS domain linking',
          )
          bicep = replace_once(
              bicep,
              """// Keep the Azure-managed domain linked as a rollback sender during rollout.
resource azureManagedEmailDomain 'Microsoft.Communication/emailServices/domains@2023-04-01' = {
  name: 'AzureManagedDomain'
  parent: emailService
  location: 'global'
  tags: tags
  properties: {
    domainManagement: 'AzureManaged'
  }
}

resource azureManagedSenderUsername 'Microsoft.Communication/emailServices/domains/senderUsernames@2023-03-31' = {
  parent: azureManagedEmailDomain
  name: 'DoNotReply'
  properties: {
    displayName: 'Workslip'
    username: 'DoNotReply'
  }
}

// The domain is provisioned before activation so Azure can expose its unique DNS
// verification records. Linking and sender creation remain gated until all four
// verification states are successful.
""",
              """// Production DNS verification is complete. The customer-managed domain and
// sender are part of every deployment and are not controlled by an operator flag.
""",
              'Azure-managed fallback resources',
          )
          bicep = replace_once(
              bicep,
              "resource customEmailSender 'Microsoft.Communication/emailServices/domains/senderUsernames@2023-04-01' = if (activateCustomEmailDomain) {\n",
              "resource customEmailSender 'Microsoft.Communication/emailServices/domains/senderUsernames@2023-04-01' = {\n",
              'conditional custom sender resource',
          )
          bicep = replace_once(
              bicep,
              """output ACS_CUSTOM_EMAIL_DOMAIN_ACTIVE bool      = activateCustomEmailDomain
output ACS_SENDER_ADDRESS string                = activateCustomEmailDomain
  ? '${customEmailSenderUsername}@${customEmailDomainName}'
  : '${azureManagedSenderUsername.properties.username}@${azureManagedEmailDomain.properties.mailFromSenderDomain}'
""",
              """output ACS_CUSTOM_EMAIL_DOMAIN_ACTIVE bool      = true
output ACS_SENDER_ADDRESS string                = '${customEmailSenderUsername}@${customEmailDomainName}'
""",
              'conditional ACS outputs',
          )
          write(bicep_path, bicep)

          readme_path = 'src/BE/infrastructure/README.md'
          readme = read(readme_path)
          readme = replace_once(
              readme,
              """## ACS custom sender activation

Custom-domain activation is preserved across deployments when no value is supplied. To change it explicitly for infrastructure only:

```powershell
.\deploy-infrastructure.ps1 prod -ActivateCustomEmailDomain $true
```

Do not activate until Domain, SPF, DKIM and DKIM2 are verified. See `../../../Docs/acs-email-setup.md`.
""",
              """## ACS custom sender

The verified `mrsoftware.dk` ACS email domain and `noreply@mrsoftware.dk` sender are part of every infrastructure deployment. There is no activation parameter or Azure-managed sender fallback in the deployment model.

DNS verification must remain valid for Domain, SPF, DKIM and DKIM2. See `../../../Docs/acs-email-setup.md` for maintenance and smoke-test procedures.
""",
              'infrastructure README ACS section',
          )
          write(readme_path, readme)

          adr_path = 'Docs/architecture/adr/0001-managed-identity-runtime-and-secret-lifecycle.md'
          adr = read(adr_path)
          adr = replace_once(
              adr,
              "Multiple overlapping wrapper scripts also made it unclear which deployment command an operator should run.\n",
              "Multiple overlapping wrapper scripts also made it unclear which deployment command an operator should run. The production ACS custom domain is now fully verified, so a deployment-time activation toggle would preserve obsolete rollout state and create configuration drift.\n",
              'ADR context',
          )
          adr = replace_once(
              adr,
              "10. The deployment-created OAuth application client secret is removed. Future server-side confidential-client flows require a separate ADR and scoped credential lifecycle.\n",
              "10. The deployment-created OAuth application client secret is removed. Future server-side confidential-client flows require a separate ADR and scoped credential lifecycle.\n11. Every Azure infrastructure deployment links the verified `mrsoftware.dk` ACS email domain, provisions `noreply`, and writes `noreply@mrsoftware.dk` to App Configuration. No activation parameter or Azure-managed sender fallback is retained.\n",
              'ADR custom email decision',
          )
          adr = replace_once(
              adr,
              "- Production execution, secret migration and smoke-test evidence remain operator responsibilities after merge.\n",
              "- The production custom email domain must remain verified; deployment no longer offers a fallback sender toggle.\n- Production execution, secret migration and smoke-test evidence remain operator responsibilities after merge.\n",
              'ADR consequence',
          )
          adr = replace_once(
              adr,
              "- Keep `deploy-safe.ps1` as a second full-deployment wrapper: rejected because overlapping entry points create operator ambiguity.\n",
              "- Keep `deploy-safe.ps1` as a second full-deployment wrapper: rejected because overlapping entry points create operator ambiguity.\n- Keep an ACS custom-domain activation parameter after DNS verification: rejected because permanent production configuration should be declarative and identical on every deployment.\n",
              'ADR rejected activation toggle',
          )
          write(adr_path, adr)

          acs_doc = """# ACS Email Setup

**Status:** Maintained  
**Owner:** Workslip  
**Source of truth:** `src/BE/infrastructure/main.bicep` and `Workslip.Infrastructure/AcsEmailService.cs`  
**Review cadence:** Review whenever the ACS email domain, DNS provider, sender address, or invitation flow changes.

## Purpose

Workslip sends invitations and one-time login codes through Azure Communication Services Email. Production sends as:

```text
Workslip <noreply@mrsoftware.dk>
```

ACS provides outbound delivery only. This setup does not require a mailbox, mail hosting, MX records, or WHOIS add-ons.

## Deployment model

Every Azure infrastructure deployment provisions and configures:

- the Communication Services resource `acs-<company>-<environment>`;
- the Email Communication Service `email-<company>-<environment>`;
- the verified customer-managed domain `mrsoftware.dk`;
- the `noreply` sender;
- the custom-domain link on Communication Services;
- `Azure:Acs:SenderAddress = noreply@mrsoftware.dk` in Azure App Configuration.

There is no custom-domain activation parameter and no Azure-managed sender fallback in the deployment scripts. The domain configuration is permanent production infrastructure.

For the production defaults:

```text
Resource group: rg-mrsoftware-prod
Email service: email-mrsoftware-prod
Domain: mrsoftware.dk
Sender: noreply@mrsoftware.dk
```

## DNS verification maintenance

The authoritative DNS zone must continue to satisfy all four Azure verification checks:

- `Domain`: ownership TXT record;
- `SPF`: sender-policy TXT record;
- `DKIM`: first CNAME record;
- `DKIM2`: second CNAME record.

Do not add MX records for this sender-only setup. If the DNS provider automatically appends `mrsoftware.dk`, enter only the host/name portion shown for that DNS zone.

The Azure CLI `communication` extension requires Azure CLI 2.67 or newer. Inspect the current verification records and states with:

```powershell
az communication email domain show `
  --resource-group rg-mrsoftware-prod `
  --email-service-name email-mrsoftware-prod `
  --domain-name mrsoftware.dk `
  --query "{records:properties.verificationRecords,states:properties.verificationStates}" `
  --output json
```

When DNS records are intentionally changed, initiate verification for each type:

```powershell
$verificationTypes = @('Domain', 'SPF', 'DKIM', 'DKIM2')

foreach ($verificationType in $verificationTypes) {
  az communication email domain initiate-verification `
    --resource-group rg-mrsoftware-prod `
    --email-service-name email-mrsoftware-prod `
    --domain-name mrsoftware.dk `
    --verification-type $verificationType

  if ($LASTEXITCODE -ne 0) {
    throw "ACS verification could not be started for $verificationType."
  }
}
```

## Application configuration

`AcsEmailService` reads:

```text
Azure:Acs:ConnectionString
Azure:Acs:SenderAddress
Azure:Acs:InviteBaseUrl
Azure:Acs:PLainHeaderText
Azure:Acs:PlainInviteText
Azure:Acs:HtmlInviteText
```

Bicep owns `Azure:Acs:SenderAddress`; manual App Configuration edits are overwritten by the next deployment. The required value is:

```text
noreply@mrsoftware.dk
```

The invitation base URL must continue to produce links under:

```text
https://app.mrsoftware.dk/invite/
```

## Post-deployment smoke test

1. Confirm Domain, SPF, DKIM and DKIM2 remain verified in Azure.
2. Send an invitation through the production Workslip UI to an external mailbox.
3. Confirm the visible sender is `Workslip <noreply@mrsoftware.dk>`.
4. Confirm the invitation link starts with `https://app.mrsoftware.dk/invite/`.
5. Complete the invitation flow and verify authenticated API access.
6. Request a one-time login code and confirm it uses the same sender.
7. Check ACS delivery status and Application Insights for failures or bounces.

## Failure and rollback policy

A broken DNS verification state is a production configuration fault, not a deployment mode. Repair the DNS records and re-run deployment. Do not reintroduce an activation toggle or manually make an Azure-managed sender the permanent configuration.

An emergency sender change requires a dedicated reviewed infrastructure change and matching documentation update.

## Troubleshooting

| Symptom | Likely cause | Correction |
|---|---|---|
| Domain verification is not successful | DNS record is missing, duplicated, or entered with the full zone twice | Compare authoritative DNS with `properties.verificationRecords` |
| SPF fails | Existing SPF policy conflicts or multiple SPF TXT records exist | Merge authorized senders into one SPF policy rather than publishing multiple SPF records |
| DKIM or DKIM2 fails | CNAME host or target was copied incorrectly | Recreate the exact selector record returned by Azure |
| `Invalid sender address` | Custom domain is not linked, sender was not created, or App Configuration is stale | Re-run infrastructure deployment and verify `Azure:Acs:SenderAddress` |
| Invitation arrives but link is wrong | `Azure:Acs:InviteBaseUrl` is stale | Set it to the production `app.mrsoftware.dk` invitation route and redeploy configuration |
"""
          write('Docs/acs-email-setup.md', acs_doc)

          forbidden = (
              'ActivateCustomEmailDomain',
              'activateCustomEmailDomain',
              'AzureManagedDomain',
              'DoNotReply',
          )
          checked = [
              deploy_path,
              infra_path,
              bicep_path,
              readme_path,
              adr_path,
              'Docs/acs-email-setup.md',
          ]
          failures = []
          for path in checked:
              content = read(path)
              for token in forbidden:
                  if token in content:
                      failures.append(f'{path}: {token}')
          if failures:
              raise SystemExit('Obsolete custom-email activation state remains:\n' + '\n'.join(failures))
          PY

          git diff --check

          pwsh -NoProfile -Command '
            $errors = $null
            foreach ($path in @(
              "src/BE/infrastructure/deploy.ps1",
              "src/BE/infrastructure/deploy-infrastructure.ps1"
            )) {
              [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) > $null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_ }
                exit 1
              }
            }
          '

          if command -v az >/dev/null 2>&1; then
            az bicep build --file src/BE/infrastructure/main.bicep --stdout >/dev/null
          fi

      - name: Commit focused correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-wor-190-custom-email.yml
          git add \
            src/BE/infrastructure/deploy.ps1 \
            src/BE/infrastructure/deploy-infrastructure.ps1 \
            src/BE/infrastructure/main.bicep \
            src/BE/infrastructure/README.md \
            Docs/acs-email-setup.md \
            Docs/architecture/adr/0001-managed-identity-runtime-and-secret-lifecycle.md
          git commit -m "RBJ-190 make custom email deployment permanent"
          git push origin HEAD:rbj--190-infrastructure-deployment-hardening
