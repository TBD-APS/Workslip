name: TEMP — Assistant Validation — WOR-232

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FE/src/components/layouts/AppLayout.tsx'
      - 'src/FE/src/components/layouts/AppLayout.auditor.test.tsx'
      - 'src/FE/src/features/auth/authenticatedDestination.ts'
      - 'src/FE/src/providers/AuthenticatedAppProvider.tsx'
      - 'src/FE/src/providers/permissions/permissions.ts'
      - 'src/FE/src/providers/roleDestination.test.ts'
      - 'src/FE/src/providers/sessionFeaturePolicy.ts'
      - 'src/FE/src/providers/sessionFeaturePolicy.test.ts'
      - '.github/workflows/wor-232-validation.yml'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  validate:
    name: Lint, test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate frontend API client
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Align legacy test fixtures with generated API model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixture_paths = [
              Path('src/components/layouts/AppLayout.desktopOnly.test.tsx'),
              Path('src/features/superadmin/components/DesktopOnlySuperadmin.test.tsx'),
          ]
          needle = "  role: 'Superadmin',\n"
          replacement = needle + "  roleDisplayName: 'Superadmin',\n"

          for fixture_path in fixture_paths:
              content = fixture_path.read_text(encoding='utf-8')
              if 'roleDisplayName:' in content:
                  continue
              if needle not in content:
                  raise SystemExit(f'Expected Superadmin fixture not found in {fixture_path}')
              fixture_path.write_text(
                  content.replace(needle, replacement, 1),
                  encoding='utf-8',
              )
          PY

      - name: Lint affected frontend files
        run: >-
          npx eslint
          src/components/layouts/AppLayout.tsx
          src/components/layouts/AppLayout.auditor.test.tsx
          src/features/auth/authenticatedDestination.ts
          src/providers/AuthenticatedAppProvider.tsx
          src/providers/permissions/permissions.ts
          src/providers/roleDestination.test.ts
          src/providers/sessionFeaturePolicy.ts
          src/providers/sessionFeaturePolicy.test.ts

      - name: Run focused regression tests
        run: >-
          npm test -- --run
          src/components/layouts/AppLayout.auditor.test.tsx
          src/providers/roleDestination.test.ts
          src/providers/sessionFeaturePolicy.test.ts

      - name: Build production frontend
        run: npm run build
