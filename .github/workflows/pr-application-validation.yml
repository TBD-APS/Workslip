name: Application Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BE/WorkslipApi/**'
      - 'src/FE/**'
      - '.github/workflows/pr-application-validation.yml'

permissions:
  contents: read

concurrency:
  group: application-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build API and test customer import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --nologo

      - name: Build
        run: dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-restore --nologo

      - name: Run customer import tests
        run: >-
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --nologo
          --filter "FullyQualifiedName~CustomerImportServiceTests|FullyQualifiedName~CustomerImportParserTests"
          --logger "console;verbosity=normal"

      - name: Record full test-suite status
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj \
            --configuration Release \
            --no-build \
            --nologo \
            --logger 'trx;LogFileName=application-tests.trx' \
            --logger 'console;verbosity=minimal' \
            > backend-full-suite.log 2>&1
          status=$?
          cat backend-full-suite.log
          exit $status

      - name: Upload full test-suite logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-full-suite-logs
          path: |
            backend-full-suite.log
            src/BE/WorkslipApi/Workslip.Tests/TestResults/application-tests.trx
          if-no-files-found: warn

  frontend:
    name: Check customer frontend source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Transpile changed customer pages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');
          const files = [
            'src/features/customers/routes/CreateCustomerPage.tsx',
            'src/features/customers/routes/CustomerDetail.tsx',
            'src/features/customers/routes/EditCustomerPage.tsx',
          ];
          let failed = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
              },
            });
            const diagnostics = result.diagnostics ?? [];
            if (diagnostics.length > 0) {
              failed = true;
              console.error(`${file}:`);
              for (const diagnostic of diagnostics) {
                console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n'));
              }
            }
          }
          if (failed) process.exit(1);
          console.log(`Transpiled ${files.length} customer pages successfully.`);
          NODE
