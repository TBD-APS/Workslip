name: Application Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BE/WorkslipApi/**'
      - 'src/FE/**'
      - '.github/workflows/pr-application-validation.yml'

permissions:
  contents: read

concurrency:
  group: application-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --nologo

      - name: Build
        run: dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-build --nologo --logger 'console;verbosity=normal'

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
