name: Application Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BE/WorkslipApi/**'
      - 'src/FE/**'
      - '.github/workflows/pr-application-validation.yml'

permissions:
  contents: read

concurrency:
  group: application-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --nologo

      - name: Build
        run: dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-restore --nologo

      - name: Test
        shell: bash
        run: |
          set +e
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj \
            --configuration Release \
            --no-build \
            --nologo \
            --logger 'trx;LogFileName=application-tests.trx' \
            --logger 'console;verbosity=minimal' \
            > backend-test.log 2>&1
          status=$?
          cat backend-test.log
          exit $status

      - name: Upload backend test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: |
            backend-test.log
            src/BE/WorkslipApi/Workslip.Tests/TestResults/application-tests.trx
          if-no-files-found: warn

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        run: |
          set +e
          npm run build > frontend-build.log 2>&1
          status=$?
          cat frontend-build.log
          exit $status

      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: src/FE/frontend-build.log
          if-no-files-found: error
