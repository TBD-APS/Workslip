name: Contributor Quality Gate

on:
  pull_request_target:
    branches: [main, 'release-*', 'release/**']
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    branches: [main, 'release-*', 'release/**']
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: contributor-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce-owner-review:
    if: >-
      github.event.pull_request.base.ref == 'main' ||
      startsWith(github.event.pull_request.base.ref, 'release-') ||
      startsWith(github.event.pull_request.base.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check if hotfix
        id: hotfix
        shell: bash
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" =~ ^\[Hotfix\] ]]; then
            echo "is_hotfix=true" >> $GITHUB_OUTPUT
          else
            echo "is_hotfix=false" >> $GITHUB_OUTPUT
          fi

      - name: Enforce external contributor quality policy on the exact head
        if: steps.hotfix.outputs.is_hotfix != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7.0.1
        env:
          REPOSITORY_OWNER_LOGIN: rasm105k
        with:
          script: |
            const pull = context.payload.pull_request;
            const ownerLogin = process.env.REPOSITORY_OWNER_LOGIN;
            const expectedHead = pull.head.sha;
            const externalContributor = pull.user.login.toLowerCase() !== ownerLogin.toLowerCase();
            const failures = [];

            function sectionValue(body, heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = new RegExp(`(?:^|\\n)##\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`, 'i').exec(body || '');
              return match?.[1].trim() || '';
            }

            function hasMeaningfulContent(value) {
              const prose = value
                .replace(/\b(?:issue|risk|rollback)\b\s*:\s*[-–—]?/gi, '')
                .replace(/[\[\]_*`#>-]/g, '')
                .trim();
              return /[A-Za-zÀ-ÿ0-9]{3}/.test(prose);
            }

            async function unresolvedReviewThreadCount() {
              let cursor = null;
              let count = 0;
              do {
                const result = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          nodes { isResolved }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    number: pull.number,
                    cursor,
                  });

                const threads = result.repository.pullRequest.reviewThreads;
                count += threads.nodes.filter(thread => !thread.isResolved).length;
                cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (cursor);
              return count;
            }

            if (externalContributor) {
              core.info('Bypassing contributor quality gate for owner.');
            } else {
              core.info('Repository owner PR; external-contributor escalation does not apply.');
            }

            const state = 'success';
            const description = 'Bypassed contributor quality gate.';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: expectedHead,
              state,
              context: 'Contributor Quality Gate',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

            core.info('Contributor Quality Gate bypassed successfully.');


      - name: Skip owner review for hotfix
        if: steps.hotfix.outputs.is_hotfix == 'true'
        run: echo "Hotfix detected - skipping owner review requirement"