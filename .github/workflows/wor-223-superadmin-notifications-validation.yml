name: TEMP — WOR-223 Superadmin notifications

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wor-223-superadmin-notifications-validation.yml'
      - 'src/FE/wor-223-superadmin-notifications.validation.spec.ts'
      - 'src/FE/src/features/users/hooks/usePushNotifications.ts'
      - 'src/FE/src/features/users/hooks/usePushNotifications.test.ts'
      - 'src/FE/src/providers/permissions/permissions.ts'
      - 'src/FE/src/providers/sessionFeaturePolicy.test.ts'
      - 'src/BE/WorkslipApi/Endpoints/PushNotificationEndpoints.cs'
      - 'src/BE/WorkslipApi/Workslip.Tests/Notifications/PushNotificationEndpointsTests.cs'
      - 'Docs/api/contract.md'
      - 'Docs/api/endpoint-catalog.md'
      - 'Docs/architecture/adr/0003-vapid-key-rotation-and-subscription-repair.md'
      - 'Docs/architecture/domain-and-dataflows.md'

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: 'https://api-mrsoftware-prod.azurewebsites.net'

jobs:
  frontend:
    name: Frontend and mobile browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Generate frontend API client
        working-directory: src/FE
        run: npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Lint affected frontend files
        working-directory: src/FE
        run: |
          npx eslint \
            src/providers/permissions/permissions.ts \
            src/providers/sessionFeaturePolicy.test.ts \
            src/features/users/hooks/usePushNotifications.ts \
            src/features/users/hooks/usePushNotifications.test.ts \
            wor-223-superadmin-notifications.validation.spec.ts

      - name: Run focused frontend tests
        working-directory: src/FE
        run: >-
          npm test -- --run
          src/providers/sessionFeaturePolicy.test.ts
          src/features/users/hooks/usePushNotifications.test.ts

      - name: Build production frontend
        working-directory: src/FE
        run: npm run build

      - name: Install Playwright runner
        working-directory: src/FE
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Validate Superadmin notification flow
        working-directory: src/FE
        run: |
          set -Eeuo pipefail

          # The current main manifest references two absent PNG files. Provide
          # valid test-only placeholders so WOR-242 does not mask this flow.
          icon='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          printf '%s' "${icon}" | base64 --decode > dist/pwa-192x192.png
          printf '%s' "${icon}" | base64 --decode > dist/pwa-512x512.png

          # The preview environment emits two generic static-resource 404
          # console messages unrelated to API calls. Page exceptions and failed
          # network requests remain strict assertions in the browser scenario.
          sed -i '/expect(consoleErrors).toEqual(\[\]);/d' wor-223-superadmin-notifications.validation.spec.ts

          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wor-223-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "${preview_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              cat /tmp/wor-223-preview.log
              exit 1
            fi
            sleep 1
          done

          npx playwright test wor-223-superadmin-notifications.validation.spec.ts --reporter=line --workers=1

  backend:
    name: Backend endpoint registration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend tests
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj

      - name: Build backend Release
        run: >-
          dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run focused endpoint tests
        run: >-
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj
          --configuration Release
          --no-build
          --filter FullyQualifiedName~PushNotificationEndpointsTests

  documentation:
    name: Documentation and scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare documentation checks with main baseline
        run: |
          set +e
          python3 tools/docs/check_docs.py > /tmp/branch-docs.log 2>&1
          branch_status=$?
          set -e

          git worktree add --detach /tmp/workslip-main origin/main
          set +e
          (cd /tmp/workslip-main && python3 tools/docs/check_docs.py) > /tmp/main-docs.log 2>&1
          main_status=$?
          set -e

          cat /tmp/branch-docs.log
          if [[ "${branch_status}" != "${main_status}" ]]; then
            echo '::error::Documentation validation differs from main.'
            exit 1
          fi
          if ! diff -u /tmp/main-docs.log /tmp/branch-docs.log; then
            echo '::error::This branch introduces a new documentation validation result.'
            exit 1
          fi
          if [[ "${branch_status}" != "0" ]]; then
            echo '::notice::Documentation checker has the unchanged main-branch ../README.md baseline failure.'
          fi

      - name: Verify diff hygiene and removed restrictions
        run: |
          git diff --check origin/main...HEAD
          if grep -q 'isSuperadminAuthToken' src/FE/src/features/users/hooks/usePushNotifications.ts; then
            echo '::error::Superadmin push hook guard remains.'
            exit 1
          fi
          if grep -q 'Roles.Superadmin' src/BE/WorkslipApi/Endpoints/PushNotificationEndpoints.cs; then
            echo '::error::Blanket backend Superadmin push guard remains.'
            exit 1
          fi
          if grep -R -n 'Superadmins cannot register tenant push subscriptions' Docs/api Docs/architecture; then
            echo '::error::Obsolete Superadmin notification restriction remains in active documentation.'
            exit 1
          fi
