name: WOR-551 temporary inbox deep-link bootstrap

on:
  push:
    branches:
      - rbj--551-action-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--551-action-completion
      - name: Make conversation action deep links open Inbox
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/FE/src/components/common/NotificationsDrawer.tsx')
          text = p.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { useNavigate } from 'react-router-dom';",
              "import { useLocation, useNavigate } from 'react-router-dom';")

          replace_once(
              "  const [filter, setFilter] = useState<NotificationFilter>('all');\n  const navigate = useNavigate();",
              "  const [filter, setFilter] = useState<NotificationFilter>('all');\n  const navigate = useNavigate();\n  const location = useLocation();\n  const actionDeepLinkMessageId = useMemo(\n    () => new URLSearchParams(location.search).get('conversationAction'),\n    [location.search],\n  );\n  const drawerIsOpen = isOpen || Boolean(actionDeepLinkMessageId);")

          replace_once(
              "  const closeDrawer = useCallback(() => {\n    setActionError(null);\n    onClose();\n  }, [onClose]);",
              "  const closeDrawer = useCallback(() => {\n    setActionError(null);\n    if (actionDeepLinkMessageId) {\n      const next = new URLSearchParams(location.search);\n      next.delete('conversationAction');\n      const search = next.toString();\n      navigate(`${location.pathname}${search ? `?${search}` : ''}`, { replace: true });\n    }\n    onClose();\n  }, [actionDeepLinkMessageId, location.pathname, location.search, navigate, onClose]);")

          replace_once(
              "    if (isOpen && userId && organizationId) {\n      void refetch();\n    }\n  }, [isOpen, organizationId, refetch, userId]);",
              "    if (drawerIsOpen && userId && organizationId) {\n      void refetch();\n    }\n  }, [drawerIsOpen, organizationId, refetch, userId]);")

          replace_once(
              "    <Drawer\n      isOpen={isOpen}",
              "    <Drawer\n      isOpen={drawerIsOpen}")

          p.write_text(text)
          PY
      - name: Remove bootstrap and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wor551-inbox-deeplink-bootstrap.yml
          git add src/FE/src/components/common/NotificationsDrawer.tsx
          git commit -m "RBJ-551: open Inbox from conversation action deep links"
          git push origin HEAD:rbj--551-action-completion
