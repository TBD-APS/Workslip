name: TEMP — Final WOR-222 package validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore without vulnerability or pruning warnings
        shell: bash
        run: |
          set -o pipefail
          dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj 2>&1 | tee restore.log
          if grep -Eq 'NU1903|NU1510' restore.log; then
            echo 'A vulnerability or unnecessary-package warning remains after package updates.'
            exit 1
          fi

      - name: Verify vulnerable package list is empty
        shell: bash
        run: |
          set -o pipefail
          dotnet package list --project src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.log
          grep -q 'has no vulnerable packages' vulnerable-packages.log

      - name: Verify resolved dependency versions
        shell: bash
        run: |
          set -o pipefail
          dotnet nuget why src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj SQLitePCLRaw.lib.e_sqlite3 --framework net10.0 | tee sqlite-dependency.log
          dotnet nuget why src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj System.Security.Cryptography.Xml --framework net10.0 | tee xml-dependency.log
          grep -q 'Microsoft.EntityFrameworkCore.Sqlite (v10.0.10)' sqlite-dependency.log
          grep -q 'SQLitePCLRaw.lib.e_sqlite3 (v2.1.12)' sqlite-dependency.log
          grep -q 'Microsoft.Identity.Web (v4.14.2)' xml-dependency.log
          grep -q 'System.Security.Cryptography.Xml (v10.0.10)' xml-dependency.log

      - name: Build backend tests in Release
        run: dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-restore

      - name: Run backend suite against documented baseline
        shell: bash
        run: |
          set +e
          set -o pipefail
          dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-build 2>&1 | tee backend-tests.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          output = Path('backend-tests.log').read_text(encoding='utf-8', errors='replace')
          actual = set(re.findall(r'^\[xUnit\.net[^\]]*\]\s+(.+?) \[FAIL\]$', output, re.MULTILINE))
          expected = {
              'Workslip.Tests.Helpers.ResultExtensionsTests.ToHttpResult_maps_forbidden_to_403',
              'Workslip.Tests.Invitations.EfInviteRepositoryTests.MarkConsumedAsync_WhenRevocationAlreadyWon_ThrowsAndLeavesInviteRevoked',
              'Workslip.Tests.Invitations.EfInviteRepositoryTests.TenantScopedLookups_WhenTenantsShareEmail_DoNotCrossOrganizationBoundary',
              'Workslip.Tests.Jobs.EfReferenceDataRepositoryTests.GetAsync_OrdersInstallationTypesAlphabeticallyInsteadOfBySortOrder',
              'Workslip.Tests.Notifications.EfNotificationRepositoryTests.QueueNotificationAsync_DetachesRowAfterPersistenceFailure',
              'Workslip.Tests.Infrastructure.DatabaseIntegrityConstraintTests.Job_rejects_cross_tenant_customer_reference',
              'Workslip.Tests.Infrastructure.DatabaseIntegrityConstraintTests.Valid_same_tenant_references_continue_to_persist',
              'Workslip.Tests.Infrastructure.DatabaseIntegrityConstraintTests.User_owned_rows_reject_missing_users(dependentType: "job-view")',
              'Workslip.Tests.Infrastructure.DatabaseIntegrityConstraintTests.User_owned_rows_reject_missing_users(dependentType: "notification")',
              'Workslip.Tests.Infrastructure.DatabaseIntegrityConstraintTests.User_owned_rows_reject_missing_users(dependentType: "push-subscription")',
              'Workslip.Tests.Infrastructure.DatabaseIntegrityConstraintTests.Worksheet_rejects_cross_tenant_references(crossTenantReference: "job")',
              'Workslip.Tests.Infrastructure.DatabaseIntegrityConstraintTests.Worksheet_rejects_cross_tenant_references(crossTenantReference: "user")',
          }
          summary_ok = re.search(
              r'Failed!\s+- Failed:\s+12, Passed:\s+248, Skipped:\s+0, Total:\s+260,',
              output,
          ) is not None

          if actual != expected or not summary_ok:
              print(f'Unexpected: {sorted(actual - expected)}', file=sys.stderr)
              print(f'Missing: {sorted(expected - actual)}', file=sys.stderr)
              print(f'Summary matched: {summary_ok}', file=sys.stderr)
              sys.exit(1)
          PY
