name: WOR-551 temporary Postman conversation coverage

on:
  push:
    branches:
      - rbj--551-conversations-actions-v1

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rbj--551-conversations-actions-v1
          fetch-depth: 0
      - name: Add conversation HTTP regression folder
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('src/BE/WorkslipApi/Postman/postman_collection.json')
          collection = json.loads(path.read_text())
          collection.setdefault('variable', []).append({
              'key': 'conversationMessageId',
              'value': '',
              'type': 'string',
          })

          folder = {
              'name': 'Job Conversations',
              'item': [
                  {
                      'name': 'GET job conversation',
                      'request': {
                          'method': 'GET',
                          'header': [],
                          'url': {
                              'raw': '{{baseUrl}}/api/jobs/{{jobId}}/conversation',
                              'host': ['{{baseUrl}}'],
                              'path': ['api', 'jobs', '{{jobId}}', 'conversation'],
                          },
                          'description': 'WOR-551: verifies the authenticated job conversation boundary and persistence projection.',
                      },
                      'response': [],
                      'event': [{
                          'listen': 'test',
                          'script': {
                              'type': 'text/javascript',
                              'exec': [
                                  "pm.test('200 OK', function () { pm.response.to.have.status(200); });",
                                  "const json = pm.response.json();",
                                  "pm.test('conversation belongs to current job', function () { pm.expect(json.jobId).to.eql(pm.collectionVariables.get('jobId')); });",
                                  "pm.test('conversation contract returned', function () { pm.expect(json.participants).to.be.an('array'); pm.expect(json.messages).to.be.an('array'); pm.expect(json.unreadCount).to.be.a('number'); });",
                              ],
                          },
                      }],
                  },
                  {
                      'name': 'POST conversation message',
                      'request': {
                          'method': 'POST',
                          'header': [
                              {'key': 'Content-Type', 'value': 'application/json'},
                              {'key': 'Idempotency-Key', 'value': 'postman-conversation-{{$guid}}'},
                          ],
                          'url': {
                              'raw': '{{baseUrl}}/api/jobs/{{jobId}}/conversation/messages',
                              'host': ['{{baseUrl}}'],
                              'path': ['api', 'jobs', '{{jobId}}', 'conversation', 'messages'],
                          },
                          'body': {
                              'mode': 'raw',
                              'raw': '{\n  "body": "Postman conversation smoke",\n  "mentionedUserIds": []\n}',
                              'options': {'raw': {'language': 'json'}},
                          },
                      },
                      'response': [],
                      'event': [{
                          'listen': 'test',
                          'script': {
                              'type': 'text/javascript',
                              'exec': [
                                  "pm.test('200 OK', function () { pm.response.to.have.status(200); });",
                                  "const json = pm.response.json();",
                                  "pm.test('message persisted for current job', function () { pm.expect(json.jobId).to.eql(pm.collectionVariables.get('jobId')); pm.expect(json.body).to.eql('Postman conversation smoke'); });",
                                  "pm.collectionVariables.set('conversationMessageId', json.id);",
                              ],
                          },
                      }],
                  },
                  {
                      'name': 'GET conversation contains message',
                      'request': {
                          'method': 'GET',
                          'header': [],
                          'url': {
                              'raw': '{{baseUrl}}/api/jobs/{{jobId}}/conversation',
                              'host': ['{{baseUrl}}'],
                              'path': ['api', 'jobs', '{{jobId}}', 'conversation'],
                          },
                      },
                      'response': [],
                      'event': [{
                          'listen': 'test',
                          'script': {
                              'type': 'text/javascript',
                              'exec': [
                                  "pm.test('200 OK', function () { pm.response.to.have.status(200); });",
                                  "const json = pm.response.json();",
                                  "const messageId = pm.collectionVariables.get('conversationMessageId');",
                                  "pm.test('created message is readable', function () { pm.expect(json.messages.some(message => message.id === messageId && message.body === 'Postman conversation smoke')).to.eql(true); });",
                              ],
                          },
                      }],
                  },
                  {
                      'name': 'POST invalid conversation mention',
                      'request': {
                          'method': 'POST',
                          'header': [
                              {'key': 'Content-Type', 'value': 'application/json'},
                              {'key': 'Idempotency-Key', 'value': 'postman-invalid-mention-{{$guid}}'},
                          ],
                          'url': {
                              'raw': '{{baseUrl}}/api/jobs/{{jobId}}/conversation/messages',
                              'host': ['{{baseUrl}}'],
                              'path': ['api', 'jobs', '{{jobId}}', 'conversation', 'messages'],
                          },
                          'body': {
                              'mode': 'raw',
                              'raw': '{\n  "body": "Invalid mention must fail",\n  "mentionedUserIds": ["11111111-1111-1111-1111-111111111111"]\n}',
                              'options': {'raw': {'language': 'json'}},
                          },
                      },
                      'response': [],
                      'event': [{
                          'listen': 'test',
                          'script': {
                              'type': 'text/javascript',
                              'exec': [
                                  "pm.test('400 invalid mention', function () { pm.response.to.have.status(400); });",
                              ],
                          },
                      }],
                  },
                  {
                      'name': 'POST conversation read',
                      'request': {
                          'method': 'POST',
                          'header': [],
                          'url': {
                              'raw': '{{baseUrl}}/api/jobs/{{jobId}}/conversation/read',
                              'host': ['{{baseUrl}}'],
                              'path': ['api', 'jobs', '{{jobId}}', 'conversation', 'read'],
                          },
                      },
                      'response': [],
                      'event': [{
                          'listen': 'test',
                          'script': {
                              'type': 'text/javascript',
                              'exec': [
                                  "pm.test('204 No Content', function () { pm.response.to.have.status(204); });",
                              ],
                          },
                      }],
                  },
              ],
          }

          existing = [item for item in collection.get('item', []) if item.get('name') != 'Job Conversations']
          existing.append(folder)
          collection['item'] = existing
          path.write_text(json.dumps(collection, ensure_ascii=False, indent=2) + '\n')
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/wor551-add-postman-conversation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RBJ-551: add conversation HTTP regression coverage"
          git push origin HEAD:rbj--551-conversations-actions-v1
