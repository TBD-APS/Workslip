name: WOR-357 synthetic auth validation

on:
  pull_request:
    branches:
      - rbj--354-remove-dev-login

permissions:
  contents: read

jobs:
  synthetic-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Playwright script syntax
        working-directory: src/FE
        run: |
          node --check scripts/playwright-prod-smoke.mjs
          node --check scripts/playwright-synthetic-auth.mjs
          node --check scripts/playwright-critical-contract.mjs
          node --check scripts/playwright-scenarios-core.mjs
          node --check scripts/playwright-scenarios-admin.mjs
          node --check scripts/bootstrap-synthetic-test-identities.mjs
      - name: Check synthetic plus-address generation
        working-directory: src/FE
        env:
          WORKSLIP_SYNTHETIC_USER_EMAIL: user@tests.example
          WORKSLIP_SYNTHETIC_ADMIN_EMAIL: admin@tests.example
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createContractHelpers } from './scripts/playwright-critical-contract.mjs';

          const postman = JSON.parse(await readFile('../BE/WorkslipApi/Postman/postman_collection.json', 'utf8'));
          const helpers = createContractHelpers({ API_TIMEOUT: 1000, UI_TIMEOUT: 1000, postman });
          const data = helpers.buildDataFactory(postman, 'validation-run').forScenario('assignment-lifecycle');
          const addresses = [
            data.customerEmail,
            data.inviteEmail,
            data.userEmail(1),
            data.secondaryOrganization.adminEmail,
          ];
          if (!addresses.every((email) => email.includes('+') && email.endsWith('@tests.example'))) {
            throw new Error(`Unexpected synthetic addresses: ${addresses.join(', ')}`);
          }
          if (!data.userEmail(1).startsWith('user+user-1-')) throw new Error('Assigned user address is not run-scoped.');
          if (!data.secondaryOrganization.adminEmail.startsWith('admin+tenant-')) throw new Error('Secondary admin address is not run-scoped.');
          NODE
