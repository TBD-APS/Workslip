name: TEMP — Compare WOR-222 backend baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout unchanged PR base
        uses: actions/checkout@v4
        with:
          ref: 178ad3c392b8a41cd6356ddb22ada8a360db3560

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend baseline
        run: dotnet restore src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj

      - name: Build backend baseline
        run: dotnet build src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-restore

      - name: Run backend baseline tests
        run: dotnet test src/BE/WorkslipApi/Workslip.Tests/Workslip.Tests.csproj --configuration Release --no-build
