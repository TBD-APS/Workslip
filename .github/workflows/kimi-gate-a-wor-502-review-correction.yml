name: Kimi Gate A - WOR-502 Design Integration

on:
  push:
    branches: [rbj--637-kimi-gate-a-runner]
    paths:
      - .github/workflows/kimi-gate-a-wor-502-review-correction.yml

permissions:
  contents: write

concurrency:
  group: kimi-gate-a-wor-502-design
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_BASE_URL: https://api.moonshot.ai/v1
      FEATURE_BRANCH: rbj--502-kimi-global-search

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare trusted broker and current WOR-502 head
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KIMI_API_KEY:-}" || { echo 'KIMI_API_KEY missing'; exit 10; }
          cp tools/ai/kimi-gate-a-fix-wor502.py /tmp/kimi-gate-a-fix-wor502.py
          response="$(curl --fail --silent --show-error -H "Authorization: Bearer ${KIMI_API_KEY}" "${MOONSHOT_BASE_URL}/models")"
          model="$(printf '%s' "$response" | jq -r '([.data[].id | select(. == "kimi-k2.6")] + [.data[].id | select(test("^kimi-"; "i"))] + [.data[].id]) | unique | .[0] // empty')"
          test -n "$model" || exit 11
          echo "model=$model" >> "$GITHUB_OUTPUT"
          git fetch origin main "$FEATURE_BRANCH"
          git switch --force-create "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          echo "feature_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name 'Kimi Worker'
          git config user.email 'kimi-worker@users.noreply.github.com'

      - name: Kimi - wire the intended design into the active QuickNavigator
        env:
          KIMI_MODEL: ${{ steps.runtime.outputs.model }}
        shell: bash
        run: |
          cat >/tmp/wor502-design-review.txt <<'EOF'
          Product-owner rejection: the site still showed the old QuickNavigator. AppLayout already mounts QuickNavigator correctly; the previous worker brief accidentally kept the old visual shell. Implement the intended design in the ACTIVE QuickNavigator, not an unused parallel component.

          Preserve every pre-existing WOR-502 feature-head change, including separate palette work. Mutate only QuickNavigator allowlisted files.

          Required structure:
          - QuickNavigator.tsx handles view/navigation/focus orchestration only.
          - It imports and renders QuickNavigatorHeader, QuickNavigatorSearchField, QuickNavigatorFolderGrid, QuickNavigatorResults and QuickNavigatorFooter.
          - It imports and calls useQuickNavigatorSearch.
          - Home/folder/search modes; folder cards for Sager/Kunder/Navigation only; visible Navigation/Sag/Kunde badges; back button; LoaderCircle; empty/error states; keyboard footer; active-row scroll.
          - QuickNavigator.css visibly implements folder grid/cards/result badges with Workslip variables.

          Required search architecture — use this, do not invent another state machine:
          - useQuickNavigatorSearch.ts uses TanStack useQuery for BOTH jobs and customers.
          - jobs queryFn uses apiClient GET /api/jobs with params search=term, limit=5, offset=0 and the queryFn AbortSignal.
          - customer params are exactly query optional string and limit optional number|string. There is NO customer `search` property. Use getApiCustomersSearch({ query: term, limit: 5 }, undefined, signal) and getGetApiCustomersSearchQueryKey({ query: term, limit: 5 }).
          - use existing useDebounce(query, 200).
          - stale suppression is derived only: if raw query differs from debounced query, expose no old remote jobs/customers. Do not create lastHandled state, request-id refs, fetch-state effects or abort-controller refs.
          - Navigation local filtering remains immediate. One remote source failure does not erase healthy/local results.
          - preserve canViewAllJobs/currentUserId scoping, generated JobStatus routing and return-context navigation.

          React rules: all hooks unconditional before early returns; no ref/DOM reads or mutations during render; no synchronous state setters inside effects for search/derived state; no dead imports. Keep accessible dialog name `Hvor vil du hen?`. No backend/generated/config/dependency edits. Draft only.
          EOF
          python3 /tmp/kimi-gate-a-fix-wor502.py /tmp/wor502-design-review.txt

      - name: Enforce Kimi mutation boundary
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/FE/src/components/common/(QuickNavigator\.tsx|QuickNavigator\.css|QuickNavigatorHeader\.tsx|QuickNavigatorSearchField\.tsx|QuickNavigatorFolderGrid\.tsx|QuickNavigatorResults\.tsx|QuickNavigatorFooter\.tsx|QuickNavigator\.test\.tsx|quickNavigatorSearch\.ts|quickNavigatorSearch\.test\.ts|quickNavigatorTypes\.ts|useQuickNavigatorSearch\.ts))$'
          { git diff --name-only "$KIMI_START_HEAD"; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/kimi-files.txt
          test -s /tmp/kimi-files.txt
          while IFS= read -r p; do
            [[ "$p" =~ $allowed ]] || { echo "Out-of-scope Kimi delta: $p"; exit 20; }
          done < /tmp/kimi-files.txt

      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci

      - name: Validator to Kimi repair loop
        env:
          KIMI_MODEL: ${{ steps.runtime.outputs.model }}
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -u
          allowed='^(src/FE/src/components/common/(QuickNavigator\.tsx|QuickNavigator\.css|QuickNavigatorHeader\.tsx|QuickNavigatorSearchField\.tsx|QuickNavigatorFolderGrid\.tsx|QuickNavigatorResults\.tsx|QuickNavigatorFooter\.tsx|QuickNavigator\.test\.tsx|quickNavigatorSearch\.ts|quickNavigatorSearch\.test\.ts|quickNavigatorTypes\.ts|useQuickNavigatorSearch\.ts))$'

          enforce_scope() {
            { git diff --name-only "$KIMI_START_HEAD"; git ls-files --others --exclude-standard; } | sort -u > /tmp/kimi-loop-files.txt
            while IFS= read -r p; do
              [[ "$p" =~ $allowed ]] || { echo "Out-of-scope Kimi repair delta: $p"; return 20; }
            done < /tmp/kimi-loop-files.txt
          }

          for attempt in 1 2 3; do
            enforce_scope || exit $?
            : > /tmp/kimi-validator.log
            set +e
            cd src/FE

            mapfile -t tests < <(find src/components/common -maxdepth 1 -type f -iname '*navigator*.test.ts*' -print)
            test_status=0
            if ((${#tests[@]})); then
              npx vitest run "${tests[@]}" 2>&1 | tee -a /tmp/kimi-validator.log
              test_status=${PIPESTATUS[0]}
            fi

            mapfile -t files < <({ git diff --name-only "$KIMI_START_HEAD" -- '*.ts' '*.tsx'; git ls-files --others --exclude-standard -- 'src/components/common/*.ts' 'src/components/common/*.tsx'; } | sort -u | sed 's#^src/FE/##')
            lint_status=0
            if ((${#files[@]})); then
              npx eslint "${files[@]}" 2>&1 | tee -a /tmp/kimi-validator.log
              lint_status=${PIPESTATUS[0]}
            fi

            npm run build 2>&1 | tee -a /tmp/kimi-validator.log
            build_status=${PIPESTATUS[0]}
            cd ../..
            set -e

            if (( test_status == 0 && lint_status == 0 && build_status == 0 )); then
              echo "Validator green on attempt ${attempt}."
              exit 0
            fi
            if (( attempt == 3 )); then
              echo 'Validator still red after 3 Kimi repair opportunities.'
              cat /tmp/kimi-validator.log
              exit 30
            fi

            printf 'Validator rejected WOR-502 QuickNavigator on repair attempt %s.\n' "$attempt" > /tmp/kimi-repair.txt
            cat >>/tmp/kimi-repair.txt <<'EOF'
          Correct the exact validator failures appended below without removing the modular design or changing files outside the QuickNavigator allowlist.
          Remote search architecture is fixed: use TanStack useQuery for both jobs and customers. Do not hand-roll fetch state with effects or refs. Stale suppression is derived from raw query versus debounced query.
          Customer search params are exactly: query optional string; limit optional number|string. Never use a property named search for customer search. Use generated customer API/query-key with query and limit 5.
          QuickNavigator.tsx must import/call useQuickNavigatorSearch; the hook owns remote search. Do not suppress validators.
          EOF
            cat /tmp/kimi-validator.log >> /tmp/kimi-repair.txt
            python3 /tmp/kimi-gate-a-fix-wor502.py /tmp/kimi-repair.txt
          done

      - name: Static import and render wiring proof
        shell: bash
        run: |
          set -euo pipefail
          q=src/FE/src/components/common/QuickNavigator.tsx
          css=src/FE/src/components/common/QuickNavigator.css
          hook=src/FE/src/components/common/useQuickNavigatorSearch.ts

          for component in QuickNavigatorHeader QuickNavigatorSearchField QuickNavigatorFolderGrid QuickNavigatorResults QuickNavigatorFooter; do
            test -f "src/FE/src/components/common/${component}.tsx" || { echo "Missing ${component}.tsx"; exit 40; }
            grep -q "import.*${component}" "$q" || { echo "${component} is not imported by active QuickNavigator"; exit 41; }
            grep -q "<${component}" "$q" || { echo "${component} is imported but not rendered"; exit 42; }
          done

          test -f "$hook" || { echo 'useQuickNavigatorSearch.ts missing'; exit 43; }
          grep -q 'import.*useQuickNavigatorSearch' "$q" || { echo 'Search hook not imported by active QuickNavigator'; exit 44; }
          grep -q 'useQuickNavigatorSearch(' "$q" || { echo 'Search hook imported but not called'; exit 45; }
          grep -q 'useQuery' "$hook" || { echo 'React Query missing from search hook'; exit 46; }
          grep -q 'getApiCustomersSearch' "$hook" || { echo 'Generated customer API not used'; exit 47; }
          grep -q 'getGetApiCustomersSearchQueryKey' "$hook" || { echo 'Generated customer query key not used'; exit 48; }
          grep -q 'useDebounce' "$hook" || { echo 'Remote debounce not wired'; exit 49; }
          grep -q 'query:' "$hook" || { echo 'Customer query parameter missing'; exit 50; }
          grep -q 'limit: 5' "$hook" || { echo 'Bounded search limit missing'; exit 51; }
          if grep -Eq 'lastHandled|jobFetchState|requestIdRef|AbortControllerRef' "$hook"; then
            echo 'Forbidden manual remote-state machine detected'; exit 52
          fi
          grep -q 'quick-nav-folder-grid' "$css" || { echo 'Folder grid CSS missing'; exit 53; }
          grep -q 'quick-nav-folder-card' "$css" || { echo 'Folder card CSS missing'; exit 54; }
          grep -q 'quick-nav-result-badge' "$css" || { echo 'Result badge CSS missing'; exit 55; }
          echo 'Static import/render/search wiring proof passed.'

      - name: Focused authenticated QuickNavigator browser smoke
        env:
          WORKSLIP_PLAYWRIGHT_SCENARIO: quick-navigator
        run: bash src/FE/scripts/run-playwright-ephemeral.sh

      - name: Commit and push only if feature head stayed unchanged
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          remote_head="$(git rev-parse "origin/$FEATURE_BRANCH")"
          [[ "$remote_head" == "$KIMI_START_HEAD" ]] || {
            echo "Feature branch advanced during run: start=$KIMI_START_HEAD remote=$remote_head. Refusing stale push."
            exit 60
          }
          git add src/FE/src/components/common
          git diff --cached --quiet && { echo 'Kimi produced no feature delta'; exit 61; }
          git commit -m 'RBJ-502: wire modular global search design'
          git push origin "$FEATURE_BRANCH"
          echo "Kimi design head: $(git rev-parse HEAD)"
