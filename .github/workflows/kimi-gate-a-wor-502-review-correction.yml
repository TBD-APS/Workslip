name: Kimi Gate A - WOR-502 Design Integration

on:
  push:
    branches:
      - rbj--637-kimi-gate-a-runner
    paths:
      - .github/workflows/kimi-gate-a-wor-502-review-correction.yml

permissions:
  contents: write

concurrency:
  group: kimi-gate-a-wor-502-design
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_BASE_URL: https://api.moonshot.ai/v1
      FEATURE_BRANCH: rbj--502-kimi-global-search
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare trusted Kimi broker and checkout feature branch
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KIMI_API_KEY:-}" || { echo 'KIMI_API_KEY missing'; exit 10; }
          cp tools/ai/kimi-gate-a-fix-wor502.py /tmp/kimi-gate-a-fix-wor502.py
          response="$(curl --fail --silent --show-error -H "Authorization: Bearer ${KIMI_API_KEY}" "${MOONSHOT_BASE_URL}/models")"
          model="$(printf '%s' "$response" | jq -r '([.data[].id | select(. == "kimi-k2.6")] + [.data[].id | select(test("^kimi-"; "i"))] + [.data[].id]) | unique | .[0] // empty')"
          test -n "$model" || exit 11
          echo "model=$model" >> "$GITHUB_OUTPUT"
          git fetch origin main "$FEATURE_BRANCH"
          git switch --force-create "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          echo "feature_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name 'Kimi Worker'
          git config user.email 'kimi-worker@users.noreply.github.com'

      - name: Give product-owner design wiring feedback to Kimi
        env:
          KIMI_MODEL: ${{ steps.runtime.outputs.model }}
        shell: bash
        run: |
          cat >/tmp/wor502-design-review.txt <<'EOF'
          Product-owner review: the feature still LOOKS like the old QuickNavigator. Search logic works, but the intended design from the earlier UnifiedSearch proposal was never wired into the active component.

          Root cause already established by reviewer: AppLayout correctly imports/renders QuickNavigator, but the previous Gate A brief explicitly forbade folder mode and CSS changes. Therefore the active QuickNavigator kept the old visual shell. Correct that now.

          Required outcome:
          1. Keep AppLayout untouched. QuickNavigator is already mounted there.
          2. Wire the NEW UI into the existing QuickNavigator.tsx render path. Do not create an unused parallel UnifiedSearch component.
          3. Reintroduce the visual/interaction concepts from the supplied proposal, using the existing `quick-nav-*` namespace and design tokens:
             - home / folder / search view modes;
             - header kicker + title with back button in folder mode;
             - search field with correct mode-specific placeholder and Esc/back hint;
             - meta row with counts and LoaderCircle searching state;
             - home folder-card grid;
             - mixed result rows with visible type badge, icon, title/subtitle and ArrowRight;
             - empty states and source-specific error states;
             - footer with keyboard hints;
             - smooth active-row keyboard scrolling;
             - Escape closes search or goes back from folder view; Backspace on empty folder query may go home.
          4. The earlier proposal relied on Lucide imports such as ArrowLeft, ArrowRight, Building2, ClipboardList, ChevronRight, FileText, Folder, FolderOpen, LoaderCircle, Search and X. Import only the icons actually used, but do not omit required imports and leave dead/unwired markup.
          5. Keep this modular. `QuickNavigator.tsx` should orchestrate state/navigation only. Use/import subcomponents from the allowed set such as `QuickNavigatorHeader.tsx`, `QuickNavigatorSearchField.tsx`, `QuickNavigatorFolderGrid.tsx`, and `QuickNavigatorResults.tsx`. Do NOT paste the whole former UnifiedSearch into one file.
          6. Update `QuickNavigator.css` so the new folder/grid/header/result-badge UI is actually visible. Reuse Workslip CSS variables and responsive behavior; no hard-coded brand palette and no unrelated App.css work.
          7. Preserve already validated search behavior exactly:
             - local Navigation command filtering is immediate;
             - remote Sager/Kunder stay bounded to 5;
             - remote search is debounced ~200 ms;
             - previous remote results are hidden while debounce is pending;
             - generated JobStatus constants determine completed/editable route;
             - customer/job permission scope remains unchanged;
             - one remote source failing does not delete healthy results/local commands.
          8. Folder design must not invent unsupported data APIs. For this pass, make folders for the actually supported result families: Sager (when allowed), Kunder (when allowed), and Navigation. Do not fake Users/Docs remote results merely to match the old mockup. Existing Docs/User navigation commands can still appear under Navigation.
          9. Folder mode must be meaningful even before a remote query. Do not repeat the old proposal bug where opening a folder clears query and therefore shows a permanently empty remote-data folder. A folder can provide a scoped search experience and clear guidance; only show result counts when they are real.
          10. Keep aria dialog/focus trap/mobile/keyboard behavior compatible with existing tests. Dialog accessible name must remain `Hvor vil du hen?`.

          This is still a Draft PR and browser-unaccepted until focused browser validation passes. Do not merge or deploy.
          EOF
          python3 /tmp/kimi-gate-a-fix-wor502.py /tmp/wor502-design-review.txt

      - name: Enforce Kimi design scope
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only "$KIMI_START_HEAD"; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/kimi-files.txt
          while IFS= read -r p; do
            case "$p" in
              src/FE/src/components/common/QuickNavigator.tsx|src/FE/src/components/common/QuickNavigator.css|src/FE/src/components/common/QuickNavigatorHeader.tsx|src/FE/src/components/common/QuickNavigatorSearchField.tsx|src/FE/src/components/common/QuickNavigatorFolderGrid.tsx|src/FE/src/components/common/QuickNavigatorResults.tsx|src/FE/src/components/common/QuickNavigator.test.tsx|src/FE/src/components/common/quickNavigatorSearch.ts|src/FE/src/components/common/quickNavigatorSearch.test.ts|src/FE/src/components/common/quickNavigatorTypes.ts|src/FE/src/components/common/useQuickNavigatorSearch.ts) ;;
              *) echo "Out-of-scope Kimi delta: $p"; exit 20 ;;
            esac
          done < /tmp/kimi-files.txt

      - name: Install frontend dependencies
        working-directory: src/FE
        shell: bash
        run: npm ci

      - name: Initial tests and lint
        id: prevalidate
        working-directory: src/FE
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          : > /tmp/kimi-prevalidate.log
          mapfile -t tests < <(find src/components/common -maxdepth 1 -type f -iname '*navigator*.test.ts*' -print)
          test_status=0
          if ((${#tests[@]})); then
            npx vitest run "${tests[@]}" 2>&1 | tee -a /tmp/kimi-prevalidate.log
            test_status=${PIPESTATUS[0]}
          fi
          mapfile -t files < <({ git diff --name-only "$KIMI_START_HEAD" -- '*.ts' '*.tsx'; git ls-files --others --exclude-standard -- 'src/components/common/*.ts' 'src/components/common/*.tsx'; } | sort -u | sed 's#^src/FE/##')
          lint_status=0
          if ((${#files[@]})); then
            npx eslint "${files[@]}" 2>&1 | tee -a /tmp/kimi-prevalidate.log
            lint_status=${PIPESTATUS[0]}
          fi
          if (( test_status != 0 || lint_status != 0 )); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Ask Kimi to repair tests or lint
        if: steps.prevalidate.outputs.failed == 'true'
        env:
          KIMI_MODEL: ${{ steps.runtime.outputs.model }}
        shell: bash
        run: |
          cat >/tmp/kimi-repair-1.txt <<'EOF'
          Deterministic validator rejected your newly wired QuickNavigator design. Fix the exact errors in the appended validator output. Preserve the new modular folder/search UI and all previously validated search behavior. Do not remove the design to make lint pass. In particular, avoid synchronous setState inside effects; reset state from explicit open/close/query/folder event paths or derive state cleanly. Remove unused imports/values instead of suppressing lint rules.
          EOF
          cat /tmp/kimi-prevalidate.log >> /tmp/kimi-repair-1.txt
          python3 /tmp/kimi-gate-a-fix-wor502.py /tmp/kimi-repair-1.txt

      - name: Re-enforce scope after first repair
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only "$KIMI_START_HEAD"; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/kimi-files-repair1.txt
          while IFS= read -r p; do
            case "$p" in
              src/FE/src/components/common/QuickNavigator.tsx|src/FE/src/components/common/QuickNavigator.css|src/FE/src/components/common/QuickNavigatorHeader.tsx|src/FE/src/components/common/QuickNavigatorSearchField.tsx|src/FE/src/components/common/QuickNavigatorFolderGrid.tsx|src/FE/src/components/common/QuickNavigatorResults.tsx|src/FE/src/components/common/QuickNavigator.test.tsx|src/FE/src/components/common/quickNavigatorSearch.ts|src/FE/src/components/common/quickNavigatorSearch.test.ts|src/FE/src/components/common/quickNavigatorTypes.ts|src/FE/src/components/common/useQuickNavigatorSearch.ts) ;;
              *) echo "Out-of-scope Kimi repair delta: $p"; exit 21 ;;
            esac
          done < /tmp/kimi-files-repair1.txt

      - name: Tests lint and build after first repair
        id: buildvalidate
        working-directory: src/FE
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          : > /tmp/kimi-buildvalidate.log
          mapfile -t tests < <(find src/components/common -maxdepth 1 -type f -iname '*navigator*.test.ts*' -print)
          test_status=0
          if ((${#tests[@]})); then
            npx vitest run "${tests[@]}" 2>&1 | tee -a /tmp/kimi-buildvalidate.log
            test_status=${PIPESTATUS[0]}
          fi
          mapfile -t files < <({ git diff --name-only "$KIMI_START_HEAD" -- '*.ts' '*.tsx'; git ls-files --others --exclude-standard -- 'src/components/common/*.ts' 'src/components/common/*.tsx'; } | sort -u | sed 's#^src/FE/##')
          lint_status=0
          if ((${#files[@]})); then
            npx eslint "${files[@]}" 2>&1 | tee -a /tmp/kimi-buildvalidate.log
            lint_status=${PIPESTATUS[0]}
          fi
          npm run build 2>&1 | tee -a /tmp/kimi-buildvalidate.log
          build_status=${PIPESTATUS[0]}
          if (( test_status != 0 || lint_status != 0 || build_status != 0 )); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Ask Kimi to repair build validation
        if: steps.buildvalidate.outputs.failed == 'true'
        env:
          KIMI_MODEL: ${{ steps.runtime.outputs.model }}
        shell: bash
        run: |
          cat >/tmp/kimi-repair-2.txt <<'EOF'
          The deterministic tests/lint/build validator still rejects your modular QuickNavigator design. Fix only the concrete failures in the appended output while preserving the wired folder/search design, imports, permissions, debounce/stale-result protection, keyboard/focus behavior and component split. Do not weaken validators.
          EOF
          cat /tmp/kimi-buildvalidate.log >> /tmp/kimi-repair-2.txt
          python3 /tmp/kimi-gate-a-fix-wor502.py /tmp/kimi-repair-2.txt

      - name: Final strict validation
        working-directory: src/FE
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find src/components/common -maxdepth 1 -type f -iname '*navigator*.test.ts*' -print)
          if ((${#tests[@]})); then npx vitest run "${tests[@]}"; fi
          mapfile -t files < <({ git diff --name-only "$KIMI_START_HEAD" -- '*.ts' '*.tsx'; git ls-files --others --exclude-standard -- 'src/components/common/*.ts' 'src/components/common/*.tsx'; } | sort -u | sed 's#^src/FE/##')
          if ((${#files[@]})); then npx eslint "${files[@]}"; fi
          npm run build

      - name: Run focused authenticated QuickNavigator browser smoke
        env:
          WORKSLIP_PLAYWRIGHT_SCENARIO: quick-navigator
        shell: bash
        run: |
          set -euo pipefail
          bash src/FE/scripts/run-playwright-ephemeral.sh

      - name: Commit Kimi design integration
        shell: bash
        run: |
          set -euo pipefail
          git add src/FE/src/components/common
          git diff --cached --quiet && { echo 'Kimi made no design integration change'; exit 30; }
          git commit -m 'RBJ-502: wire modular global search design'
          git push origin "$FEATURE_BRANCH"
          echo "Kimi design head: $(git rev-parse HEAD)"
