name: Kimi Gate A - WOR-502 Design Integration

on:
  push:
    branches:
      - rbj--637-kimi-gate-a-runner
    paths:
      - .github/workflows/kimi-gate-a-wor-502-review-correction.yml

permissions:
  contents: write

concurrency:
  group: kimi-gate-a-wor-502-design
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_BASE_URL: https://api.moonshot.ai/v1
      FEATURE_BRANCH: rbj--502-kimi-global-search
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare trusted broker and clean feature workspace
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KIMI_API_KEY:-}" || { echo 'KIMI_API_KEY missing'; exit 10; }
          cp tools/ai/kimi-gate-a-fix-wor502.py /tmp/kimi-gate-a-fix-wor502.py
          response="$(curl --fail --silent --show-error -H "Authorization: Bearer ${KIMI_API_KEY}" "${MOONSHOT_BASE_URL}/models")"
          model="$(printf '%s' "$response" | jq -r '([.data[].id | select(. == "kimi-k2.6")] + [.data[].id | select(test("^kimi-"; "i"))] + [.data[].id]) | unique | .[0] // empty')"
          test -n "$model" || exit 11
          echo "model=$model" >> "$GITHUB_OUTPUT"
          git fetch origin main "$FEATURE_BRANCH"
          git switch --force-create "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          echo "feature_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name 'Kimi Worker'
          git config user.email 'kimi-worker@users.noreply.github.com'

      - name: Kimi - wire intended design into active QuickNavigator
        env:
          KIMI_MODEL: ${{ steps.runtime.outputs.model }}
        shell: bash
        run: |
          cat >/tmp/wor502-design-review.txt <<'EOF'
          Product-owner review: the active site still showed the old QuickNavigator because the previous Gate A brief implemented search logic but incorrectly forbade folder mode and CSS changes. AppLayout already imports and mounts QuickNavigator correctly. Fix the ACTIVE QuickNavigator implementation, not AppLayout and not an unused parallel UnifiedSearch component.

          This branch has intentionally been cleaned back to current main. Rebuild the bounded WOR-502 search/design slice from that source of truth.

          Required outcome:
          - modular home / folder / search modes;
          - Header, SearchField, FolderGrid, Results and Footer are separate imported/rendered components;
          - home folder cards for only supported families: Sager, Kunder, Navigation;
          - mixed search rows visibly distinguish Navigation / Sag / Kunde with icon, title, subtitle, badge and ArrowRight;
          - header kicker/title, folder back button, LoaderCircle meta row, empty/error states and keyboard footer;
          - Escape closes search or backs out of folder; Backspace with empty folder query may return home;
          - active keyboard row scrolls into view;
          - CSS actually implements the folder grid/cards and result badges using Workslip design variables;
          - import every Lucide/component/API symbol actually used; leave no dead imports or dead parallel components.

          Search correctness is mandatory:
          - local Navigation filtering remains immediate;
          - remote Sager and Kunder are each bounded to 5;
          - use the supplied generated customer search contract (`getApiCustomersSearch` / its query key) rather than editing generated files;
          - remote requests are debounced ~180-200 ms;
          - stale remote results are hidden while debounce is pending, so Enter/click cannot select a previous query;
          - job visibility remains scoped by canViewAllJobs/currentUserId and backend auth remains authoritative;
          - generated JobStatus constants choose editable vs completed job route;
          - source-specific failure does not remove healthy results/local commands;
          - customer and job navigation preserve return context.

          React quality rules from prior failed attempts:
          - all hooks unconditionally before any early return;
          - never read/write refs or mutate DOM during render;
          - effects are for external synchronization/listeners/focus/body scroll with cleanup, not synchronous derived-state reset;
          - state resets happen in explicit event paths or are derived cleanly.

          Preserve dialog accessible name `Hvor vil du hen?`, focus trap and current mobile/desktop trigger compatibility. No backend/config/generated/dependency/unrelated edits. Draft only; no merge/deploy.
          EOF
          python3 /tmp/kimi-gate-a-fix-wor502.py /tmp/wor502-design-review.txt

      - name: Enforce Kimi path boundary
        env:
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/FE/src/components/common/(QuickNavigator\.tsx|QuickNavigator\.css|QuickNavigatorHeader\.tsx|QuickNavigatorSearchField\.tsx|QuickNavigatorFolderGrid\.tsx|QuickNavigatorResults\.tsx|QuickNavigatorFooter\.tsx|QuickNavigator\.test\.tsx|quickNavigatorSearch\.ts|quickNavigatorSearch\.test\.ts|quickNavigatorTypes\.ts|useQuickNavigatorSearch\.ts))$'
          { git diff --name-only "$KIMI_START_HEAD"; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/kimi-files.txt
          test -s /tmp/kimi-files.txt
          while IFS= read -r p; do
            [[ "$p" =~ $allowed ]] || { echo "Out-of-scope Kimi delta: $p"; exit 20; }
          done < /tmp/kimi-files.txt

      - name: Install frontend dependencies
        working-directory: src/FE
        shell: bash
        run: npm ci

      - name: Validator -> Kimi repair loop
        env:
          KIMI_MODEL: ${{ steps.runtime.outputs.model }}
          KIMI_START_HEAD: ${{ steps.runtime.outputs.feature_head }}
        shell: bash
        run: |
          set -u
          allowed='^(src/FE/src/components/common/(QuickNavigator\.tsx|QuickNavigator\.css|QuickNavigatorHeader\.tsx|QuickNavigatorSearchField\.tsx|QuickNavigatorFolderGrid\.tsx|QuickNavigatorResults\.tsx|QuickNavigatorFooter\.tsx|QuickNavigator\.test\.tsx|quickNavigatorSearch\.ts|quickNavigatorSearch\.test\.ts|quickNavigatorTypes\.ts|useQuickNavigatorSearch\.ts))$'

          enforce_scope() {
            { git diff --name-only "$KIMI_START_HEAD"; git ls-files --others --exclude-standard; } | sort -u > /tmp/kimi-loop-files.txt
            while IFS= read -r p; do
              [[ "$p" =~ $allowed ]] || { echo "Out-of-scope Kimi repair delta: $p"; return 20; }
            done < /tmp/kimi-loop-files.txt
          }

          for attempt in 1 2 3; do
            enforce_scope || exit $?
            : > /tmp/kimi-validator.log
            set +e

            cd src/FE
            mapfile -t tests < <(find src/components/common -maxdepth 1 -type f -iname '*navigator*.test.ts*' -print)
            test_status=0
            if ((${#tests[@]})); then
              npx vitest run "${tests[@]}" 2>&1 | tee -a /tmp/kimi-validator.log
              test_status=${PIPESTATUS[0]}
            fi

            mapfile -t files < <({ git diff --name-only "$KIMI_START_HEAD" -- '*.ts' '*.tsx'; git ls-files --others --exclude-standard -- 'src/components/common/*.ts' 'src/components/common/*.tsx'; } | sort -u | sed 's#^src/FE/##')
            lint_status=0
            if ((${#files[@]})); then
              npx eslint "${files[@]}" 2>&1 | tee -a /tmp/kimi-validator.log
              lint_status=${PIPESTATUS[0]}
            fi

            npm run build 2>&1 | tee -a /tmp/kimi-validator.log
            build_status=${PIPESTATUS[0]}
            cd ../..
            set -e

            if (( test_status == 0 && lint_status == 0 && build_status == 0 )); then
              echo "Validator green on attempt ${attempt}."
              exit 0
            fi

            if (( attempt == 3 )); then
              echo "Validator still red after 3 Kimi repair opportunities."
              cat /tmp/kimi-validator.log
              exit 30
            fi

            cat >/tmp/kimi-repair.txt <<EOF
          Deterministic validator rejected the current WOR-502 QuickNavigator candidate on repair attempt ${attempt}. Fix the exact validator failures appended below. Preserve the modular new design and all search correctness. Do not edit unrelated files, generated code, backend, config or dependencies. Do not suppress lint or weaken tests. Hooks must be unconditional before early returns; no refs/DOM mutations during render; no synchronous derived-state resets in effects. If validator output contains unrelated files, do not edit them; this branch is based on clean main so report them only if genuinely external.
          EOF
            cat /tmp/kimi-validator.log >> /tmp/kimi-repair.txt
            python3 /tmp/kimi-gate-a-fix-wor502.py /tmp/kimi-repair.txt
          done

      - name: Static wiring proof
        shell: bash
        run: |
          set -euo pipefail
          q=src/FE/src/components/common/QuickNavigator.tsx
          css=src/FE/src/components/common/QuickNavigator.css
          hook=src/FE/src/components/common/useQuickNavigatorSearch.ts

          for component in QuickNavigatorHeader QuickNavigatorSearchField QuickNavigatorFolderGrid QuickNavigatorResults QuickNavigatorFooter; do
            test -f "src/FE/src/components/common/${component}.tsx" || { echo "Missing ${component}.tsx"; exit 40; }
            grep -q "import.*${component}" "$q" || { echo "${component} not imported by active QuickNavigator"; exit 41; }
            grep -q "<${component}" "$q" || { echo "${component} imported but not rendered"; exit 42; }
          done

          grep -q 'quick-nav-folder-grid' "$css" || { echo 'Folder grid CSS missing'; exit 43; }
          grep -q 'quick-nav-folder-card' "$css" || { echo 'Folder card CSS missing'; exit 44; }
          grep -q 'quick-nav-result-badge' "$css" || { echo 'Result badge CSS missing'; exit 45; }
          test -f "$hook" || { echo 'Search orchestration hook missing'; exit 46; }
          grep -q 'getApiCustomersSearch' "$hook" || { echo 'Generated customer search API is not hooked up'; exit 47; }
          grep -q 'useDebounce' "$hook" || { echo 'Remote debounce is not hooked up'; exit 48; }
          echo 'Static wiring proof passed.'

      - name: Focused authenticated QuickNavigator browser smoke
        env:
          WORKSLIP_PLAYWRIGHT_SCENARIO: quick-navigator
        shell: bash
        run: |
          set -euo pipefail
          bash src/FE/scripts/run-playwright-ephemeral.sh

      - name: Commit and push Kimi design
        shell: bash
        run: |
          set -euo pipefail
          git add src/FE/src/components/common
          git diff --cached --quiet && { echo 'Kimi produced no feature delta'; exit 50; }
          git commit -m 'RBJ-502: wire modular global search design'
          git push origin "$FEATURE_BRANCH"
          echo "Kimi design head: $(git rev-parse HEAD)"
