name: WOR-420 documentation validation

on:
  pull_request:
    branches:
      - release-4.0.1
  push:
    branches:
      - rbj--420-docs-audit-cleanup

permissions:
  contents: read

jobs:
  docs:
    name: Documentation truth check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate documentation
        run: python tools/docs/check_docs.py
