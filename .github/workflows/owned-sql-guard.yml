name: Owned SQL Guard

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'

permissions:
  contents: read

jobs:
  owned-sql-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test SQL ownership rules
        shell: pwsh
        run: ./tools/git/check-owned-sql.ps1 -SelfTest

      - name: Reject loose SQL artifacts
        shell: pwsh
        run: ./tools/git/check-owned-sql.ps1
