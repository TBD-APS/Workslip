name: WOR-551 temporary conversation generation

on:
  push:
    branches:
      - rbj--551-conversations-actions-v1

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rbj--551-conversations-actions-v1
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci
      - name: Generate branch-matched API client
        working-directory: src/FE
        run: node scripts/generate-api-client.mjs
      - name: Align notification renderer and Dapper schema contract
        shell: python
        run: |
          from pathlib import Path

          processor = Path('src/BE/WorkslipApi/Workslip.Infrastructure/Notifications/PushNotificationProcessor.cs')
          text = processor.read_text()
          old = '''        var (title, body) = _notificationService.GetLocalizedText(
                      notificationType,
                      payload.JobNumber,
                      payload.CustomerAddress,
                      payload.RecipientName,
                      payload.RejectionNote);'''
          new = '''        var (title, body) = _notificationService.GetLocalizedText(notificationType, payload);'''
          if old not in text:
              raise SystemExit('Expected PushNotificationProcessor localization call was not found.')
          processor.write_text(text.replace(old, new))

          contract = Path('src/BE/WorkslipApi/Workslip.Tests/Schema/SchemaModelContractTests.cs')
          text = contract.read_text()
          anchor = '''            ("KnowledgeDocumentAttachments", "wor455"),'''
          replacement = anchor + '''
                      ("JobConversationMessages", "wor551"),
                      ("JobConversationReads", "wor551"),'''
          if anchor not in text:
              raise SystemExit('Expected migration table contract anchor was not found.')
          contract.write_text(text.replace(anchor, replacement))
      - name: Commit generated contract and remove temporary workflow
        run: |
          rm .github/workflows/wor551-generate-conversations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "RBJ-551: generate conversation API client"
          git push origin HEAD:rbj--551-conversations-actions-v1
