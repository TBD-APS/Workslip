name: TEMP WOR-236 inspect report date flow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-wor236-discovery.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect report date and diverse-job flow
        run: |
          set -Eeuo pipefail
          echo '=== repository state ==='
          git status --short --branch
          echo
          echo '=== direct terminology matches ==='
          grep -RInE -C 6 'RapportDato|rapport.?dato|ReportDate|reportDate|report.?date|Diverse|diverse|Miscellaneous|miscellaneous' src/BE src/FE || true
          echo
          echo '=== list and summary contracts ==='
          grep -RInE -C 6 'JobListItemResponse|JobListItemViewModel|JobListResponse|ListAsyncCoreAsync|JobReportMapper|ToResponse' src/BE/WorkslipApi src/FE/src || true
          echo
          echo '=== worksheet date derivation candidates ==='
          grep -RInE -C 6 'WorkDate|workDate|Timesheets|timesheets|Min\(|Max\(|OrderBy\(' src/BE/WorkslipApi/Workslip.Application src/BE/WorkslipApi/Workslip.Infrastructure src/FE/src/features/jobs || true
          echo
          echo '=== report-date tests ==='
          grep -RInE -C 6 'ReportDate|reportDate|Diverse' src/BE/WorkslipApi/Workslip.Tests src/FE/src --include='*test*' --include='*.cs' --include='*.tsx' --include='*.ts' || true
