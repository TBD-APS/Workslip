name: TEMP WOR-236 inspect report date flow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-wor236-discovery.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect report date and diverse-job flow
        run: |
          set -Eeuo pipefail
          echo '=== repository state ==='
          git status --short --branch
          echo
          echo '=== direct terminology matches ==='
          rg -n -i -C 8 'rapport.?dato|report.?date|reportdate|diverse|miscellaneous' src/BE src/FE || true
          echo
          echo '=== job list / summary projection matches ==='
          rg -n -C 8 'JobSummary|JobList|GetJobs|ListJobs|ToSummary|JobViewModel|JobSummaryViewModel' src/BE/WorkslipApi src/FE/src || true
          echo
          echo '=== date-like job fields ==='
          rg -n -i -C 6 'completedat|completiondate|createdat|updatedat|report|date' src/BE/WorkslipApi/Workslip.Core src/BE/WorkslipApi/Workslip.Application src/BE/WorkslipApi/Workslip.Infrastructure src/BE/WorkslipApi/Endpoints 2>/dev/null || true
          echo
          echo '=== likely source files ==='
          find src/BE/WorkslipApi src/FE/src -type f \( -iname '*job*' -o -iname '*report*' \) | sort
