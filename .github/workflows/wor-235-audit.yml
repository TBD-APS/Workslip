name: TEMP - WOR-235 dependency candidates

on:
  push:
    branches:
      - rbj--235-frontend-audit-vulnerabilities
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Evaluate patched dependency candidates
        run: |
          cp package.json /tmp/wor235-package.json
          cp package-lock.json /tmp/wor235-package-lock.json

          evaluate() {
            label="$1"
            router_version="$2"
            pwa_version="$3"

            cp /tmp/wor235-package.json package.json
            cp /tmp/wor235-package-lock.json package-lock.json

            ROUTER_VERSION="$router_version" PWA_VERSION="$pwa_version" node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.ROUTER_VERSION) {
            pkg.dependencies['react-router-dom'] = process.env.ROUTER_VERSION;
          }
          if (process.env.PWA_VERSION) {
            pkg.devDependencies['vite-plugin-pwa'] = process.env.PWA_VERSION;
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

            echo "===== CANDIDATE: $label ====="
            if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
              echo "INSTALL_FAILED: $label"
              return
            fi

            npm audit --json > "/tmp/${label}-audit.json" || true
            LABEL="$label" node <<'NODE'
          const fs = require('node:fs');
          const label = process.env.LABEL;
          const audit = JSON.parse(fs.readFileSync(`/tmp/${label}-audit.json`, 'utf8'));
          console.log(JSON.stringify({
            label,
            metadata: audit.metadata,
            vulnerabilities: Object.fromEntries(Object.entries(audit.vulnerabilities ?? {}).map(([name, value]) => [name, {
              severity: value.severity,
              isDirect: value.isDirect,
              range: value.range,
              fixAvailable: value.fixAvailable,
            }])),
          }, null, 2));
          NODE
            npm ls react-router-dom react-router vite-plugin-pwa workbox-build brace-expansion --all || true
          }

          evaluate pwa-1.2 "" "1.2.0"
          evaluate router-7.11 "7.11.0" ""
          evaluate router-8.3 "8.3.0" ""
          evaluate router-8.3-pwa-1.2 "8.3.0" "1.2.0"
