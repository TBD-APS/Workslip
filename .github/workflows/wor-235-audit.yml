name: TEMP - WOR-235 upstream override candidates

on:
  push:
    branches:
      - rbj--235-frontend-audit-vulnerabilities
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Evaluate patched upstream overrides
        run: |
          cp package.json /tmp/wor235-package.json
          cp package-lock.json /tmp/wor235-package-lock.json

          npm view filelist versions --json
          npm view jake versions --json
          npm view ejs versions --json

          evaluate() {
            label="$1"
            cp /tmp/wor235-package.json package.json
            cp /tmp/wor235-package-lock.json package-lock.json

            LABEL="$label" node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          switch (process.env.LABEL) {
            case 'filelist-1.0.7':
              pkg.overrides = { filelist: '1.0.7' };
              break;
            case 'jake-10.9.5':
              pkg.overrides = { jake: '10.9.5' };
              break;
            case 'ejs-4.0.2':
              pkg.overrides = { ejs: '4.0.2' };
              break;
            case 'jake-10.9.5-filelist-1.0.7':
              pkg.overrides = { jake: '10.9.5', filelist: '1.0.7' };
              break;
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

            echo "===== CANDIDATE: $label ====="
            if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
              echo "INSTALL_FAILED: $label"
              return
            fi

            npm audit --json > "/tmp/${label}-audit.json" || true
            LABEL="$label" node <<'NODE'
          const fs = require('node:fs');
          const label = process.env.LABEL;
          const audit = JSON.parse(fs.readFileSync(`/tmp/${label}-audit.json`, 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const targets = ['@trickfilm400/rollup-plugin-off-main-thread', 'ejs', 'jake', 'filelist', 'minimatch', 'brace-expansion'];
          const resolved = Object.fromEntries(targets.map((target) => [
            target,
            Object.entries(lock.packages)
              .filter(([path]) => path === `node_modules/${target}` || path.endsWith(`/node_modules/${target}`))
              .map(([path, value]) => ({ path, version: value.version, dependencies: value.dependencies })),
          ]));
          console.log(JSON.stringify({
            label,
            vulnerabilities: audit.metadata?.vulnerabilities,
            vulnerablePackages: Object.keys(audit.vulnerabilities ?? {}),
            resolved,
          }, null, 2));
          NODE
          }

          evaluate filelist-1.0.7
          evaluate jake-10.9.5
          evaluate ejs-4.0.2
          evaluate jake-10.9.5-filelist-1.0.7
