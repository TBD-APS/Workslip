name: TEMP - WOR-235 apply dependency override

on:
  push:
    branches:
      - rbj--235-frontend-audit-vulnerabilities
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rbj--235-frontend-audit-vulnerabilities
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Apply EJS security override
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = { ...(pkg.overrides ?? {}), ejs: '5.0.1' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency resolution
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency files already current.'
            exit 0
          fi
          git config user.name 'workslip-validation-bot'
          git config user.email 'workslip-validation-bot@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'RBJ-235: override vulnerable EJS build dependency'
          git push origin HEAD:rbj--235-frontend-audit-vulnerabilities
