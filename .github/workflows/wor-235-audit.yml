name: TEMP - WOR-235 dependency overrides

on:
  push:
    branches:
      - rbj--235-frontend-audit-vulnerabilities
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Evaluate targeted dependency overrides
        run: |
          cp package.json /tmp/wor235-package.json
          cp package-lock.json /tmp/wor235-package-lock.json

          evaluate() {
            label="$1"
            cp /tmp/wor235-package.json package.json
            cp /tmp/wor235-package-lock.json package-lock.json

            LABEL="$label" node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          switch (process.env.LABEL) {
            case 'brace-global':
              pkg.overrides = { 'brace-expansion': '5.0.8' };
              break;
            case 'brace-scoped':
              pkg.overrides = { filelist: { minimatch: { 'brace-expansion': '5.0.8' } } };
              break;
            case 'workbox-7.4.0':
              pkg.overrides = { 'workbox-build': '7.4.0' };
              break;
            case 'router-7.18.2':
              pkg.dependencies['react-router-dom'] = '7.18.2';
              break;
            case 'router-7.18.2-brace':
              pkg.dependencies['react-router-dom'] = '7.18.2';
              pkg.overrides = { filelist: { minimatch: { 'brace-expansion': '5.0.8' } } };
              break;
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

            echo "===== CANDIDATE: $label ====="
            if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
              echo "INSTALL_FAILED: $label"
              return
            fi

            npm audit --json > "/tmp/${label}-audit.json" || true
            LABEL="$label" node <<'NODE'
          const fs = require('node:fs');
          const label = process.env.LABEL;
          const audit = JSON.parse(fs.readFileSync(`/tmp/${label}-audit.json`, 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const targets = ['react-router-dom', 'react-router', 'vite-plugin-pwa', 'workbox-build', 'filelist', 'minimatch', 'brace-expansion'];
          const resolved = Object.fromEntries(targets.map((target) => [
            target,
            Object.entries(lock.packages)
              .filter(([path]) => path === `node_modules/${target}` || path.endsWith(`/node_modules/${target}`))
              .map(([path, value]) => ({ path, version: value.version })),
          ]));
          console.log(JSON.stringify({
            label,
            vulnerabilities: audit.metadata?.vulnerabilities,
            vulnerablePackages: Object.keys(audit.vulnerabilities ?? {}),
            resolved,
          }, null, 2));
          NODE
          }

          evaluate baseline
          evaluate brace-global
          evaluate brace-scoped
          evaluate workbox-7.4.0
          evaluate router-7.18.2
          evaluate router-7.18.2-brace
