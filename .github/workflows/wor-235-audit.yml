name: TEMP - WOR-235 frontend dependency validation

on:
  pull_request:
    branches:
      - main
    paths:
      - src/FE/package.json
      - src/FE/package-lock.json
      - .github/workflows/wor-235-audit.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAPI_BASE_URL: https://api-mrsoftware-prod.azurewebsites.net

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v7
        with:
          ref: main
          path: baseline

      - name: Checkout candidate branch
        uses: actions/checkout@v7
        with:
          ref: rbj--235-frontend-audit-vulnerabilities
          path: candidate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install and generate baseline
        working-directory: baseline/src/FE
        run: |
          npm ci
          npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Install and generate candidate
        working-directory: candidate/src/FE
        run: |
          npm ci
          npx orval --config orval.config.ts
        env:
          VITE_API_BASE_URL: ${{ env.OPENAPI_BASE_URL }}

      - name: Verify dependency resolution
        working-directory: candidate/src/FE
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages ?? {};
          const ejs = packages['node_modules/ejs']?.version;
          if (ejs !== '5.0.1') {
            throw new Error(`Expected ejs@5.0.1, resolved ${ejs ?? 'nothing'}`);
          }
          for (const removed of ['node_modules/jake', 'node_modules/filelist']) {
            if (packages[removed]) {
              throw new Error(`Vulnerable build-chain package still resolved: ${removed}`);
            }
          }
          console.log('Resolved ejs@5.0.1 without jake/filelist runtime dependencies.');
          NODE

      - name: Verify audit result
        working-directory: candidate/src/FE
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const allowed = ['react-router', 'react-router-dom'];
          for (const file of ['npm-audit.json', 'npm-audit-production.json']) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            const packages = Object.keys(audit.vulnerabilities ?? {}).sort();
            const total = audit.metadata?.vulnerabilities?.total;
            if (total !== 2 || JSON.stringify(packages) !== JSON.stringify(allowed)) {
              throw new Error(`${file}: unexpected audit result ${JSON.stringify({ total, packages })}`);
            }
            console.log(`${file}: two residual React Router RSC-only findings.`);
          }
          NODE

      - name: Compare lint baseline and candidate
        run: |
          set +e
          (cd baseline/src/FE && npm run lint) > /tmp/main-lint.log 2>&1
          main_exit=$?
          (cd candidate/src/FE && npm run lint) > /tmp/candidate-lint.log 2>&1
          candidate_exit=$?
          set -e

          main_summary=$(grep -E 'problems \([0-9]+ errors, [0-9]+ warnings\)' /tmp/main-lint.log | tail -1 || true)
          candidate_summary=$(grep -E 'problems \([0-9]+ errors, [0-9]+ warnings\)' /tmp/candidate-lint.log | tail -1 || true)

          echo "Main lint exit: $main_exit"
          echo "Main lint summary: $main_summary"
          echo "Candidate lint exit: $candidate_exit"
          echo "Candidate lint summary: $candidate_summary"

          if [ -z "$main_summary" ] || [ -z "$candidate_summary" ]; then
            echo 'Unable to extract lint summaries.'
            cat /tmp/main-lint.log
            cat /tmp/candidate-lint.log
            exit 1
          fi

          if [ "$main_exit" -ne "$candidate_exit" ] || [ "$main_summary" != "$candidate_summary" ]; then
            echo 'Candidate changed the repository-wide lint result.'
            diff -u /tmp/main-lint.log /tmp/candidate-lint.log || true
            exit 1
          fi

          echo 'Candidate introduces no lint regression; main and candidate have the same existing lint debt.'

      - name: Run maintained frontend tests
        working-directory: candidate/src/FE
        run: npm test -- --run src

      - name: Build production frontend and PWA
        working-directory: candidate/src/FE
        run: npm run build
