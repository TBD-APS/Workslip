name: WOR-199 single-tenant logout validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wor-199-single-tenant.yml
      - src/BE/infrastructure/.wor-199-single-tenant.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: rbj--199-microsoft-full-logout
          fetch-depth: 0

      - name: Apply single-tenant registration change
        run: python3 src/BE/infrastructure/.wor-199-single-tenant.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'src/BE/infrastructure/deploy-entra.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate intended audience and diff
        run: |
          test "$(grep -c "signInAudience = 'AzureADMyOrg'" src/BE/infrastructure/deploy-entra.ps1)" -eq 2
          ! grep -q "AzureADandPersonalMicrosoftAccount" src/BE/infrastructure/deploy-entra.ps1
          grep -q "login_hint" src/BE/infrastructure/deploy-entra.ps1
          git diff --check

      - name: Commit validated change and remove temporary files
        run: |
          rm .github/workflows/wor-199-single-tenant.yml
          rm src/BE/infrastructure/.wor-199-single-tenant.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WOR-199: support promptless logout for tenant guests"
          git push origin HEAD:rbj--199-microsoft-full-logout
