name: Linear Release Sync

# Linear release management is a Business-plan feature. Keep this workflow
# available for manual use once the workspace plan supports releases, but do
# not run it automatically on pushes to main where it would fail every time.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear-release:
    name: Sync deployment with Linear release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync Linear release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          links: |
            GitHub=https://github.com/${{ github.repository }}/commit/${{ github.sha }}
