name: WOR-384 regenerate lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate:
    if: ${{ github.head_ref == 'rbj--384-repo-cleanup-dead-artifacts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Regenerate package lock
        working-directory: src/FE
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: wor-384-package-lock
          path: src/FE/package-lock.json
          if-no-files-found: error
          retention-days: 1
