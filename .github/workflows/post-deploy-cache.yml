name: Post Deploy – Clear Caches

on:
  workflow_dispatch:

jobs:
  clear-caches:
    runs-on: ubuntu-latest
    steps:
      - name: Get admin token
        id: token
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.BE_API_URL }}/api/dev/token" \
            -H "Content-Type: application/json" \
            -d '{"email":"${{ secrets.ADMIN_EMAIL_FOR_DEV_ENDPOINT }}"}')
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to get token. Response: $RESPONSE"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Clear BE + Vercel CDN caches
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.BE_API_URL }}/api/admin/cache/clear" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "$BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Cache clear failed with HTTP $HTTP_CODE"
            exit 1
          fi
