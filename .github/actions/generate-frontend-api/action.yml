name: Generate branch-matched frontend API client
description: Build the backend OpenAPI document and generate the frontend Orval client from the same commit.

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore API project
      shell: bash
      run: dotnet restore src/BE/WorkslipApi/Workslip.Api.csproj --nologo

    # Local development runs the same generator, so a CI-only contract path
    # cannot drift away from what developers generate.
    - name: Generate OpenAPI document and Orval client
      shell: bash
      working-directory: src/FE
      run: node scripts/generate-api-client.mjs --no-restore

    # Temporary WOR-479 validation handoff. Removed after the generated client
    # from this branch has been committed and before final exact-head validation.
    - name: Capture generated client for WOR-479
      uses: actions/upload-artifact@v7
      with:
        name: wor479-generated-api-${{ github.sha }}
        path: src/FE/src/api/generated
        if-no-files-found: error
        retention-days: 1

    # Vercel production deliberately does not call a remote dev/prod OpenAPI
    # endpoint. The generated client committed in the release SHA must therefore
    # already match the backend contract that CI just generated.
    - name: Require generated client to be committed
      shell: bash
      run: |
        set -Eeuo pipefail
        if ! git diff --exit-code -- src/FE/src/api/generated; then
          echo "::error::Generated frontend API client is stale. Run 'npm run generate:api:local' in src/FE and commit the generated changes."
          exit 1
        fi
