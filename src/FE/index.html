<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Workslip - Den digitale arbejdsseddel til VVS-virksomheder. KLS-compliant, nem at bruge, og fuldt integreret jobflow." />
    <title>Workslip | Din samarbejdspartner</title>

    <!-- iOS PWA capability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workslip" />

    <!-- iOS Touch Icon -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <div id="portal-root"></div>
    <script>
      (() => {
        const entries = [];
        const push = (entry) => {
          if (entries.length >= 20) entries.shift();
          entries.push(entry);
        };
        const onError = (event) => {
          push({
            kind: 'error',
            message: String(event.message || 'Early resource error'),
            filename: event.filename ? String(event.filename).split(/[?#]/, 1)[0] : '',
            lineno: Number(event.lineno || 0),
            colno: Number(event.colno || 0),
            error: event.error,
          });
        };
        const onRejection = (event) => {
          push({ kind: 'rejection', reason: event.reason });
        };

        window.__WORKSLIP_EARLY_ERROR_BUFFER__ = { entries, onError, onRejection };
        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', onRejection);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
