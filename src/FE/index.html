<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Workslip - Den digitale arbejdsseddel til VVS-virksomheder. KLS-compliant, nem at bruge, og fuldt integreret jobflow." />
    <title>Workslip | Din samarbejdspartner</title>

    <!-- PWA capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workslip" />

    <!-- iOS Touch Icon -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <div id="portal-root"></div>
    <script>
      (() => {
        const storageKey = 'workslip.earlyErrors';
        const maxEntries = 20;
        const maxAgeMs = 24 * 60 * 60 * 1000;
        const now = Date.now();

        const fingerprint = (value) => {
          const text = String(value || 'Early browser error');
          let hash = 2166136261;
          for (let index = 0; index < text.length; index += 1) {
            hash ^= text.charCodeAt(index);
            hash = Math.imul(hash, 16777619);
          }
          return (hash >>> 0).toString(16).padStart(8, '0');
        };

        const normalizeFilename = (value) => {
          if (!value) return '';
          try {
            return new URL(String(value), window.location.href).pathname
              .replace(/\/[0-9a-f]{8}-[0-9a-f-]{27}/gi, '/:id')
              .replace(/\/\d+(?=\/|$)/g, '/:id')
              .slice(0, 240);
          } catch {
            return '';
          }
        };

        let entries = [];
        try {
          const stored = JSON.parse(sessionStorage.getItem(storageKey) || '[]');
          if (Array.isArray(stored)) {
            entries = stored
              .filter((entry) => entry && Number(entry.capturedAt) >= now - maxAgeMs)
              .slice(-maxEntries);
          }
        } catch {
          entries = [];
        }

        const persist = () => {
          try {
            const safeEntries = entries.map(({ error, reason, ...entry }) => entry);
            sessionStorage.setItem(storageKey, JSON.stringify(safeEntries));
          } catch {
            // In-memory capture still works when storage is unavailable.
          }
        };

        const push = (entry) => {
          if (entries.length >= maxEntries) entries.shift();
          entries.push(entry);
          persist();
        };

        const onError = (event) => {
          const message = String(event.message || 'Early resource error');
          push({
            kind: 'error',
            capturedAt: Date.now(),
            message: `EarlyError [${fingerprint(message)}]`,
            filename: normalizeFilename(event.filename),
            lineno: Number(event.lineno || 0),
            colno: Number(event.colno || 0),
            error: event.error,
          });
        };

        const onRejection = (event) => {
          const reason = event.reason instanceof Error
            ? `${event.reason.name}:${event.reason.message}`
            : String(event.reason || 'Early promise rejection');
          push({
            kind: 'rejection',
            capturedAt: Date.now(),
            message: `EarlyRejection [${fingerprint(reason)}]`,
            reason: event.reason,
          });
        };

        window.__WORKSLIP_EARLY_ERROR_BUFFER__ = {
          entries,
          onError,
          onRejection,
          storageKey,
        };
        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', onRejection);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
