server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every location that declares no add_header of its own.
    # nginx REPLACES an inherited add_header set instead of merging into it, so
    # every location below that adds a Cache-Control repeats these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        proxy_pass http://127.0.0.1:5262/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5262;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # vite.config.ts emits every JS/CSS bundle under /assets/ with a content
    # hash (assets/app-[hash].js, assets/chunks/[name]-[hash].js), so a URL
    # here never changes meaning and may be cached for a year. A hash that no
    # longer exists must 404 instead of falling through to the SPA shell below,
    # otherwise the browser is handed HTML where it asked for JavaScript.
    # Cache-Control is deliberately not "always": a 404 must not be cached.
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # scripts/sync-fonts.mjs materialises version-pinned filenames
    # (inter-latin-wght-normal-v5.3.0.woff2), so the URL changes whenever the
    # font does. Only .woff2 is immutable; /fonts/OFL-1.1.txt is not.
    location ~* ^/fonts/.+\.woff2$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker decides when installed clients pick up a new build, so
    # a cached copy strands them on the old one. vite-plugin-pwa emits it at the
    # document root as /sw.js (injectManifest strategy, filename 'sw.ts').
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # The navigation shell names the hashed assets, so a stale copy points at a
    # build whose assets are gone. The SPA fallback below is an internal
    # redirect to /index.html, which re-enters location matching, so this policy
    # covers every client-side route as well as the literal path.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # nginx's bundled mime.types has no .webmanifest entry, so without this the
    # PWA manifest is served as application/octet-stream and is not reliably
    # processed as a manifest. The static host this app was served from before
    # supplied application/manifest+json implicitly; nginx has to be told.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # charset makes this "text/plain; charset=utf-8" rather than bare text/plain.
    location = /robots.txt {
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
