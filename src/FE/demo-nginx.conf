server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every location that declares no add_header of its own.
    # nginx REPLACES an inherited add_header set instead of merging into it, so
    # every location below that adds a Cache-Control repeats these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5262;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Demo serves the same Vite build as live, so it needs the same caching
    # contract; see nginx.conf for why each block exists.
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/fonts/.+\.woff2$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # nginx's bundled mime.types has no .webmanifest entry, so without this the
    # PWA manifest is served as application/octet-stream and is not reliably
    # processed as a manifest. The static host this app was served from before
    # supplied application/manifest+json implicitly; nginx has to be told.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location = /robots.txt {
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
