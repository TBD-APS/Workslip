title: Workslip
description: Digital planlægning, registrering og godkendelse af arbejde.
url: "https://tbd-aps.github.io"
baseurl: "/Workslip"
lang: da-DK
timezone: Europe/Copenhagen
repository: TBD-APS/Workslip

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
