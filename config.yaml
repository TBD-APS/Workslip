backend:
  type: local
  cwd: .

systems:
  - name: example
    shell: bash
    startup:
      - cat > main.py << 'EOF'
        def fibonacci(n):
            a, b = 0, 1
            for i in range(n):
                print(a)
                a, b = b, a + b

        if __name__ == "__main__":
            fibonacci(10)
        EOF
      - python main.py

web:
  backend: serpapi
  api_key: "your-serpapi-key"

models:
  - name: default
    backend: openai
    api_key: $OPENAI_API_KEY

  - name: vision
    backend: openai
    api_key: $OPENAI_API_KEY

  - name: auxiliary
    backend: local
    model: devstral-small-2